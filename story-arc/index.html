<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Arc Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <!-- PDF.js para extração client-side -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    @font-face {
      font-family: 'PPFragment';
      src: url('../plataforma/fonts/PPFragment-SerifLight.woff') format('woff');
      font-weight: 300; font-display: swap;
    }
    @font-face {
      font-family: 'PPFragment';
      src: url('../plataforma/fonts/PPFragment-SerifRegular.otf') format('opentype');
      font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: 'Ekstra';
      src: url('../plataforma/fonts/Ekstra-Regular.otf') format('opentype');
      font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: 'Ekstra';
      src: url('../plataforma/fonts/Ekstra-Medium.otf') format('opentype');
      font-weight: 500; font-display: swap;
    }

    :root {
      --bg-canvas:      #ffffff;
      --bg-surface:     #ffffff;
      --bg-active:      #fafffd;
      --border-default: #d9d9d9;
      --border-subtle:  #e8e8e8;
      --border-accent:  rgba(50,238,102,0.35);
      --text-primary:   #111111;
      --text-secondary: #555555;
      --text-tertiary:  #999999;
      --accent:         #32EE66;
      --accent-light:   #E5FCF0;
      --accent-hover:   #22D955;
      --shadow-sm:      0 1px 4px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md:      0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
      --radius-md:      8px;
      --radius-sm:      4px;
      --font-editorial: 'PPFragment', Georgia, serif;
      --font-ui:        'Ekstra', system-ui, sans-serif;
      --topbar-h:       52px;
      --sidebar-w:      260px;
      --ease:           cubic-bezier(0.2,0,0,1);
      --fast:           140ms;
      --normal:         220ms;

      /* aliases para compatibilidade com seletores existentes */
      --bg:             var(--bg-canvas);
      --surface:        var(--bg-surface);
      --border:         var(--border-default);
      --border-light:   var(--border-subtle);
      --text:           var(--text-primary);
      --text-dim:       var(--text-secondary);
      --text-subtle:    var(--text-tertiary);
      --radius:         var(--radius-md);
      --shadow:         var(--shadow-sm);
    }

    /* ── DARK MODE ── */
    :root.dark-mode {
      --bg-canvas:      #1f1f1f;
      --bg-surface:     #1f1f1f;
      --bg-active:      #252525;
      --border-default: #4a4a4a;
      --border-subtle:  #3a3a3a;
      --border-accent:  rgba(50,238,102,0.25);
      --text-primary:   #f0f0f0;
      --text-secondary: #a8a8a8;
      --text-tertiary:  #767676;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 400;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    .header {
      border-bottom: 1px solid var(--border-subtle);
      height: var(--topbar-h);
      padding: 0 20px 0 0;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      background: var(--bg-surface);
      z-index: 100;
    }

    .logo {
      width: var(--sidebar-w);
      flex-shrink: 0;
      display: flex; align-items: center; gap: 10px;
      height: 100%; padding: 0 20px;
    }
    .logo a { display: flex; align-items: center; line-height: 0; text-decoration: none; }

    .header-center {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 6px;
    }
    .header-breadcrumb {
      font-size: 13px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-breadcrumb-sep { color: var(--border-default); }
    .header-breadcrumb-current {
      color: var(--text-primary);
      font-weight: 500;
    }

    .header-right {
      display: flex; align-items: center; gap: 8px;
    }

    /* dark mode toggle — idêntico ao da library */
    .dark-mode-toggle {
      width: 48px; height: 28px;
      background: #d0d0d0; border: none; border-radius: 99px;
      cursor: pointer; transition: all var(--normal);
      user-select: none; position: relative; padding: 2px;
      display: flex; align-items: center;
    }
    .dark-mode-toggle:hover { background: #c0c0c0; }
    .dark-mode-toggle.active { background: #3a3a3a; }
    .dark-mode-toggle.active:hover { background: #4a4a4a; }
    .toggle-dot {
      width: 24px; height: 24px;
      background: white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--normal);
      color: #666; font-size: 12px;
      position: absolute; left: 2px;
    }
    .dark-mode-toggle.active .toggle-dot {
      background: #5a5a5a;
      left: calc(100% - 26px);
      color: #888;
    }

    .header-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .tagline { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 400; }

    /* ── LAYOUT ── */
    .main-workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      border-right: 1px solid var(--border-light);
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      transition: width 0.28s var(--ease), border-color 0.28s var(--ease);
    }

    /* ── SIDEBAR FOOTER (Config) ── */
    .sb-footer {
      margin-top: auto;
      position: sticky;
      bottom: 0;
      background: var(--bg);
      border-top: 1px solid var(--border-light);
      z-index: 10;
    }
    .sb-config-panel {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.28s var(--ease), padding 0.22s var(--ease), opacity 0.2s var(--ease);
      padding: 0 20px;
      opacity: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sb-config-panel.open {
      max-height: 200px;
      padding: 16px 20px;
      opacity: 1;
      border-bottom: 1px solid var(--border-light);
    }
    .sb-config-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 13px 20px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      transition: color 0.14s;
    }
    .sb-config-btn:hover { color: var(--text); }
    .sb-config-btn .cfg-icon { font-size: 13px; }
    .sidebar.collapsed {
      width: 0;
      border-right-color: transparent;
    }

    /* ── SIDEBAR BLOCKS ── */
    .sb-block { border-bottom: 1px solid var(--border-light); }
    .sb-block-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.14s;
    }
    .sb-block-header:hover { background: var(--bg-canvas); }
    .sb-num {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-subtle);
      font-family: var(--font-ui);
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }
    .sb-title {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text);
      flex: 1;
      font-family: var(--font-ui);
    }
    .sb-chevron {
      font-size: 11px;
      color: var(--text-subtle);
      transition: transform 0.22s var(--ease);
      flex-shrink: 0;
      line-height: 1;
    }
    .sb-block.closed .sb-chevron { transform: rotate(-90deg); }
    .sb-config-btn .cfg-chevron {
      font-size: 11px;
      color: var(--text-subtle);
      transition: transform 0.22s var(--ease);
      margin-left: auto;
    }
    .sb-config-panel.open ~ button .cfg-chevron { transform: rotate(180deg); }
    .sb-block-body {
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      max-height: 800px;
      transition: max-height 0.28s var(--ease), padding 0.22s var(--ease), opacity 0.2s var(--ease);
      opacity: 1;
    }
    .sb-block.closed .sb-block-body {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      opacity: 0;
    }

    /* ── SIDEBAR FIELDS ── */
    .sb-field { display: flex; flex-direction: column; gap: 5px; }
    .sb-label {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      font-family: var(--font-ui);
    }
    .sb-input, .sb-textarea, .sb-select {
      background: var(--bg);
      border: 1px solid var(--border-light);
      color: var(--text);
      padding: 7px 10px;
      font-family: var(--font-ui);
      font-size: 13px;
      border-radius: var(--radius-sm);
      outline: none;
      width: 100%;
      transition: border-color 0.14s, box-shadow 0.14s;
    }
    .sb-input:hover, .sb-textarea:hover, .sb-select:hover { border-color: var(--border); }
    .sb-input:focus, .sb-textarea:focus, .sb-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-light);
    }
    .sb-input::placeholder, .sb-textarea::placeholder { color: var(--text-subtle); }
    .sb-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
    .sb-select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 28px; }
    .sb-select-wrap { position: relative; }
    .sb-select-wrap::after {
      content: '↓';
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font-size: 10px; color: var(--text-dim); pointer-events: none;
    }

    /* ── PROTAGONIST UPLOAD ── */
    .prot-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .prot-upload-btn {
      background: transparent; border: none;
      color: var(--text-dim); font-family: inherit;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em;
      cursor: pointer; padding: 0;
      text-decoration: underline; text-underline-offset: 2px;
      white-space: nowrap; transition: color 0.15s;
    }
    .prot-upload-btn:hover { color: var(--text); }
    .prot-file-info {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; color: var(--text-subtle); margin-top: 4px;
    }
    .prot-file-info button {
      background: none; border: none; cursor: pointer;
      font-size: 10px; color: var(--text-subtle); padding: 0; font-family: inherit;
    }
    .prot-file-info button:hover { color: var(--text); }

    /* ── CONTENT AREA ── */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .content-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 20px;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg);
      flex-shrink: 0;
      min-width: 0;
      height: 48px;
    }
    .sidebar-toggle {
      background: transparent; border: none;
      cursor: pointer; color: var(--text-subtle);
      font-size: 15px; line-height: 1;
      padding: 4px 6px; border-radius: var(--radius-sm);
      flex-shrink: 0; transition: color 0.14s, background 0.14s;
    }
    .sidebar-toggle:hover { color: var(--text); background: var(--accent-light); }

    /* ── GENERATE BUTTON ── */
    .btn-generate {
      background: var(--accent); color: #0f0f0f;
      border: none; padding: 8px 20px;
      font-family: var(--font-ui); font-size: 12px; font-weight: 500;
      cursor: pointer; border-radius: var(--radius-sm);
      transition: background 0.14s, transform 0.1s;
      white-space: nowrap; height: 34px;
      flex-shrink: 0; letter-spacing: 0.04em;
    }
    .btn-generate:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-generate:active:not(:disabled) { transform: scale(0.98); }
    .btn-generate:disabled { background: var(--border-light); color: var(--text-subtle); cursor: not-allowed; }

    /* ── SCRIPT AREA ── */
    .script-area {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
    }
    /* hints ocupam toda a célula do grid */
    .hints-outer { grid-column: 1 / -1; }

    /* ── EMPTY STATE ── */
    .empty-state {
      grid-column: 1 / -1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; padding: 80px 32px;
    }
    .empty-title {
      font-family: var(--font-editorial);
      font-size: clamp(32px, 5vw, 64px);
      font-weight: 300; color: var(--border-light);
      letter-spacing: -0.02em;
      text-align: center; line-height: 1;
    }
    .empty-dots { display: flex; gap: 8px; align-items: center; }
    .empty-dot  { width: 5px; height: 5px; border-radius: 50%; background: var(--border-light); }
    .empty-sub  { font-size: 10px; color: var(--text-subtle); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 400; }

    /* ── ACT COLUMNS ── */
    .act-column {
      border-right: 1px solid var(--border-light);
      display: flex; flex-direction: column;
      opacity: 0; transform: translateY(12px);
      transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
    }
    .act-column:last-child { border-right: none; }
    .act-column.visible { opacity: 1; transform: translateY(0); }
    .act-column:nth-child(1) { transition-delay: 0.00s; }
    .act-column:nth-child(2) { transition-delay: 0.08s; }
    .act-column:nth-child(3) { transition-delay: 0.16s; }
    .act-column:nth-child(4) { transition-delay: 0.24s; }
    .act-column:nth-child(5) { transition-delay: 0.32s; }

    .act-header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border-light);
      position: sticky; top: 0;
      background: var(--bg); z-index: 10;
      box-shadow: var(--shadow);
    }
    .act-number { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 6px; font-weight: 400; font-family: var(--font-ui); }
    .act-name   { font-family: var(--font-editorial); font-size: 1.25rem; font-weight: 300; letter-spacing: -0.01em; line-height: 1.1; color: var(--text); }
    .act-desc   { font-size: 11px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; font-weight: 400; }

    .act-body { padding: 20px 18px; flex: 1; }
    .act-content {
      font-family: 'Space Mono', monospace;
      font-size: 11.5px; font-weight: 400;
      line-height: 1.9; color: var(--text);
      white-space: pre-wrap; word-break: break-word;
    }
    .act-content.is-loading { color: var(--text-subtle); }

    .cursor-blink {
      display: inline-block; width: 6px; height: 13px;
      background: var(--accent); margin-left: 1px;
      vertical-align: text-bottom;
      animation: blink 0.7s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── ACT HEADER ACTIONS ── */
    .act-name-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .act-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .act-icon-btn {
      width: 26px; height: 26px; flex-shrink: 0;
      background: transparent; border: 1px solid var(--border-light); color: var(--text-subtle);
      border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.14s, color 0.14s, background 0.14s; padding: 0;
    }
    .act-icon-btn svg { width: 11px; height: 11px; }
    .act-icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .act-icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .act-icon-btn.spinning svg { animation: spin 0.7s linear infinite; }
    .act-icon-btn.editing { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ── EDITABLE ACT ── */
    .act-content[contenteditable="true"] {
      outline: none;
      background: var(--accent-light);
      border-radius: 3px;
      padding: 4px 6px;
      margin: -4px -6px;
      box-shadow: inset 0 0 0 1px var(--accent);
      caret-color: var(--accent);
    }
    :root.dark-mode .act-content[contenteditable="true"] {
      background: rgba(50,238,102,0.08);
    }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      border-top: 1px solid var(--border-light);
      padding: 12px 18px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); grid-column: 1 / -1;
    }
    .bottom-bar-btns { display: flex; gap: 8px; }
    .btn-copy-all, .btn-download {
      background: transparent; border: 1px solid var(--border-light); color: var(--text-dim);
      padding: 6px 14px; font-family: var(--font-ui); font-size: 11px; font-weight: 400;
      letter-spacing: 0.05em; text-transform: uppercase;
      cursor: pointer; border-radius: var(--radius-sm); transition: all 0.14s;
    }
    .btn-copy-all:hover, .btn-download:hover { border-color: var(--border); color: var(--text); }
    .generation-meta { font-size: 10px; color: var(--text-subtle); letter-spacing: 0.06em; text-transform: uppercase; }

    /* alias para compatibilidade com renderLoading */
    .regen-btn { display: none; }
    .copy-btn  { display: none; }

    /* ── BRIEFING IMPORT ── */
    .briefing-import-drop {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      border: 1px dashed var(--border-light); border-radius: var(--radius-sm);
      cursor: pointer; transition: border-color 0.14s, background 0.14s;
    }
    .briefing-import-drop:hover,
    .briefing-import-drop.drag-over { border-color: var(--accent); background: var(--accent-light); }
    .bi-icon { font-size: 13px; color: var(--text-subtle); flex-shrink: 0; }
    .bi-text  { font-size: 11px; color: var(--text-dim); flex: 1; }
    .bi-types { font-size: 9px; color: var(--text-subtle); letter-spacing: 0.07em; text-transform: uppercase; flex-shrink: 0; }
    .bi-file-row { display: flex; align-items: center; gap: 8px; width: 100%; }
    .bi-filename { font-size: 11px; color: var(--text); font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bi-btn {
      background: var(--accent); color: #0f0f0f; border: none;
      padding: 4px 12px; font-family: var(--font-ui); font-size: 11px; font-weight: 500;
      cursor: pointer; border-radius: var(--radius-sm); white-space: nowrap; transition: background 0.14s;
    }
    .bi-btn:hover { background: var(--accent-hover); }
    .bi-btn:disabled { background: var(--border-light); color: var(--text-subtle); cursor: not-allowed; }
    .bi-remove { background: none; border: none; font-size: 13px; color: var(--text-subtle); cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0; }
    .bi-remove:hover { color: var(--text); }

    /* ── SLIDER ── */
    .slider-row { display: flex; align-items: center; gap: 8px; }
    input[type=range].range-field {
      -webkit-appearance: none; appearance: none;
      flex: 1; height: 2px; background: var(--border);
      outline: none; cursor: pointer; border: none; padding: 0;
    }
    input[type=range].range-field::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px; border-radius: 50%; background: var(--text); cursor: pointer;
    }
    .slider-val { font-family: inherit; font-size: 11px; color: var(--text-dim); min-width: 28px; text-align: right; }

    /* ── HEADER SLIDER ── */
    .header-slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      max-width: 320px;
    }
    .header-slider-wrap input[type=range] { min-width: 0; flex: 1; }
    .header-slider-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-subtle);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── HINTS ── */
    .hints-outer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 40px 24px;
      gap: 0;
    }
    .hints-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .hints-logo {
      font-family: var(--font-editorial);
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--text);
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      line-height: 1.1;
    }
    .hints-by { color: var(--text-subtle); }
    .hints-sub {
      font-size: 10px;
      color: var(--text-subtle);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--font-ui);
    }
    .hints-divider {
      width: 100%;
      max-width: 400px;
      height: 1px;
      background: var(--border-light);
      margin-bottom: 0;
    }
    .hints-wrap {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 400px;
    }
    .hint-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-light);
      opacity: 0;
      transform: translateY(4px);
      animation: hintIn 0.3s var(--ease) forwards;
    }
    .hint-item:last-child { border-bottom: none; }
    .hint-item:nth-child(1) { animation-delay: 0.05s; }
    .hint-item:nth-child(2) { animation-delay: 0.12s; }
    .hint-item:nth-child(3) { animation-delay: 0.19s; }
    .hint-item:nth-child(4) { animation-delay: 0.26s; }
    .hint-item:nth-child(5) { animation-delay: 0.33s; }
    .hint-item:nth-child(6) { animation-delay: 0.40s; }
    @keyframes hintIn { to { opacity: 1; transform: translateY(0); } }
    .hint-num {
      font-family: var(--font-ui);
      font-size: 9px;
      color: var(--accent);
      font-weight: 500;
      flex-shrink: 0;
      padding-top: 2px;
      min-width: 20px;

      font-size: 11px;
      font-weight: 500;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 3px;
      font-family: var(--font-ui);

    .hint-desc { font-size: 11px; color: var(--text-dim); line-height: 1.6; }

<script>
const ACTS = [
  { key: 'scene',    name: 'SET THE SCENE',     label: '01 — SETUP',             desc: 'Apresente o mundo, o protagonista e os stakes.' },
  { key: 'ruin',     name: 'RUIN THINGS',        label: '02 — INCITING INCIDENT', desc: 'O evento que quebra o equilíbrio e gera o conflito.' },
  { key: 'breaking', name: 'THE BREAKING POINT', label: '03 — CLIMAX',            desc: 'Tudo se intensifica. O momento de maior tensão.' },
  { key: 'cleanup',  name: 'CLEAN UP THE MESS',  label: '04 — RESOLUTION',        desc: 'Consequências. O protagonista enfrenta o que gerou.' },
  { key: 'wrap',     name: 'WRAP IT UP',          label: '05 — DENOUEMENT',        desc: 'O novo normal. O que mudou no protagonista.' }
];

let currentScript = null;

/* ── SIDEBAR TOGGLE ── */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

/* ── ACCORDION BLOCKS ── */
function toggleBlock(header) {
  header.closest('.sb-block').classList.toggle('closed');
}

/* ── TOGGLE CONFIG ── */
function toggleConfig() {
  const panel   = document.getElementById('configPanel');
  const chevron = document.querySelector('#configBtn .cfg-chevron');
  const isOpen  = panel.classList.toggle('open');
  if (chevron) chevron.style.transform = isOpen ? 'rotate(180deg)' : '';
}

/* ── INIT: fecha blocos sem transição (exceto Materiais) ── */
(function init() {
  const blocks = document.querySelectorAll('.sb-block');
  blocks.forEach(b => {
    const body = b.querySelector('.sb-block-body');
    if (body) body.style.transition = 'none';
    if (b.id !== 'block-materiais') b.classList.add('closed');
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    blocks.forEach(b => {
      const body = b.querySelector('.sb-block-body');
      if (body) body.style.transition = '';
    });
  }));

  // Auto-recolhe seção quando usuário sai de um campo preenchido
  document.querySelectorAll('.sb-block .sb-input, .sb-block .sb-textarea, .sb-block .sb-select').forEach(field => {
    field.addEventListener('blur', () => {
      const block = field.closest('.sb-block');
      if (!block) return;
      // Pequeno delay para não fechar se o usuário clicar em outro campo da mesma seção
      setTimeout(() => {
        const focused = block.querySelector(':focus');
        if (!focused && field.value.trim()) block.classList.add('closed');
      }, 150);
    });
  });
})();

/* ── BRIEFING IMPORT ── */
const BriefingImport = (() => {
  let _data = null;

  function pick() { document.getElementById('briefingFileInput').click(); }

  function onDragOver(e) { e.preventDefault(); document.getElementById('briefingDrop').classList.add('drag-over'); }
  function onDragLeave()  { document.getElementById('briefingDrop').classList.remove('drag-over'); }
  function onDrop(e) {
    e.preventDefault();
    document.getElementById('briefingDrop').classList.remove('drag-over');
    const f = e.dataTransfer.files[0]; if (f) processFile(f);
  }
  function onFile(e) { const f = e.target.files[0]; if (f) processFile(f); e.target.value = ''; }

  function processFile(file) {
    const name = file.name.toLowerCase();
    const showReady = (data) => {
      _data = data;
      document.getElementById('briefingBarContent').innerHTML = `
        <div class="bi-file-row">
          <span class="bi-filename">${file.name}</span>
          <button class="bi-btn" id="biExtractBtn" onclick="BriefingImport.extract(event)">↓ Preencher campos</button>
          <button class="bi-remove" onclick="BriefingImport.remove(event)">✕</button>
        </div>`;
    };
    const showLoading = () => {
      document.getElementById('briefingBarContent').innerHTML = `
        <div class="bi-file-row">
          <span class="bi-filename">${file.name}</span>
          <span class="bi-text" style="color:var(--text-subtle);font-size:11px;">Lendo PDF…</span>
        </div>`;
    };

    if (name.endsWith('.txt') || name.endsWith('.md')) {
      const reader = new FileReader();
      reader.onload = ev => showReady({ text: ev.target.result, name: file.name, type: 'text' });
      reader.readAsText(file);

    } else if (name.endsWith('.pdf')) {
      showLoading();
      const reader = new FileReader();
      reader.onload = async ev => {
        try {
          // Configura worker PDF.js
          if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc =
              'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            const typedArr = new Uint8Array(ev.target.result);
            const pdf = await window.pdfjsLib.getDocument({ data: typedArr }).promise;
            let fullText = '';
            for (let p = 1; p <= pdf.numPages; p++) {
              const page    = await pdf.getPage(p);
              const content = await page.getTextContent();
              fullText += content.items.map(i => i.str).join(' ') + '\n';
            }
            fullText = fullText.replace(/\s{3,}/g, '\n').trim();
            if (fullText.length > 18000) fullText = fullText.slice(0, 18000) + '\n[... truncado]';
            showReady({ text: fullText, name: file.name, type: 'text' });
          } else {
            // Fallback: manda como base64 para Gemini inlineData
            const bytes = new Uint8Array(ev.target.result);
            let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
            showReady({ base64: btoa(bin), mime: 'application/pdf', name: file.name, type: 'pdf' });
          }
        } catch (err) {
          showError('Erro ao ler PDF: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);

    } else { alert('Use PDF, TXT ou MD para o briefing.'); }
  }

  async function extract(e) {
    if (e) e.stopPropagation();
    if (!_data) return;
    const modelo = document.getElementById('modelo').value;
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) { showError('Insira sua API Key para extrair o briefing.'); return; }
    const btn = document.getElementById('biExtractBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Analisando…'; }

    const extractPrompt = `Você é especialista em análise de briefings publicitários e criativos.
Analise o documento e extraia os campos abaixo. Se um campo não estiver no documento, retorne string vazia "".

Retorne SOMENTE este JSON válido, sem explicações, sem markdown:
{"marca":"","publico":"","historia":"","insight":""}

Definições:
- marca: nome da empresa, marca ou produto anunciante
- publico: público-alvo, target, persona ou audiência descrita
- historia: resumo da campanha, projeto ou ideia central em 1-2 frases
- insight: insight estratégico, verdade humana, conceito criativo ou tagline

Documento:`;

    try {
      let result;
      if (modelo.startsWith('claude')) {
        // TXT/MD com Claude
        const content = `${extractPrompt}\n\n${_data.text}`;
        result = await callClaude(content, modelo, apiKey, 512);
      } else {
        // Gemini — PDF via inlineData ou texto direto
        let contents;
        if (_data.type === 'pdf') {
          contents = [{ parts: [{ text: extractPrompt }, { inlineData: { mimeType: _data.mime, data: _data.base64 } }] }];
        } else {
          contents = [{ parts: [{ text: `${extractPrompt}\n\n${_data.text}` }] }];
        }
        const schema = {
          type: "OBJECT",
          properties: {
            marca: { type:"STRING" }, publico: { type:"STRING" },
            historia: { type:"STRING" }, insight: { type:"STRING" }
          },
          required: ["marca","publico","historia","insight"]
        };
        const r = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${encodeURIComponent(apiKey)}`,
          { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ contents, generationConfig:{ temperature:0.2, responseMimeType:"application/json", responseSchema:schema } }) }
        );
        if (!r.ok) { const err=await r.json().catch(()=>({})); throw new Error(`[${r.status}] ${err.error?.message||r.statusText}`); }
        const d = await r.json();
        result = JSON.parse(d.candidates?.[0]?.content?.parts?.[0]?.text || '{}');
      }

      // Animação: abre bloco Briefing → preenche campo a campo → fecha
      const block = document.getElementById('block-briefing');
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      const flashFill = (id, val) => {
        const el = document.getElementById(id);
        if (!el || !val) return;
        el.value = val;
        el.style.transition = 'background 0.2s';
        el.style.background = 'rgba(50,238,102,0.15)';
        setTimeout(() => { el.style.background = ''; }, 600);
      };

      block.classList.remove('closed');
      await sleep(320);

      const fields = [
        { id: 'marca',    val: result.marca },
        { id: 'publico',  val: result.publico },
        { id: 'historia', val: result.historia },
        { id: 'insight',  val: result.insight },
      ].filter(f => f.val);

      for (const f of fields) {
        flashFill(f.id, f.val);
        await sleep(300);
      }

      await sleep(900);
      block.classList.add('closed');

      document.getElementById('briefingBarContent').innerHTML = `
        <div class="bi-file-row">
          <span class="bi-icon" style="color:var(--accent);">✓</span>
          <span class="bi-text">Briefing extraído de <strong>${_data.name}</strong> — revise os campos</span>
          <button class="bi-remove" onclick="BriefingImport.remove(event)">✕</button>
        </div>`;
    } catch(err) {
      showError('Erro ao extrair briefing: ' + err.message);
      if (btn) { btn.disabled = false; btn.textContent = '↓ Preencher campos'; }
    }
  }

  function remove(e) {
    if (e) e.stopPropagation();
    _data = null;
    document.getElementById('briefingBarContent').innerHTML = `
      <span class="bi-icon">↑</span>
      <span class="bi-text">Subir briefing para preencher os campos</span>
      <span class="bi-types">PDF · MD · TXT</span>`;
    document.getElementById('briefingFileInput').value = '';
  }

  return { pick, onDragOver, onDragLeave, onDrop, onFile, extract, remove };
})();

/* ── PERSONA UPLOAD ── */
const PersonaUpload = (() => {
  function onFile(e) {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      document.getElementById('protagonista').value = ev.target.result;
      document.getElementById('personaFileName').textContent = f.name;
      document.getElementById('personaFileInfo').style.display = 'flex';
    };
    reader.readAsText(f); e.target.value = '';
  }
  function remove() {
    document.getElementById('protagonista').value = '';
    document.getElementById('personaFileInfo').style.display = 'none';
    document.getElementById('personaFileInput').value = '';
  }
  return { onFile, remove };
})();

function updateApiKeyLabel() {
  const modelo = document.getElementById('modelo').value;
  const label  = document.getElementById('apiKeyLabel');
  const input  = document.getElementById('apiKey');
  if (modelo.startsWith('claude')) { label.textContent = 'Anthropic API Key'; input.placeholder = 'sk-ant-…'; }
  else                              { label.textContent = 'Gemini API Key';    input.placeholder = 'AIza…'; }
}

async function generateStory() {
  const historia     = document.getElementById('historia').value.trim();
  const protagonista = document.getElementById('protagonista').value.trim();
  const marca        = document.getElementById('marca').value.trim();
  const publico      = document.getElementById('publico').value.trim();
  const insight      = document.getElementById('insight').value.trim();
  const tom          = document.getElementById('tom').value;
  const palavras     = document.getElementById('palavras').value;
  const modelo       = document.getElementById('modelo').value;
  const apiKey       = document.getElementById('apiKey').value.trim();

  if (!historia && !protagonista && !marca) {
    showError('Preencha ao menos um campo de briefing.');
    return;
  }
  if (!apiKey) { showError('Insira sua API Key para continuar.'); return; }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true; btn.textContent = 'GERANDO…';
  hideError(); renderLoading();

  const linhas = [
    marca        ? `MARCA / PRODUTO: ${marca}` : '',
    publico      ? `PÚBLICO-ALVO: ${publico}` : '',
    historia     ? `HISTÓRIA / PROJETO: ${historia}` : '',
    protagonista ? `PROTAGONISTA: ${protagonista}` : '',
    insight      ? `INSIGHT CRIATIVO / TAGLINE: ${insight}` : '',
    `TOM: ${tom}`
  ].filter(Boolean).join('\n');

  const prompt = `Você é um roteirista sênior premiado — especialista em estrutura narrativa cinematográfica.

Crie um arco narrativo completo em 5 atos para:

${linhas}

Estruture em 5 atos narrativos clássicos:

SET THE SCENE (Setup): Apresente o mundo, personagens, rotina e os stakes. O espectador precisa se importar com o protagonista antes de qualquer conflito. Seja específico — lugar, tempo, detalhe visual que define o tom.

RUIN THINGS (Inciting Incident): O evento que quebra o equilíbrio. Algo acontece que obriga o protagonista a agir. Seja específico e inesperado. Não genérico.

THE BREAKING POINT (Climax): O ponto de maior tensão. Tudo o que foi construído chega ao limite. O protagonista enfrenta a escolha impossível. A cena mais cinematográfica da história.

CLEAN UP THE MESS (Resolution/Falling Action): Consequências imediatas do clímax. O protagonista lida com o que criou. Perdas, revelações, reconciliações.

WRAP IT UP (Denouement): O novo normal. Como o protagonista (e o mundo ao redor) mudou. A imagem final que fica na cabeça.

Escreva em português brasileiro. Estilo cinematográfico, específico, visual. Tom: ${tom}.
Cada ato: máximo ${palavras} palavras. Sem títulos, sem marcadores — apenas texto corrido.
Nunca use palavrões, xingamentos ou linguagem obscena em nenhuma circunstância.

Responda SOMENTE com JSON:
{"scene":"...","ruin":"...","breaking":"...","cleanup":"...","wrap":"..."}`;

  // Tokens: 5 atos × palavras × 2 tok/palavra (pt-BR) + overhead JSON
  const maxTok = Math.max(512, parseInt(palavras) * 5 * 2 + 400);
  try {
    let result;
    if (modelo.startsWith('claude')) result = await callClaude(prompt, modelo, apiKey, maxTok);
    else result = await callGemini(prompt, modelo, apiKey, maxTok);
    currentScript = result;
    renderStory(result, marca || historia || protagonista, tom);
  } catch (err) {
    showError('⚠ ' + err.message);
    renderEmpty();
  } finally {
    btn.disabled = false; btn.textContent = 'GERAR ARCO';
  }
}

/* ── GEMINI API ── */
async function callGemini(prompt, modelo, apiKey, maxTokens) {
  const schema = {
    type: "OBJECT",
    properties: {
      scene:{type:"STRING"}, ruin:{type:"STRING"}, breaking:{type:"STRING"},
      cleanup:{type:"STRING"}, wrap:{type:"STRING"}
    },
    required: ["scene","ruin","breaking","cleanup","wrap"],
    propertyOrdering: ["scene","ruin","breaking","cleanup","wrap"]
  };
  const genCfg = { temperature: 1.0, responseMimeType: "application/json", responseSchema: schema };
  if (maxTokens) genCfg.maxOutputTokens = maxTokens;
  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${encodeURIComponent(apiKey)}`,
    { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents:[{parts:[{text:prompt}]}], generationConfig: genCfg }) }
  );
  if (!response.ok) { const err=await response.json().catch(()=>({})); throw new Error(`[${response.status}] ${err.error?.message||response.statusText}`); }
  const data = await response.json();
  const raw  = data.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!raw) throw new Error('Resposta vazia da API.');
  return JSON.parse(raw);
}

/* ── GEMINI SCHEMA (regenerar ato único) ── */
async function callGeminiSchema(prompt, modelo, apiKey, keys, maxTokens) {
  const props = {}; keys.forEach(k => props[k] = {type:"STRING"});
  const genCfg = { temperature: 1.1, responseMimeType: "application/json", responseSchema: { type:"OBJECT", properties:props, required:keys } };
  if (maxTokens) genCfg.maxOutputTokens = maxTokens;
  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${encodeURIComponent(apiKey)}`,
    { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ contents:[{parts:[{text:prompt}]}], generationConfig: genCfg }) }
  );
  if (!response.ok) { const err=await response.json().catch(()=>({})); throw new Error(`[${response.status}] ${err.error?.message||response.statusText}`); }
  const data = await response.json();
  const raw  = data.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!raw) throw new Error('Resposta vazia.');
  return JSON.parse(raw);
}

/* ── CLAUDE API ── */
async function callClaude(prompt, modelo, apiKey, maxTokens) {
  // Strip EVERY non-ASCII character — API keys are always a-z, A-Z, 0-9, hyphen, underscore
  const cleanKey = Array.from(apiKey || '')
    .filter(c => { const n = c.charCodeAt(0); return n >= 33 && n <= 126; })
    .join('');
  if (!cleanKey) throw new Error('API Key inválida ou vazia.');
  const maxTok = maxTokens || 4096;
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': cleanKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ model: modelo, max_tokens: maxTok, messages: [{ role: 'user', content: prompt }] })
  });
  if (!response.ok) { const err=await response.json().catch(()=>({})); throw new Error(`[${response.status}] ${err.error?.message||response.statusText}`); }
  const data  = await response.json();
  const raw   = data.content?.[0]?.text;
  if (!raw) throw new Error('Resposta vazia da API.');
  const match = raw.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('JSON não encontrado na resposta.');
  return JSON.parse(match[0]);
}

/* ── RENDER STORY ── */
function renderStory(data, titulo, tom) {

  ACTS.forEach((act, i) => {
    const text = data[act.key] || '';
    const col  = document.createElement('div');
    col.className = 'act-column'; col.id = `col-${act.key}`;
    col.innerHTML = `
      <div class="act-header">
        <div class="act-number">${act.label}</div>
        <div class="act-name-row">
          <div class="act-name">${act.name}</div>
          <div class="act-actions">
            <button class="act-icon-btn" id="edit-${act.key}" onclick="editAct('${act.key}')" title="Editar">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11.5 2.5a2.121 2.121 0 0 1 3 3L5 15H2v-3L11.5 2.5z"/>
              </svg>
            </button>
            <button class="act-icon-btn" id="regen-${act.key}" onclick="regenerateAct('${act.key}')" title="Regenerar em cascata">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.5 8A5.5 5.5 0 1 1 10 3.07"/><polyline points="10 1 10 4 13 4"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="act-desc">${act.desc}</div>
      </div>
      <div class="act-body"><div class="act-content" id="content-${act.key}"></div></div>`;
    area.appendChild(col);
    requestAnimationFrame(() => requestAnimationFrame(() => col.classList.add('visible')));
    if (text) setTimeout(() => typewrite(`content-${act.key}`, text, 10), i * 220 + 100);
  });

  const bar = document.createElement('div');
  bar.className = 'bottom-bar';
  bar.innerHTML = `
    <div class="bottom-bar-btns">
      <button class="btn-copy-all" onclick="copyAll()">Copiar roteiro</button>
      <button class="btn-download" onclick="downloadScript()">Baixar roteiro</button>
    </div>
    <div class="generation-meta">${(titulo||'').substring(0,40).toUpperCase()} · ${tom.toUpperCase()}</div>`;
  area.appendChild(bar);
}

/* ── TYPEWRITER ── */
function typewrite(id, text, speed = 12) {
  const el = document.getElementById(id); if (!el) return;
  el.innerHTML = ''; el.classList.remove('is-loading');
  let i = 0;
  const cursor = Object.assign(document.createElement('span'), { className: 'cursor-blink' });
  el.appendChild(cursor);
  const tick = setInterval(() => {
    if (i < text.length) { cursor.insertAdjacentText('beforebegin', text[i++]); }
    else { cursor.remove(); clearInterval(tick); }
  }, speed);
}

/* ── REGENERATE CASCADE (ato N → N, N+1, N+2 … 5) ── */
async function regenerateAct(key) {
  if (!currentScript) return;
  const historia     = document.getElementById('historia').value.trim();
  const protagonista = document.getElementById('protagonista').value.trim();
  const insight      = document.getElementById('insight').value.trim();
  const tom          = document.getElementById('tom').value;
  const palavras     = document.getElementById('palavras').value;
  const modelo       = document.getElementById('modelo').value;
  const apiKey       = document.getElementById('apiKey').value.trim();
  if (!apiKey) { showError('Insira sua API Key.'); return; }

  const startIdx = ACTS.findIndex(a => a.key === key);
  const cascade  = ACTS.slice(startIdx); // atos a regenerar

  // Tokens: palavras × 2 tok/palavra (pt-BR) + overhead
  const maxTok = Math.max(256, parseInt(palavras) * 2 + 200);

  // Desabilita todos os botões dos atos da cascata
  cascade.forEach(a => {
    const btn = document.getElementById(`regen-${a.key}`);
    if (btn) { btn.disabled = true; btn.classList.add('spinning'); }
  });
  // Marca conteúdo dos atos seguintes como "aguardando"
  cascade.slice(1).forEach(a => {
    const el = document.getElementById(`content-${a.key}`);
    if (el) { el.classList.add('is-loading'); el.textContent = '…'; }
  });

  try {
    for (const act of cascade) {
      // Spinner só no ato atual
      cascade.forEach(a => {
        const btn = document.getElementById(`regen-${a.key}`);
        if (btn) btn.classList.toggle('spinning', a.key === act.key);
      });

      // Atos anteriores já gerados (contexto)
      const prevActs = ACTS.slice(0, ACTS.indexOf(act))
        .map(a => `${a.name}:\n${currentScript[a.key] || ''}`)
        .join('\n\n');

      const prompt = `Você é um roteirista sênior. Escreva o ato "${act.name}" do arco narrativo.

HISTÓRIA: ${historia}
PROTAGONISTA: ${protagonista}
TOM: ${tom}${insight ? `\nINSIGHT / TAGLINE: ${insight}` : ''}
${prevActs ? `\nATOS ANTERIORES (mantenha coerência narrativa):\n${prevActs}` : ''}

Escreva este ato de forma coerente com o que veio antes. Máximo ${palavras} palavras. Português brasileiro, estilo cinematográfico. Sem títulos ou marcadores — apenas texto corrido. Nunca use palavrões ou linguagem obscena.
Responda SOMENTE com JSON: {"${act.key}":"..."}`;

      let result;
      if (modelo.startsWith('claude')) result = await callClaude(prompt, modelo, apiKey, maxTok);
      else result = await callGeminiSchema(prompt, modelo, apiKey, [act.key], maxTok);

      const newText = result[act.key];
      if (!newText) throw new Error(`Resposta vazia no ato ${act.name}.`);

      currentScript[act.key] = newText;
      const el = document.getElementById(`content-${act.key}`);
      if (el) el.classList.remove('is-loading');
      typewrite(`content-${act.key}`, newText, 10);
    }
  } catch (err) {
    showError('⚠ ' + err.message);
  } finally {
    cascade.forEach(a => {
      const btn = document.getElementById(`regen-${a.key}`);
      if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
    });
  }
}

/* ── EDIT ACT ── */
function editAct(key) {
  const el  = document.getElementById(`content-${key}`);
  const btn = document.getElementById(`edit-${key}`);
  if (!el || !btn) return;

  const isEditing = el.contentEditable === 'true';
  if (isEditing) {
    // Salva
    el.contentEditable = 'false';
    currentScript[key] = el.textContent;
    btn.classList.remove('editing');
    btn.title = 'Editar';
    btn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5a2.121 2.121 0 0 1 3 3L5 15H2v-3L11.5 2.5z"/></svg>`;
  } else {
    // Entra em edição
    el.contentEditable = 'true';
    el.focus();
    // Coloca cursor no final
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    btn.classList.add('editing');
    btn.title = 'Salvar edição';
    btn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 8 6 12 14 4"/></svg>`;
  }
}

function buildFullScript() {
  const marca = document.getElementById('marca').value.trim();
  const tom   = document.getElementById('tom').value;
  const header = [marca ? `MARCA: ${marca}` : '', `TOM: ${tom}`].filter(Boolean).join(' · ');
  return (header ? header + '\n\n' : '') +
    ACTS.map(a => `── ${a.name} ──\n${currentScript[a.key] || ''}`).join('\n\n');
}

function copyAll() {
  if (!currentScript) return;
  navigator.clipboard.writeText(buildFullScript()).then(() => {
    const btn = document.querySelector('.btn-copy-all');
    if (btn) { const t = btn.textContent; btn.textContent = '✓ Copiado'; setTimeout(() => { btn.textContent = t; }, 2200); }
  });
}

function downloadScript() {
  if (!currentScript) return;
  const text = buildFullScript();
  const marca = document.getElementById('marca').value.trim() || 'roteiro';
  const filename = marca.toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]/g, '') + '-story-arc.txt';
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ── UTILS ── */
function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = msg; el.style.display = 'block'; }
function hideError()    { document.getElementById('errorMsg').style.display = 'none'; }

renderEmpty();

/* ── DARK MODE ── */
(function() {
  let isDark = localStorage.getItem('dark-mode') === 'true' ||
    (!localStorage.getItem('dark-mode') && window.matchMedia('(prefers-color-scheme: dark)').matches);

  function applyDark(enabled) {
    isDark = enabled;
    localStorage.setItem('dark-mode', enabled);
    const html = document.documentElement;
    const toggle = document.getElementById('dark-mode-toggle');
    const sun = toggle.querySelector('.sun-icon');
    const moon = toggle.querySelector('.moon-icon');
    if (enabled) {
      html.classList.add('dark-mode');
      toggle.classList.add('active');
      toggle.setAttribute('aria-checked', 'true');
      toggle.title = 'Light Mode';
      sun.style.display = 'none';
      moon.style.display = 'block';
    } else {
      html.classList.remove('dark-mode');
      toggle.classList.remove('active');
      toggle.setAttribute('aria-checked', 'false');
      toggle.title = 'Dark Mode';
      sun.style.display = 'block';
      moon.style.display = 'none';
    }
  }

  applyDark(isDark);
  document.getElementById('dark-mode-toggle').addEventListener('click', () => applyDark(!isDark));
})();
