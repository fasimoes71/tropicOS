<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writers Studio</title>
<style>
@font-face {
  font-family: 'PPFragment';
  src: url('../plataforma/fonts/PPFragment-SerifLight.woff') format('woff');
  font-weight: 300; font-display: swap;
}
@font-face {
  font-family: 'PPFragment';
  src: url('../plataforma/fonts/PPFragment-SerifRegular.otf') format('opentype');
  font-weight: 400; font-display: swap;
}
@font-face {
  font-family: 'Ekstra';
  src: url('../plataforma/fonts/Ekstra-Regular.otf') format('opentype');
  font-weight: 400; font-display: swap;
}
@font-face {
  font-family: 'Ekstra';
  src: url('../plataforma/fonts/Ekstra-Medium.otf') format('opentype');
  font-weight: 500; font-display: swap;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input,select,textarea{font-family:inherit;font-size:inherit}

:root {
  --bg: #ffffff;
  --sidebar-bg: #ffffff;
  --panel-bg: #ffffff;
  --border: #d4d4d4;
  --border-light: #e5e5e5;
  --text: #1a1a1a;
  --text-muted: #6b6b6b;
  --text-subtle: #999;
  --accent: #32EE66;
  --accent-light: #E5FCF0;
  --accent-hover: #22D955;
  --danger: #dc2626;
  --danger-light: #fef2f2;
  --tag-bg: #efefef;
  --tag-text: #444;
  --input-bg: #ffffff;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.1);
  --radius: 8px;
  --radius-sm: 6px;
  --radius-lg: 12px;
  /* tropicOS layout tokens */
  --topbar-h: 52px;
  --sidebar-w: 185px;
  --sidebar-w-sm: 52px;
  --font-editorial: 'PPFragment', Georgia, serif;
  --font-ui: 'Ekstra', system-ui, sans-serif;
  --ease: cubic-bezier(0.2,0,0,1);
  --fast: 140ms;
  --normal: 220ms;
}

:root.dark-mode {
  --bg: #1f1f1f;
  --sidebar-bg: #1f1f1f;
  --panel-bg: #242424;
  --border: #3a3a3a;
  --border-light: #2a2a2a;
  --text: #f0f0f0;
  --text-muted: #a8a8a8;
  --text-subtle: #767676;
  --input-bg: #242424;
  --tag-bg: #2a2a2a;
  --tag-text: #a8a8a8;
  --accent-light: rgba(50,238,102,0.1);
  --danger-light: rgba(220,38,38,0.15);
}

html,body{height:100%;overflow:hidden}
body{font-family:var(--font-ui);font-size:14px;background:var(--bg);color:var(--text);display:block;-webkit-font-smoothing:antialiased}

/* ── APP GRID ──────────────────────────────────────────── */
.app{
  display:grid;
  grid-template-rows:var(--topbar-h) 1fr;
  grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-areas:"topbar topbar" "sidebar main";
  height:100vh;
  transition:grid-template-columns var(--normal) var(--ease);
}
.app.collapsed{grid-template-columns:var(--sidebar-w-sm) 1fr}

/* ── TOPBAR ─────────────────────────────────────────────── */
.topbar{
  grid-area:topbar;
  background:var(--bg);
  border-bottom:1px solid var(--border-light);
  display:flex;align-items:center;
  padding:0 20px 0 0;
  z-index:200;position:relative;
}
.topbar-logo{
  width:var(--sidebar-w);flex-shrink:0;
  display:flex;align-items:center;padding:0 16px;gap:10px;
  height:100%;
  transition:width var(--normal) var(--ease),padding var(--normal) var(--ease);
  overflow:hidden;
}
.app.collapsed .topbar-logo{width:var(--sidebar-w-sm);padding:0;justify-content:center}
.topbar-wordmark{height:29px;width:auto;flex-shrink:0;transition:opacity var(--normal) var(--ease),max-width var(--normal) var(--ease);max-width:182px;overflow:visible}
.app.collapsed .topbar-wordmark{opacity:0;max-width:0;pointer-events:none}
.topbar-context{flex:1;display:flex;align-items:center;padding:0 20px;gap:8px;min-width:0}
.topbar-breadcrumb{font-size:13px;color:var(--text-muted);font-weight:400}
.topbar-breadcrumb strong{color:var(--text);font-weight:500}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-icon-btn{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border:none;background:none;border-radius:var(--radius-sm);cursor:pointer;
  color:var(--text-muted);transition:background var(--fast),color var(--fast);
}
.topbar-icon-btn:hover{background:var(--border-light);color:var(--text)}
.topbar-icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* dark mode toggle — idêntico ao tropicOS library */
.dark-toggle{
  width:48px;height:28px;border:none;border-radius:99px;
  background:#d0d0d0;cursor:pointer;
  transition:background var(--normal);
  user-select:none;position:relative;padding:2px;
  display:flex;align-items:center;outline:none;flex-shrink:0;
}
.dark-toggle:hover{background:#c0c0c0}
.dark-toggle.on{background:#3a3a3a}
.dark-toggle.on:hover{background:#4a4a4a}
.dark-toggle-dot{
  width:24px;height:24px;border-radius:50%;
  background:white;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--normal);
  color:#666;font-size:12px;
  position:absolute;left:2px;
  pointer-events:none;
}
.dark-toggle.on .dark-toggle-dot{
  background:#5a5a5a;
  left:calc(100% - 26px);
  color:#888;
}

/* ── SIDEBAR ─────────────────────────────────────────── */
#sidebar{
  grid-area:sidebar;
  background:var(--sidebar-bg);
  border-right:1px solid var(--border-light);display:flex;flex-direction:column;overflow:visible;
  position:relative;
  transition:width var(--normal) var(--ease);
}
/* clip sidebar content but not the toggle button */
#sidebar > *:not(.sidebar-edge-toggle){overflow:hidden}
/* sidebar circular toggle on right edge */
.sidebar-edge-toggle{
  position:absolute;top:16px;right:-12px;width:24px;height:24px;
  background:var(--bg);border:1px solid var(--border);border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--text-muted);box-shadow:0 1px 4px rgba(0,0,0,.08);z-index:10;
  transition:background var(--fast),color var(--fast);
  flex-shrink:0;
}
.sidebar-edge-toggle:hover{background:var(--border-light);color:var(--text)}
.sidebar-edge-toggle svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--normal) var(--ease)}
.app.collapsed .sidebar-edge-toggle svg{transform:rotate(180deg)}

/* collapsed state overrides */
.app.collapsed #sidebar .nav-label{display:none}
.app.collapsed #sidebar .nav-item{justify-content:center;padding:7px;width:calc(100% - 8px)}
.app.collapsed #sidebar .sidebar-section-label{display:none}
.app.collapsed #sidebar .conv-list{display:none}
.app.collapsed #sidebar .new-conv-btn{display:none}
.app.collapsed #sidebar .config-toggle-label{display:none}
.app.collapsed #sidebar .config-chevron{display:none}
.app.collapsed #sidebar .config-toggle{justify-content:center;padding:10px 0}

.nav-section{padding:8px 0;border-bottom:1px solid var(--border-light)}
.nav-item{
  display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--radius-sm);
  cursor:pointer;transition:background .15s;font-size:13px;font-weight:400;color:var(--text-muted);margin:1px 4px;
  border:none;background:none;width:calc(100% - 8px);text-align:left;position:relative;
}
.nav-item:hover{background:var(--border-light);color:var(--text)}
.nav-item.active{background:var(--border-light);color:var(--text);font-weight:500;border-left:none}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-item svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.sidebar-section-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-subtle);padding:10px 16px 4px}

/* config collapsible — pinned to sidebar bottom */
.sidebar-config-footer{border-top:1px solid var(--border-light);flex-shrink:0}
.config-toggle{
  display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 12px;cursor:pointer;
  font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-subtle);
  border:none;background:none;width:100%;text-align:left;
}
.config-toggle:hover{background:var(--border-light)}
.config-toggle-label{flex:1}
.config-icon{width:14px;height:14px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.config-chevron{width:12px;height:12px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.config-toggle.open .config-chevron{transform:rotate(180deg)}
.config-panel{display:none;padding:4px 8px 10px}
.config-panel.open{display:block}
.config-field{margin-bottom:8px}
.config-label{font-size:11px;font-weight:500;color:var(--text-muted);margin-bottom:3px;display:block}
.config-input{
  width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--input-bg);font-size:12px;color:var(--text);outline:none;
}
.config-input:focus{border-color:var(--accent)}
.config-input[type=range]{padding:0;border:none;background:none;accent-color:var(--accent)}

/* conversation list */
.conv-list{flex:1;overflow-y:auto;padding:0 4px}
.conv-item-wrap{position:relative;margin-bottom:1px}
.conv-item-wrap:hover .conv-delete-btn{opacity:1}
.conv-item{
  padding:7px 32px 7px 10px;border-radius:var(--radius-sm);cursor:pointer;border:none;background:none;
  width:100%;text-align:left;color:var(--text-muted);font-size:12px;line-height:1.3;
  transition:background .15s;display:block;
}
.conv-item:hover{background:var(--border-light);color:var(--text)}
.conv-item.active{background:var(--border-light);color:var(--text);font-weight:500;border-left:2px solid var(--text-muted)}
.conv-item-title{font-weight:500;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-item-date{font-size:10px;color:var(--text-subtle);margin-top:2px}
.conv-delete-btn{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border:none;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:4px;color:var(--text-subtle);opacity:0;transition:opacity .15s,background .15s,color .15s;
}
.conv-delete-btn:hover{background:var(--danger-light);color:var(--danger)}
.no-convs{padding:12px 16px;font-size:12px;color:var(--text-subtle);font-style:italic}

.new-conv-btn{
  margin:4px 8px;display:flex;align-items:center;gap:6px;padding:7px 10px;
  border:1px dashed var(--border);border-radius:var(--radius-sm);cursor:pointer;
  background:none;font-size:12px;color:var(--text-muted);width:calc(100% - 16px);
  transition:all .15s;
}
.new-conv-btn:hover{border-color:var(--text-muted);color:var(--text);background:var(--border-light)}

/* ── MAIN ─────────────────────────────────────────────── */
#main{grid-area:main;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* ── CHAT VIEW ────────────────────────────────────────── */
#view-chat{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden}

/* welcome screen */
.welcome-screen{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:48px 24px 0;overflow-y:auto;
}
.welcome-logo{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:32px}
.welcome-logo-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.welcome-logo-icon img{width:32px;height:32px;object-fit:contain;display:block}
.welcome-logo h1{font-family:var(--font-editorial);font-size:2rem;font-weight:300;color:var(--text);letter-spacing:-0.02em;line-height:1.1}
.welcome-logo p{font-size:11px;color:var(--text-subtle);letter-spacing:0.04em;text-transform:uppercase}

.content-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;width:100%}
.content-card{
  padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel-bg);
  cursor:pointer;transition:all .15s;text-align:left;
}
.content-card:hover{border-color:var(--text-muted);box-shadow:var(--shadow-md)}
.content-card-icon{width:20px;height:20px;margin-bottom:8px;color:var(--text-muted)}
.content-card-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.content-card-name{font-size:13px;font-weight:500;color:var(--text)}
.content-card-desc{font-size:11px;color:var(--text-muted);margin-top:2px;line-height:1.4}

.welcome-skill-row{margin-top:20px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}
.skill-pill{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;
  background:none;color:var(--text);border:1.5px solid var(--accent);border-radius:20px;font-size:11px;font-weight:500;
}
.skill-pill-inactive{border-color:var(--border);color:var(--text-muted)}
.skill-pill svg{width:11px;height:11px;stroke:var(--accent);fill:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* messages */
.messages-area{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.message{display:flex;flex-direction:column;gap:4px}
.message-user{align-items:flex-end}
.message-assistant{align-items:flex-start}
.message-bubble{
  max-width:72%;padding:10px 14px;border-radius:var(--radius-lg);font-size:14px;line-height:1.6;word-break:break-word;
}
.message-user .message-bubble{background:var(--accent);color:#000;border-radius:var(--radius-lg) var(--radius-lg) 2px var(--radius-lg)}
.message-assistant .message-bubble{background:var(--panel-bg);border:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) var(--radius-lg) 2px;box-shadow:var(--shadow)}
.message-meta{font-size:11px;color:var(--text-subtle);margin:0 2px}
.message-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.message:hover .message-actions{opacity:1}
.msg-action-btn{
  padding:3px 6px;font-size:11px;border:1px solid var(--border);border-radius:4px;
  background:var(--panel-bg);color:var(--text-muted);cursor:pointer;
}
.msg-action-btn:hover{background:var(--border-light);color:var(--text)}

/* cursor blink */
.cursor-blink::after{content:'▋';animation:blink .7s step-end infinite;color:var(--text)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* input bar */
.input-area{
  border-top:1px solid var(--border);background:var(--panel-bg);padding:12px 24px 16px;
}
.input-meta-row{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:11px;color:var(--text-muted);
}
.input-skill-indicator{display:flex;align-items:center;gap:6px}
.input-content-type{color:var(--text-subtle)}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea#userInput{
  flex:1;resize:none;min-height:44px;max-height:160px;padding:10px 12px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--input-bg);
  font-size:14px;color:var(--text);font-family:inherit;line-height:1.5;outline:none;
  overflow-y:auto;
}
textarea#userInput:focus{border-color:var(--accent)}
textarea#userInput::placeholder{color:var(--text-subtle)}
#sendBtn,#stopBtn{
  width:40px;height:40px;border-radius:var(--radius);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;
}
#sendBtn{background:var(--accent);color:#000}
#sendBtn:hover{background:var(--accent-hover)}
#sendBtn:disabled{background:var(--border);cursor:default}
#sendBtn svg,#stopBtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#stopBtn{background:var(--danger);color:#fff;display:none}
#stopBtn:hover{background:#b91c1c}

/* ── SKILLS VIEW ───────────────────────────────────────── */
#view-skills{flex:1;display:flex;flex-direction:column;overflow:hidden}
.skills-header{
  padding:20px 24px 16px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;
}
.skills-header h2{font-size:16px;font-weight:500;color:var(--text)}
.skills-header p{font-size:12px;color:var(--text-muted);margin-top:3px}
.btn-primary{
  padding:7px 14px;background:var(--accent);color:#000;border:none;border-radius:var(--radius-sm);
  cursor:pointer;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;
  transition:background var(--fast);flex-shrink:0;
}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.skills-grid{flex:1;overflow-y:auto;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;align-content:start}
.skill-card{
  background:var(--panel-bg);border:1px solid var(--border-light);border-radius:var(--radius-lg);
  padding:18px 18px 14px;display:flex;flex-direction:column;gap:6px;
  box-shadow:var(--shadow);transition:box-shadow var(--fast),border-color var(--fast);
}
.skill-card:hover{box-shadow:var(--shadow-md);border-color:var(--border)}
.skill-card.active-skill{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
.skill-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.skill-card-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.3}
.skill-badge{
  padding:2px 8px;border-radius:99px;font-size:9px;font-weight:500;
  text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;flex-shrink:0;
  border:1px solid var(--border-light);background:var(--panel-bg);color:var(--text-subtle);
}
.skill-badge.producao{background:var(--accent);color:#0f0f0f;border-color:var(--accent)}
.skill-badge.rascunho{background:transparent;color:var(--text-subtle);border-color:var(--border-light)}
.skill-card-desc{font-size:11px;color:var(--text-muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skill-card-meta{font-size:10px;color:var(--text-subtle);letter-spacing:.04em;margin-top:2px}
.skill-card-actions{display:flex;gap:6px;margin-top:6px}
.btn-use-skill{
  flex:1;padding:6px 10px;border:1px solid var(--border-light);border-radius:var(--radius-sm);
  background:none;cursor:pointer;font-size:11px;font-weight:500;color:var(--text-muted);
  transition:all var(--fast);
}
.btn-use-skill:hover{background:var(--border-light);color:var(--text);border-color:var(--border)}
.btn-use-skill.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.btn-edit-skill{
  padding:6px 10px;border:1px solid var(--border-light);border-radius:var(--radius-sm);
  background:none;cursor:pointer;font-size:11px;color:var(--text-muted);transition:all var(--fast);
}
.btn-edit-skill:hover{background:var(--border-light);color:var(--text)}
.skills-empty{
  grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 24px;text-align:center;gap:12px;
}
.skills-empty svg{width:36px;height:36px;stroke:var(--border);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.skills-empty h3{font-size:15px;font-weight:500;color:var(--text)}
.skills-empty p{font-size:12px;color:var(--text-muted)}

/* ── SKILL EDITOR OVERLAY ──────────────────────────────── */
.editor-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;animation:fadeIn .15s}
.editor-panel{
  position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;
  background:var(--panel-bg);border-left:1px solid var(--border);z-index:101;
  display:flex;flex-direction:column;animation:slideIn .2s;overflow:hidden;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

.editor-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.editor-header h3{font-size:16px;font-weight:700}
.editor-close{
  width:30px;height:30px;border:none;background:none;cursor:pointer;border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:var(--text-muted);
}
.editor-close:hover{background:var(--border-light);color:var(--text)}
.editor-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.editor-body{flex:1;overflow-y:auto;padding:20px}
.editor-field{margin-bottom:16px}
.editor-label{display:block;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.editor-input,.editor-select,.editor-textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--input-bg);font-size:13px;color:var(--text);font-family:inherit;outline:none;
}
.editor-input:focus,.editor-select:focus,.editor-textarea:focus{border-color:var(--accent)}
.editor-textarea{resize:vertical;min-height:120px;line-height:1.5}
.editor-textarea.large{min-height:200px}
.editor-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.doc-upload-zone{
  border:1px dashed var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;
  cursor:pointer;transition:all .15s;background:var(--bg);
}
.doc-upload-zone:hover{border-color:var(--accent);background:var(--accent-light)}
.doc-upload-zone svg{width:20px;height:20px;stroke:var(--text-subtle);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin:0 auto 6px}
.doc-upload-zone p{font-size:12px;color:var(--text-muted)}
.doc-upload-zone small{font-size:11px;color:var(--text-subtle)}
.doc-current{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--border-light);font-size:12px;
}
.doc-current svg{width:14px;height:14px;stroke:var(--text-muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.doc-current span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-remove-btn{border:none;background:none;cursor:pointer;color:var(--text-subtle);font-size:16px;line-height:1;padding:0 2px}
.doc-remove-btn:hover{color:var(--danger)}

.btn-generate{
  width:100%;padding:9px 12px;background:var(--accent);color:#000;border:none;border-radius:var(--radius-sm);
  cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s;margin-top:8px;
}
.btn-generate:hover{background:var(--accent-hover)}
.btn-generate:disabled{background:var(--border);color:var(--text-muted);cursor:default}
.btn-generate svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
.generate-hint{font-size:11px;color:var(--text-subtle);margin-top:5px;text-align:center;line-height:1.4}
.step-divider{display:flex;align-items:center;gap:8px;margin:16px 0 4px;color:var(--text-subtle);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.step-divider::before,.step-divider::after{content:'';flex:1;height:1px;background:var(--border-light)}
.prompt-generated{border-color:var(--accent)!important;background:var(--accent-light)!important;transition:background .3s,border-color .3s}

.editor-footer{
  padding:16px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.btn-save{flex:1;padding:9px;background:var(--accent);color:#000;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;transition:background .15s}
.btn-save:hover{background:var(--accent-hover)}
.btn-delete{padding:9px 14px;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text-muted);transition:all .15s}
.btn-delete:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-light)}

/* ── TOAST ─────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  padding:9px 16px;background:#1a1a1a;color:#fff;border-radius:var(--radius);font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;white-space:nowrap;
}
#toast.show{opacity:1}

/* ── MARKDOWN ──────────────────────────────────────────── */
.prose h1,.prose h2,.prose h3{font-weight:700;margin-top:12px;margin-bottom:4px;line-height:1.3}
.prose h1{font-size:1.15em}.prose h2{font-size:1.05em}.prose h3{font-size:.97em}
.prose p{margin-bottom:8px;line-height:1.65}
.prose ul,.prose ol{margin-bottom:8px;padding-left:18px}
.prose li{margin-bottom:3px;line-height:1.6}
.prose code{background:rgba(0,0,0,.07);padding:1px 5px;border-radius:4px;font-family:'SF Mono',Consolas,monospace;font-size:.88em}
.prose pre{background:rgba(0,0,0,.06);padding:10px 12px;border-radius:6px;overflow-x:auto;margin-bottom:10px}
.prose pre code{background:none;padding:0;font-size:.85em}
.prose blockquote{border-left:3px solid var(--accent);padding-left:10px;color:var(--text-muted);margin-bottom:8px}
.prose a{color:var(--accent);text-decoration:underline}
.prose strong{font-weight:700}
.prose em{font-style:italic}
.prose hr{border:none;border-top:1px solid var(--border);margin:12px 0}

/* scroll bars */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:#ccc}

/* hidden */
.hidden{display:none!important}
</style>

<script>
(function() {
'use strict';

// ── STATE ──────────────────────────────────────────────────────
const STATE = {
  view: 'chat',
  apiKey: '',
  model: 'claude-sonnet-4-6',
  temperature: 0.7,
  activeConvId: null,
  conversations: [],   // [{id,title,messages,contentType,createdAt}]
  skills: [],          // [{id,name,description,systemPrompt,version,status,docName,docChars}]
  activeSkillId: null,
  _skillDocs: {},      // id -> base64 (session-only, not persisted in file)
  streaming: false,
  abortController: null,
};

// ── CONTENT TYPES ──────────────────────────────────────────────
const CONTENT_TYPES = [
  {id:'push',   label:'Push',    icon:'<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>', desc:'Notificações push', template:'Crie 5 notificações push sobre [tema]. Tom: ação imediata, até 65 chars no título.'},
  {id:'sms',    label:'SMS',     icon:'<svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>', desc:'Mensagens SMS 160 chars', template:'Crie 5 SMS sobre [tema]. Máximo 160 caracteres cada.'},
  {id:'inapp',  label:'In-App',  icon:'<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>', desc:'Mensagens in-app', template:'Crie 5 mensagens in-app sobre [tema]. Inclua título curto e corpo.'},
  {id:'banners',label:'Banners', icon:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>', desc:'Headlines + CTA', template:'Crie 5 variações de banner sobre [tema]. Headline + CTA.'},
  {id:'insights',label:'Insights',icon:'<svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>', desc:'Insights informativos', template:'Crie 5 insights sobre [tema]. Tom informativo e direto.'},
  {id:'texto',  label:'Texto',   icon:'<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>', desc:'Texto livre', template:''},
];

// ── PERSISTENCE ────────────────────────────────────────────────
function saveState() {
  try {
    const payload = {
      apiKey: STATE.apiKey,
      model: STATE.model,
      temperature: STATE.temperature,
      activeConvId: STATE.activeConvId,
      activeSkillId: STATE.activeSkillId,
      conversations: STATE.conversations,
    };
    const json = JSON.stringify(payload);
    if (json.length > 400000) {
      // trim oldest conversations
      STATE.conversations = STATE.conversations.slice(-20);
      payload.conversations = STATE.conversations;
    }
    localStorage.setItem('ps_state', JSON.stringify(payload));
  } catch(e) { console.warn('saveState error', e); }
}

function loadState() {
  try {
    const raw = localStorage.getItem('ps_state');

async function loadSkillsFromFile() {
  // Priority: 1) server (json file), 2) localStorage, 3) hardcoded defaults
  try {
    const r = await fetch('./skills.json?_=' + Date.now());
    if (r.ok) {
      const data = await r.json();
      if (Array.isArray(data) && data.length > 0) {
        STATE.skills = data;
        // Mirror to localStorage so file:// mode can use them next time
        try { localStorage.setItem('ps_skills', JSON.stringify(STATE.skills)); } catch(_) {}
        return;
      }
    }
  } catch(_) { /* server unavailable – that's OK */ }

  // Try localStorage
  try {
    const stored = localStorage.getItem('ps_skills');
    if (stored) {
      const data = JSON.parse(stored);
      if (Array.isArray(data) && data.length > 0) {
        STATE.skills = data;
        return;
      }
    }
  } catch(_) {}

  // Last resort: bundled defaults
  STATE.skills = JSON.parse(JSON.stringify(DEFAULT_SKILLS));
}

async function saveSkillsToFile() {
  // Always persist in localStorage (works in file:// mode too)
  try { localStorage.setItem('ps_skills', JSON.stringify(STATE.skills)); } catch(_) {}

  // Best-effort sync to skills.json via server
  try {
    const r = await fetch('/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: 'PROMPT-STUDIO/skills.json', data: STATE.skills}),
    });
    if (!r.ok) console.warn('server save returned', r.status);
  } catch(_) {
    // Server not running – localStorage already saved, so we're fine
  }
}

// ── SEND / STREAM ──────────────────────────────────────────────
function buildPayload(conv) {
  const isCriador = STATE.activeSkillId === '__criador__';
  const skill = isCriador ? null : STATE.skills.find(s => s.id === STATE.activeSkillId);
  const doc   = (!isCriador && STATE.activeSkillId) ? STATE._skillDocs[STATE.activeSkillId] : null;

  let systemPrompt = isCriador ? SKILL_CREATOR_SYSTEM : (skill ? skill.systemPrompt || '' : '');
  let messages = conv.messages.map(m => ({role: m.role, content: m.content}));

  // inject document as first user message if present and no doc message yet
  if (doc && messages.length > 0 && !messages[0]._hasDoc) {
    const docMsg = {
      role: 'user',
      content: [{
        type: 'document',
        source: {type: 'base64', media_type: doc.mediaType || 'application/pdf', data: doc.data},
        title: doc.name || 'Documento de contexto',
        cache_control: {type: 'ephemeral'},
      }]
    };
    messages = [docMsg, ...messages];
  }

  return {
    model: STATE.model,
    max_tokens: 2048,
    temperature: STATE.temperature,
    system: systemPrompt || undefined,
    messages,
  };
}

async function sendMessage() {
  if (STATE.streaming) return;
  const textarea = document.querySelector('#userInput');
  if (!textarea) return;
  const text = textarea.value.trim();
  if (!text) return;
  if (!STATE.apiKey) { showToast('Configure sua API Key primeiro'); return; }

  // get or create active conv
  let conv = STATE.conversations.find(c => c.id === STATE.activeConvId);
  if (!conv) {
    const id = uuid();
    conv = {id, title: text.slice(0,40), messages: [], contentType: 'texto', createdAt: Date.now()};
    STATE.conversations.push(conv);
    STATE.activeConvId = id;
  } else if (conv.messages.length === 0) {
    conv.title = text.slice(0, 40);
  }

  conv.messages.push({role: 'user', content: text});
  textarea.value = '';
  textarea.style.height = 'auto';
  saveState();

  const assistantIdx = conv.messages.length;
  conv.messages.push({role: 'assistant', content: ''});

  STATE.streaming = true;
  renderChat();
  setStreaming(true);

  // get fresh bubble
  const getArea  = () => document.querySelector('#messagesArea');
  const getBubble= () => document.getElementById('bubble-' + assistantIdx);

  let rawText = '';

  try {
    STATE.abortController = new AbortController();
    const payload = buildPayload(conv);
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      signal: STATE.abortController.signal,
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': STATE.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'anthropic-beta': 'pdfs-2024-09-25,prompt-caching-2024-07-31',
      },
      body: JSON.stringify({...payload, stream: true}),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({error:{message:res.statusText}}));
      throw new Error(err?.error?.message || res.statusText);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    const bubble = getBubble();
    if (bubble) { bubble.classList.add('cursor-blink'); }

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') break;
        try {
          const ev = JSON.parse(data);
          if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
            rawText += ev.delta.text;
            const b = getBubble();
            if (b) b.textContent = rawText;
            const area = getArea();
            if (area) area.scrollTop = area.scrollHeight;
          }
        } catch {}
      }
    }
  } catch(e) {
    if (e.name !== 'AbortError') {
      rawText = rawText || '_(Erro: ' + e.message + ')_';
      showToast(e.message);
    }
  } finally {
    conv.messages[assistantIdx] = {role: 'assistant', content: rawText || '…'};
    STATE.streaming = false;
    STATE.abortController = null;
    saveState();
    setStreaming(false);
    // render final markdown
    const bubble = getBubble();
    if (bubble) {
      bubble.classList.remove('cursor-blink');
      bubble.classList.add('prose');
      bubble.innerHTML = renderMarkdown(rawText);
    }
  }
}

function setStreaming(on) {
  const sendBtn = document.querySelector('#sendBtn');
  const stopBtn = document.querySelector('#stopBtn');
  if (sendBtn) { sendBtn.disabled = on; sendBtn.style.display = on ? 'none' : ''; }
  if (stopBtn) { stopBtn.style.display = on ? '' : 'none'; }
}

      <div class="skill-card-meta">Versão ${esc(s.version || 'v1')}${s.docName ? ' · 📎 ' + esc(s.docName) : ''}</div>
      <div class="skill-card-actions">
        <button class="btn-use-skill ${isActive ? 'active' : ''}" onclick="activateSkill('${esc(s.id)}')">
          ${isActive ? '✓ Skill ativo' : 'Usar Skill'}
        </button>
        <button class="btn-edit-skill" onclick="openSkillEditor('${esc(s.id)}')">Editar</button>
      </div>
    </div>`;
}

function activateSkill(id) {
  STATE.activeSkillId = (STATE.activeSkillId === id) ? null : id;
  saveState();
  renderSkills();
  // update chat skill pill if visible
  if (STATE.view === 'chat') renderChat();
  const skill = STATE.skills.find(s => s.id === STATE.activeSkillId);
  showToast(skill ? `Skill "${skill.name}" ativado` : 'Skill desativado');
}

// ── SKILL CREATOR (chat mode) ───────────────────────────────────
function startSkillCreator() {
  const id = uuid();
  const conv = { id, title: '✦ Criar Skill', messages: [], contentType: 'texto', createdAt: Date.now() };
  STATE.conversations.push(conv);
  STATE.activeConvId = id;
  STATE.activeSkillId = '__criador__';
  saveState();
  showView('chat');
}

function saveSkillFromCreator() {
  const conv = STATE.conversations.find(c => c.id === STATE.activeConvId);
  if (!conv) return;
  const lastAssistant = [...conv.messages].reverse().find(m => m.role === 'assistant');
  const text = lastAssistant
    ? (typeof lastAssistant.content === 'string'
        ? lastAssistant.content
        : (lastAssistant.content || []).filter(b => b.type === 'text').map(b => b.text).join(''))
    : '';
  openSkillEditor(null, text.trim());
}

// ── SKILL EDITOR ───────────────────────────────────────────────

              <p>PDF, TXT ou MD com o guia de marca</p>

        </div>

          <label class="editor-label">Status</label>
          <select class="editor-select" id="skillStatus">
            <option value="rascunho" ${(!skill||skill.status==='rascunho')?'selected':''}>Rascunho</option>

function closeSkillEditor() {
  const backdrop = document.querySelector('.editor-backdrop');
  if (backdrop) backdrop.remove();
}

function handleEditorDoc(e) {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById('docUploadStatus');
  const isPdf = file.type === 'application/pdf';
  const isLarge = isPdf && file.size > 4 * 1024 * 1024; // >4MB → likely >100 pages

  if (isLarge) {
    // Auto-extract text via PDF.js — avoids the Anthropic 100-page limit
    if (status) { status.textContent = '⏳ Extraindo texto do PDF…'; status.style.color = 'var(--accent)'; }
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const text = await extractPdfText(ev.target.result, (i, total) => {
          if (status) status.textContent = `⏳ Extraindo ${i}/${total} páginas…`;
        });
        window._pendingDoc = {name: file.name, text, charCount: text.length, mediaType: 'text/plain'};
        if (status) {
          status.textContent = `✓ ${file.name} — ${text.length.toLocaleString()} chars extraídos`;
          status.style.color = 'var(--accent)';
        }
      } catch(err) {
        if (status) {
          status.innerHTML = `❌ Erro ao extrair: ${err.message}<br><strong>Alternativa:</strong> abra no Preview, ⌘A, cole num .txt e envie.`;
          status.style.color = 'var(--danger)';
        }
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    if (status) { status.textContent = 'Carregando…'; status.style.color = 'var(--accent)'; }
    handleFileUpload(file, (docData) => {
      window._pendingDoc = {name: file.name, ...docData};
      if (status) {
        status.textContent = `✓ ${file.name} carregado`;
        status.style.color = 'var(--accent)';
      }
    });
  }
}

function removeEditorDoc(skillId) {
  window._pendingDoc = {remove: true};
  const zone = document.getElementById('docCurrent');
  if (zone) zone.remove();
  const status = document.getElementById('docUploadStatus');
  if (status) status.textContent = 'Documento removido';
}

async function generateSystemPrompt() {
  if (!STATE.apiKey) { showToast('Configure sua API Key primeiro'); return; }

  const name = document.getElementById('skillName')?.value.trim() || '';
  const desc = document.getElementById('skillDesc')?.value.trim() || '';
  const doc  = window._pendingDoc;
  const btn  = document.getElementById('generateBtn');
  const textarea = document.getElementById('skillPrompt');
  if (!btn || !textarea) return;

  // build user content
  const userContent = [];

  if (doc && doc.base64) {
    userContent.push({
      type: 'document',
      source: {type: 'base64', media_type: doc.mediaType || 'application/pdf', data: doc.base64},
      title: doc.name || 'Guia de Marca',
    });
  } else if (doc && doc.text) {
    userContent.push({type: 'text', text: `<document>\n${doc.text}\n</document>`});
  }

  const ctx = [name && `Skill: ${name}`, desc && `Descrição: ${desc}`].filter(Boolean).join('\n');
  userContent.push({
    type: 'text',
    text: `${ctx ? ctx + '\n\n' : ''}Analise ${doc ? 'o guia de marca acima' : 'o contexto acima'} e gere o system prompt.`,
  });

  // loading state
  btn.disabled = true;
  btn.innerHTML = `<svg viewBox="0 0 24 24" class="spin"><path d="M21 12a9 9 0 1 1-0.1-1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg> Gerando…`;
  textarea.value = '';
  textarea.classList.remove('prompt-generated');

  try {
    const hasPdf = doc && doc.base64 && (doc.mediaType === 'application/pdf');
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': STATE.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'anthropic-beta': hasPdf ? 'pdfs-2024-09-25,prompt-caching-2024-07-31' : 'prompt-caching-2024-07-31',
      },
      body: JSON.stringify({
        model: STATE.model,
        max_tokens: 1500,
        stream: true,
        system: SKILL_CREATOR_SYSTEM,
        messages: [{role: 'user', content: userContent}],
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({error:{message:res.statusText}}));
      throw new Error(err?.error?.message || res.statusText);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', result = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') break;
        try {
          const ev = JSON.parse(data);
          if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') {
            result += ev.delta.text;
            textarea.value = result;
          }
        } catch {}
      }
    }

    textarea.classList.add('prompt-generated');
    setTimeout(() => textarea.classList.remove('prompt-generated'), 1200);
    showToast('System prompt gerado! Revise e salve.');
  } catch(e) {
    const msg = e.message || '';
    if (msg.includes('100 PDF pages') || msg.includes('maximum of 100')) {
      const status = document.getElementById('docUploadStatus');
      if (status) {
        status.innerHTML = `❌ PDF com mais de 100 páginas.<br>
          <strong>Solução:</strong> Abra o PDF, ⌘A → ⌘C, cole num arquivo .txt e envie o .txt.`;
        status.style.color = 'var(--danger)';
      }
      showToast('PDF muito grande — envie como .txt (ver instruções)');
    } else {
      showToast('Erro ao gerar: ' + msg);
    }
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Gerar System Prompt com IA`;
  }
}

function saveSkill(existingId) {
  const name    = document.getElementById('skillName').value.trim();
  const desc    = document.getElementById('skillDesc').value.trim();
  const prompt  = document.getElementById('skillPrompt').value.trim();
  const version = document.getElementById('skillVersion').value.trim() || 'v1';
  const status  = document.getElementById('skillStatus').value;

  if (!name) { showToast('Nome do skill obrigatório'); return; }

  let skill;
  if (existingId) {
    skill = STATE.skills.find(s => s.id === existingId);
    if (!skill) { showToast('Skill não encontrado'); return; }
  } else {
    skill = {id: uuid(), name:'', description:'', systemPrompt:'', version:'v1', status:'rascunho', docName:null, docChars:null};
    STATE.skills.push(skill);
  }

  skill.name        = name;
  skill.description = desc;
  skill.systemPrompt= prompt;
  skill.version     = version;
  skill.status      = status;

  // handle doc
  if (window._pendingDoc) {
    if (window._pendingDoc.remove) {
      skill.docName  = null;
      skill.docChars = null;
      if (STATE._skillDocs) delete STATE._skillDocs[skill.id];
    } else {
      skill.docName  = window._pendingDoc.name;
      skill.docChars = window._pendingDoc.charCount || null;
      if (window._pendingDoc.base64) {
        STATE._skillDocs[skill.id] = {data: window._pendingDoc.base64, mediaType: window._pendingDoc.mediaType, name: window._pendingDoc.name};
      }
    }
    window._pendingDoc = null;
  }

  STATE.activeSkillId = skill.id;
  saveSkillsToFile().then(() => showToast(`"${skill.name}" salvo e ativado ✓`));
  closeSkillEditor();
  renderSkills();
  if (STATE.view === 'chat') renderChat();
}

function deleteSkill(id) {
  if (!confirm('Excluir este skill?')) return;
  STATE.skills = STATE.skills.filter(s => s.id !== id);
  if (STATE.activeSkillId === id) STATE.activeSkillId = null;
  saveState();
  saveSkillsToFile().then(() => showToast('Skill excluído'));
  closeSkillEditor();
  renderSkills();
}

// ── PDF TEXT EXTRACTION (bypasses 100-page API limit) ─────────
async function loadPdfJs() {
  if (window.pdfjsLib) return;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function extractPdfText(arrayBuffer, onProgress) {
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const total = pdf.numPages;
  const parts = [];
  for (let i = 1; i <= total; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    parts.push(content.items.map(it => it.str).join(' '));
    if (onProgress) onProgress(i, total);
  }
  return parts.join('\n').trim();
}

// ── FILE UPLOAD ────────────────────────────────────────────────
function handleFileUpload(file, onDone) {
  const reader = new FileReader();
  if (file.type === 'application/pdf') {
    reader.readAsDataURL(file);
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      onDone({base64, mediaType: 'application/pdf', charCount: null});
    };
  } else {
    reader.readAsText(file);
    reader.onload = () => {
      const text = reader.result;
      const charCount = text.length;
      onDone({text, charCount, mediaType: 'text/plain'});
    };
  }
}

// ── MARKDOWN ───────────────────────────────────────────────────
function renderMarkdown(md) {
  if (!md) return '';
  let html = md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```([\w]*)\n([\s\S]*?)```/g, (_,lang,code) => `<pre><code>${code}</code></pre>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm,  '<h2>$1</h2>')
    .replace(/^# (.+)$/gm,   '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,    '<em>$1</em>')
    .replace(/^> (.+)$/gm,    '<blockquote>$1</blockquote>')
    .replace(/^---$/gm,       '<hr>')
    .replace(/^\s*[-*+] (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, m => '<ul>' + m + '</ul>')
    .replace(/^\s*\d+\. (.+)$/gm, '<li>$1</li>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

// ── UTILS ──────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0;
    return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 86400000) return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

function copyMessage(idx) {
  const conv = STATE.conversations.find(c => c.id === STATE.activeConvId);
  if (!conv) return;
  const m = conv.messages[idx];
  if (!m) return;
  const text = typeof m.content === 'string' ? m.content : JSON.stringify(m.content);
  navigator.clipboard.writeText(text).then(() => showToast('Copiado!'));
}

// ── INIT ───────────────────────────────────────────────────────
async function init() {
  loadState();
  loadConfig();
  if (localStorage.getItem('ps_sidebar_collapsed')) {
    document.getElementById('app').classList.add('collapsed');
  }
  if (localStorage.getItem('ps_dark_mode')) {
    document.documentElement.classList.add('dark-mode');
    const btn = document.getElementById('darkToggle');
    const dot = document.getElementById('darkToggleDot');
    if (btn) btn.classList.add('on');
    if (dot) {
      dot.querySelector('.sun-icon').style.display = 'none';
      dot.querySelector('.moon-icon').style.display = '';
    }
  }
  await loadSkillsFromFile();
  renderSidebar();
  showView('chat');
}

Object.assign(window, {
  showView, toggleSidebar, logoClick, toggleConfig, saveConfig, goHome,

  newConversation, loadConversation, deleteConversation, startConvWithType,
  startSkillCreator, saveSkillFromCreator,
  openSkillEditor, closeSkillEditor, saveSkill, deleteSkill, activateSkill,
  handleEditorDoc, removeEditorDoc, generateSystemPrompt, copyMessage,
});

init();

})();
