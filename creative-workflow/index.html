<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills — tropicOS</title>
    <script>
        // Embed mode — when this tool runs inside the tropicOS shell (iframe)
        if (window.self !== window.top || new URLSearchParams(location.search).has('embed')) {
            document.documentElement.classList.add('embedded');
        }
    </script>
    <style>
        /* ── FONTS ── */
        @font-face { font-family:'PPFragment'; src:url('../plataforma/fonts/PPFragment-SerifLight.woff') format('woff'); font-weight:300; font-display:swap; }
        @font-face { font-family:'PPFragment'; src:url('../plataforma/fonts/PPFragment-SerifRegular.otf') format('opentype'); font-weight:400; font-display:swap; }
        @font-face { font-family:'Ekstra'; src:url('../plataforma/fonts/Ekstra-Regular.otf') format('opentype'); font-weight:400; font-display:swap; }
        @font-face { font-family:'Ekstra'; src:url('../plataforma/fonts/Ekstra-Medium.otf') format('opentype'); font-weight:500; font-display:swap; }

        /* ── TOKENS ── */
        :root {
            --bg-canvas: #ffffff; --bg-surface: #ffffff; --bg-hover: #f7f7f7; --bg-active: #fafffd;
            --border-subtle: #e8e8e8; --border-default: #d9d9d9;
            --text-primary: #111111; --text-secondary: #555555; --text-tertiary: #999999;
            --accent: #32EE66; --danger: #FF4D4F;
            --font-editorial: 'PPFragment', Georgia, serif;
            --font-ui: 'Ekstra', system-ui, -apple-system, sans-serif;
            --mono: "SF Mono","Fira Code",Menlo,Monaco,Consolas,monospace;
            --topbar-h: 52px; --sidebar-w: 220px; --sidebar-w-sm: 48px;
            --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-pill: 9999px;
            --shadow-sm: 0 1px 4px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
            --ease: cubic-bezier(0.2,0,0,1); --fast: 140ms; --normal: 220ms;
            /* legacy aliases */
            --bg: var(--bg-canvas); --surface: var(--bg-hover);
            --text: var(--text-primary); --text-2: var(--text-secondary); --text-3: var(--text-tertiary);
            --border: var(--border-subtle); --font: var(--font-ui); --sidebar: var(--sidebar-w);
        }
        :root.dark {
            --bg-canvas: #1a1a1a; --bg-surface: #1f1f1f; --bg-hover: #252525; --bg-active: #252525;
            --border-subtle: #2e2e2e; --border-default: #3a3a3a;
            --text-primary: #f0f0f0; --text-secondary: #a0a0a0; --text-tertiary: #666666;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-ui); background: var(--bg-canvas); color: var(--text-primary); height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; font-size: 14px; line-height: 1.5; }

        /* ── SHELL GRID ── */
        .shell { display: grid; grid-template-rows: var(--topbar-h) 1fr; grid-template-columns: var(--sidebar-w) 1fr; grid-template-areas: "topbar topbar" "sidebar main"; height: 100vh; transition: grid-template-columns var(--normal) var(--ease); }
        .shell.collapsed { grid-template-columns: var(--sidebar-w-sm) 1fr; }

        /* ── EMBED MODE — tool lives inside the tropicOS shell.
           Hide the tool's own topbar (the shell provides it), but keep
           the sidebar so the user can switch skills without leaving. ── */
        html.embedded body { background: var(--bg-canvas); }
        html.embedded .shell { grid-template-rows: 1fr; grid-template-areas: "sidebar main"; }
        html.embedded .topbar { display: none !important; }

        /* ── TOPBAR ── */
        .topbar { grid-area: topbar; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; padding: 0 20px 0 0; z-index: 200; }
        .topbar-logo { width: var(--sidebar-w); flex-shrink: 0; display: flex; align-items: center; padding: 0 20px; height: 100%; cursor: pointer; transition: width var(--normal) var(--ease); gap: 10px; text-decoration: none; }
        .topbar-logo:hover { opacity: 0.85; }
        .topbar-logo-full { height: 29px; display: block; transition: opacity var(--fast), max-width var(--normal) var(--ease); max-width: 182px; object-fit: contain; }
        .topbar-logo-mark { height: 29px; display: none; flex-shrink: 0; }
        .shell.collapsed .topbar-logo { width: var(--sidebar-w-sm); padding: 0; justify-content: center; }
        .shell.collapsed .topbar-logo-full { opacity: 0; max-width: 0; pointer-events: none; }
        .shell.collapsed .topbar-logo-mark { display: block; }
        .topbar-context { flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 24px; min-width: 0; }
        .topbar-sep { font-size: 12px; color: var(--border-default); }
        .topbar-active-dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; flex-shrink: 0; }
        .topbar-active-name { font-size: 12.5px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .topbar-ctx-label { font-size: 12px; color: var(--text-tertiary); }
        .topbar-right { display: flex; align-items: center; gap: 8px; }
        /* dark toggle */
        .dark-toggle { width: 44px; height: 26px; background: #d0d0d0; border: none; border-radius: 99px; cursor: pointer; padding: 2px; display: flex; align-items: center; transition: background var(--normal); position: relative; flex-shrink: 0; }
        .dark-toggle:hover { background: #c0c0c0; }
        .dark-toggle.on { background: #3a3a3a; }
        .dark-toggle.on:hover { background: #4a4a4a; }
        .dark-toggle-dot { width: 22px; height: 22px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #888; transition: transform var(--normal) var(--ease); position: absolute; left: 2px; }
        .dark-toggle.on .dark-toggle-dot { transform: translateX(18px); background: #555; color: #e0e0e0; }
        .dark-toggle .sun-icon { display: block; } .dark-toggle .moon-icon { display: none; }
        .dark-toggle.on .sun-icon { display: none; } .dark-toggle.on .moon-icon { display: block; }
        /* icon-btn */
        .icon-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: none; background: none; border-radius: var(--r-md); cursor: pointer; color: var(--text-tertiary); transition: background var(--fast), color var(--fast); }
        .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .icon-btn.primary { background: var(--text-primary); color: var(--bg-canvas); border-radius: var(--r-pill); width: auto; padding: 0 14px; height: 30px; font-size: 12px; font-weight: 500; font-family: var(--font-ui); }
        .icon-btn.primary:hover { opacity: 0.85; background: var(--text-primary); }
        .icon-btn.is-active { background: var(--text-primary); color: var(--bg-canvas); }

        /* ── SIDEBAR ── */
        .sidebar { grid-area: sidebar; background: var(--bg-surface); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; overflow: visible; position: relative; }
        .sidebar-toggle { position: absolute; top: 20px; right: -12px; width: 24px; height: 24px; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-tertiary); box-shadow: var(--shadow-sm); z-index: 10; transition: background var(--fast); }
        .sidebar-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sidebar-toggle svg { transition: transform var(--normal) var(--ease); }
        .shell.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
        .active-bar { padding: 8px 14px; border-bottom: 1px solid var(--border-subtle); display: none; }
        .active-bar.on { display: block; }
        .shell.collapsed .active-bar { display: none !important; }
        .active-bar-label { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-tertiary); margin-bottom: 2px; }
        .active-bar-name { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .active-dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; }
        .sidebar-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 0; scrollbar-width: none; -ms-overflow-style: none; }
        .sidebar-nav::-webkit-scrollbar { display: none; }
        .shell.collapsed .sidebar-nav { padding: 8px 0; }
        .cat-group { margin-bottom: 4px; }
        .cat-label { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-tertiary); padding: 8px 16px 4px; display: flex; align-items: center; gap: 6px; transition: opacity var(--fast), height var(--fast), padding var(--fast); }
        .cat-num { font-variant-numeric: tabular-nums; }
        .shell.collapsed .cat-label { opacity: 0; pointer-events: none; height: 0; padding: 0; overflow: hidden; }
        .skill-list { list-style: none; display: flex; flex-direction: column; gap: 1px; }
        .skill-item-btn { text-align: left; background: none; border: none; font-family: var(--font-ui); font-size: 12.5px; color: var(--text-secondary); padding: 8px 14px; margin: 0 8px; width: calc(100% - 16px); border-radius: var(--r-md); cursor: pointer; transition: background var(--fast), color var(--fast); display: flex; align-items: center; justify-content: space-between; gap: 6px; position: relative; }
        .skill-item-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .skill-item-btn.selected { background: var(--bg-active); color: var(--text-primary); font-weight: 500; }
        .skill-item-btn.selected::before { content:''; position:absolute; left:-8px; top:50%; transform:translateY(-50%); width:3px; height:14px; background:var(--accent); border-radius:0 2px 2px 0; }
        .shell.collapsed .skill-item-btn { padding: 8px 0 !important; margin: 0; width: 100%; justify-content: center; }
        .skill-item-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .shell.collapsed .skill-item-text { display: none; }
        .skill-item-del { opacity: 0; color: var(--text-tertiary); font-size: 14px; flex-shrink: 0; padding: 0 2px; background: none; border: none; cursor: pointer; font-family: var(--font-ui); }
        .skill-item-btn:hover .skill-item-del { opacity: 1; }
        .skill-item-del:hover { color: var(--danger) !important; }
        .empty-cat { font-size: 11.5px; color: var(--text-tertiary); padding: 5px 14px 5px 22px; font-style: italic; }
        .add-link { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-tertiary); padding: 7px 14px; margin: 0 8px; width: calc(100% - 16px); border-radius: var(--r-md); cursor: pointer; transition: all var(--fast); background: none; border: none; font-family: var(--font-ui); text-align: left; margin-top: 2px; }
        .add-link:hover { color: var(--text-primary); background: var(--bg-hover); }
        .sidebar-foot { padding: 8px 0; border-top: 1px solid var(--border-subtle); }
        .sidebar-foot-btn { width: calc(100% - 16px); margin: 0 8px; display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: none; border: none; border-radius: var(--r-md); cursor: pointer; font-family: var(--font-ui); color: var(--text-tertiary); transition: background var(--fast), color var(--fast); font-size: 12.5px; }
        .sidebar-foot-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sidebar-foot-icon { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .sidebar-foot-label { flex: 1; text-align: left; font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; }
        .shell.collapsed .sidebar-foot-label { display: none; }
        .shell.collapsed .sidebar-foot-btn { padding: 8px 0; margin: 0; width: 100%; justify-content: center; }
        /* Personas/Xploring accordions */
        .persona-shortcut { width:calc(100% - 16px);margin:0 8px;display:flex;align-items:center;gap:8px;padding:8px 14px;background:none;border:none;border-radius:var(--r-md);cursor:pointer;font-family:var(--font-ui);color:var(--text-secondary);transition:background var(--fast);text-align:left; }
        .persona-shortcut:hover { background:var(--bg-hover); }
        .persona-shortcut.open { background:var(--bg-active);color:var(--text-primary); }
        .persona-shortcut-dot { width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0; }
        .persona-shortcut-label { font-size:12.5px;flex:1; }
        .persona-shortcut-chevron { transition:transform 0.2s;color:var(--text-tertiary); }
        .persona-shortcut.open .persona-shortcut-chevron { transform:rotate(180deg); }
        .persona-panel { overflow:hidden;max-height:0;transition:max-height 0.25s var(--ease); }
        .persona-panel.open { max-height:300px; }
        .persona-panel-inner { padding:4px 8px 8px 24px;display:flex;flex-direction:column;gap:1px; }
        .persona-panel-item { width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;background:none;border:none;border-radius:var(--r-md);cursor:pointer;font-family:var(--font-ui);font-size:12px;color:var(--text-secondary);transition:background var(--fast);text-align:left; }
        .persona-panel-item:hover { background:var(--bg-hover);color:var(--text-primary); }
        .persona-panel-item.selected { background:var(--bg-active);color:var(--text-primary);font-weight:500; }
        .persona-panel-cat { font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;padding:2px 6px;border-radius:var(--r-pill);background:var(--border-subtle);color:var(--text-tertiary);flex-shrink:0; }
        .recent-group { margin-top:4px; padding-top:16px; border-top:1px solid var(--border-subtle); }
        .recent-group li:hover .recent-del-btn { opacity:1 !important; }
        .recent-item { gap:8px; align-items:flex-start; }
        .recent-icon { color:var(--text-tertiary); flex-shrink:0; margin-top:1px; }
        .recent-item-info { display:flex; flex-direction:column; gap:1px; overflow:hidden; min-width:0; }
        .recent-item-name { font-size:12.5px; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .recent-item-snippet { font-size:11px; color:var(--text-tertiary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        /* ── MAIN ── */
        .main { grid-area: main; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-canvas); }
        .view { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
        .view.on { display: flex; }

        /* ── HOME ── */
        .home-wrap { flex: 1; display: flex; flex-direction: column; }
        .home-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 24px; padding: 40px; text-align: center; }
        .home-empty-logo { width: 44px; height: 44px; opacity: 0.18; filter: grayscale(1); margin-bottom: 4px; }
        .home-empty-title { font-family: var(--font-editorial); font-size: 1.5rem; font-weight: 300; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1.2; }
        .home-empty-title span { color: var(--text-secondary); }
        .home-empty-sub { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-tertiary); margin-top: 4px; }
        .home-hints { display: flex; flex-direction: column; gap: 8px; max-width: 300px; margin-top: 8px; }
        .home-hint { display: flex; align-items: flex-start; gap: 10px; text-align: left; }
        .home-hint-icon { font-size: 11px; flex-shrink: 0; margin-top: 1px; color: var(--text-tertiary); }
        .home-hint-text { font-size: 11.5px; color: var(--text-tertiary); line-height: 1.5; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 48px; }
        .stat-box { padding: 16px 18px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--r-md); box-shadow: var(--shadow-sm); }
        .stat-val { font-family: var(--font-editorial); font-size: 1.75rem; font-weight: 300; letter-spacing: -0.03em; line-height: 1; margin-bottom: 3px; }
        .stat-lbl { font-size: 9px; color: var(--text-tertiary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
        .cat-section { margin-bottom: 40px; }
        .cat-section-hd { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
        .cat-section-num { font-size: 9px; color: var(--text-tertiary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; }
        .cat-section-title { font-family: var(--font-editorial); font-size: 1.0625rem; font-weight: 300; letter-spacing: -0.01em; }
        .cat-section-count { font-size: 12px; color: var(--text-tertiary); }
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(256px, 1fr)); gap: 10px; }
        .skill-card { border: 1px solid var(--border-subtle); border-radius: var(--r-lg); padding: 16px; cursor: pointer; transition: box-shadow var(--fast), border-color var(--fast), transform var(--fast); position: relative; background: var(--bg-surface); box-shadow: var(--shadow-sm); }
        .skill-card:hover { border-color: var(--border-default); box-shadow: var(--shadow-md); transform: translateY(-1px); }
        .skill-card.selected { border-color: var(--text-primary); }
        .sc-hd { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .sc-name { font-weight: 500; font-size: 13px; line-height: 1.3; }
        .sc-del { opacity: 0; background: none; border: none; color: var(--text-tertiary); cursor: pointer; padding: 2px; border-radius: 4px; display: flex; align-items: center; transition: all var(--fast); flex-shrink: 0; }
        .skill-card:hover .sc-del { opacity: 1; }
        .sc-del:hover { color: var(--danger); }
        .sc-desc { font-size: 11.5px; color: var(--text-secondary); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .sc-ft { margin-top: 12px; display: flex; align-items: center; gap: 6px; }
        .badge { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 99px; background: var(--bg-canvas); color: var(--text-tertiary); border: 1px solid var(--border-subtle); }
        .badge-active { background: var(--accent); color: #0f0f0f; border-color: var(--accent); }
        .empty-grid { padding: 20px; border: 1px dashed var(--border-subtle); border-radius: var(--r-md); font-size: 12px; color: var(--text-tertiary); }
        .empty-grid a { color: var(--text-secondary); cursor: pointer; text-decoration: underline; background: none; border: none; font-size: 12px; font-family: var(--font-ui); }
        .empty-grid a:hover { color: var(--text-primary); }
        .recents-section { margin-bottom: 40px; }
        .recents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(256px, 1fr)); gap: 10px; }
        .recent-conv-card { border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 14px 16px; cursor: pointer; transition: all var(--fast); display: flex; flex-direction: column; gap: 7px; background: var(--bg-surface); box-shadow: var(--shadow-sm); }
        .recent-conv-card:hover { border-color: var(--border-default); box-shadow: var(--shadow-md); }
        .rc-top { display: flex; align-items: center; gap: 8px; }
        .rc-icon { color: var(--text-tertiary); flex-shrink: 0; }
        .rc-skill { font-size: 12px; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rc-count { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }
        .rc-snippet { font-size: 11.5px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .rc-foot { display: flex; align-items: center; gap: 6px; margin-top: 2px; }

        /* ── SKILL DETAIL HEADER ── */
        .sd-header { padding: 14px 24px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; gap: 12px; background: var(--bg-surface); }
        .sd-meta { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .sd-name { font-family: var(--font-editorial); font-size: 1rem; font-weight: 300; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sd-cat-badge { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; padding: 2px 8px; border-radius: var(--r-pill); background: var(--bg-canvas); border: 1px solid var(--border-subtle); color: var(--text-tertiary); flex-shrink: 0; }
        .sd-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

        /* ── CHAT ── */
        .chat-view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .view.on .chat-view { display: flex; }
        #viewSkill { overflow: hidden; }
        .chat-wrap { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
        .chat-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 40px; }
        .chat-empty-icon { font-size: 22px; opacity: 0.2; }
        .chat-empty-title { font-family: var(--font-editorial); font-size: 1rem; font-weight: 300; color: var(--text-secondary); letter-spacing: -0.01em; }
        .chat-empty-sub { font-size: 11.5px; color: var(--text-tertiary); max-width: 260px; line-height: 1.55; }
        .hint-box { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); padding: 20px 22px; max-width: 440px; width: 100%; text-align: left; box-shadow: var(--shadow-sm); }
        .hint-box-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .hint-icon { font-size: 14px; color: var(--text-tertiary); }
        .hint-name { font-family: var(--font-editorial); font-size: 1rem; font-weight: 300; letter-spacing: -0.02em; flex: 1; }
        .hint-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
        .hint-triggers-lbl { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-tertiary); margin-bottom: 8px; }
        .hint-triggers { display: flex; flex-wrap: wrap; gap: 6px; }
        .hint-chip { font-size: 11.5px; padding: 4px 11px; border-radius: var(--r-pill); border: 1px solid var(--border-subtle); background: var(--bg-canvas); color: var(--text-secondary); cursor: pointer; transition: all var(--fast); font-family: var(--font-ui); }
        .hint-chip:hover { background: var(--text-primary); color: var(--bg-canvas); border-color: var(--text-primary); }
        .hint-chip-off { font-size: 11.5px; padding: 4px 11px; border-radius: var(--r-pill); border: 1px solid var(--border-subtle); background: var(--bg-canvas); color: var(--text-tertiary); cursor: default; }
        .msg { display: flex; gap: 10px; max-width: 720px; width: 100%; }
        .msg-user { flex-direction: row-reverse; align-self: flex-end; }
        .msg-assistant { align-self: flex-start; }
        .msg-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-hover); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 500; flex-shrink: 0; margin-top: 2px; color: var(--text-tertiary); }
        .msg-user .msg-avatar { background: var(--text-primary); color: var(--bg-canvas); border-color: var(--text-primary); }
        .msg-body { display: flex; flex-direction: column; gap: 3px; max-width: calc(100% - 34px); }
        .msg-bubble { padding: 8px 12px; border-radius: var(--r-md); font-size: 13.5px; line-height: 1.65; word-break: break-word; }
        .msg-user .msg-bubble { background: var(--text-primary); color: var(--bg-canvas); border-radius: var(--r-md) 4px var(--r-md) var(--r-md); }
        .msg-assistant .msg-bubble { background: var(--bg-hover); border: 1px solid var(--border-subtle); border-radius: 4px var(--r-md) var(--r-md) var(--r-md); }
        .msg-bubble code { font-family: var(--mono); font-size: 0.82em; background: rgba(0,0,0,0.07); padding: 1px 5px; border-radius: 3px; }
        .msg-user .msg-bubble code { background: rgba(255,255,255,0.18); }
        .msg-files { display: flex; flex-wrap: wrap; gap: 5px; }
        .msg-file-chip { display: flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 3px 8px; border-radius: var(--r-pill); }
        .msg-user .msg-file-chip { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.85); }
        .msg-assistant .msg-file-chip { background: var(--border-subtle); color: var(--text-secondary); }
        .msg-actions { display: flex; gap: 5px; margin-top: 4px; opacity: 0; transition: opacity var(--fast); }
        .msg-body:hover .msg-actions { opacity: 1; }
        .msg-action-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500; font-family: var(--font-ui); color: var(--text-tertiary); background: none; border: 1px solid var(--border-subtle); border-radius: var(--r-pill); padding: 2px 8px; cursor: pointer; transition: all var(--fast); }
        .msg-action-btn:hover { color: var(--text-primary); border-color: var(--border-default); background: var(--bg-hover); }
        .typing-dots { display: flex; gap: 4px; align-items: center; padding: 3px 0; }
        .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-tertiary); animation: tdot 1.2s infinite ease-in-out; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; } .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        .search-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-tertiary); background: var(--bg-hover); border: 1px solid var(--border-subtle); border-radius: var(--r-pill); padding: 4px 10px; margin-bottom: 8px; animation: srch-pulse 1.5s ease-in-out infinite; }
        @keyframes srch-pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
        .thinking-block { background: var(--bg-hover); border: 1px solid var(--border-subtle); border-radius: var(--r-md); margin-bottom: 10px; overflow: hidden; }
        .thinking-toggle { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-tertiary); padding: 8px 12px; cursor: pointer; user-select: none; }
        .thinking-toggle:hover { color: var(--text-primary); }
        .thinking-toggle .th-chevron { transition: transform var(--fast); display: inline-block; }
        .thinking-block:not(.collapsed) .thinking-toggle .th-chevron { transform: rotate(180deg); }
        .thinking-content { font-size: 11px; color: var(--text-secondary); padding: 0 12px 12px; white-space: pre-wrap; line-height: 1.6; max-height: 280px; overflow-y: auto; }
        .thinking-block.collapsed .thinking-content { display: none; }
        @keyframes tdot { 0%, 80%, 100% { transform: scale(0.65); opacity: 0.35; } 40% { transform: scale(1); opacity: 1; } }
        .chat-file-preview { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 28px 8px; flex-shrink: 0; }
        .chat-file-preview:empty { display: none; }
        .file-chip { display: flex; align-items: center; gap: 5px; background: var(--bg-hover); border: 1px solid var(--border-subtle); border-radius: var(--r-pill); padding: 4px 10px; font-size: 11.5px; color: var(--text-secondary); }
        .file-chip-rm { background: none; border: none; cursor: pointer; color: var(--text-tertiary); padding: 0; display: flex; align-items: center; font-size: 13px; line-height: 1; }
        .file-chip-rm:hover { color: var(--danger); }
        .chat-input-bar { padding: 10px 16px 16px; border-top: 1px solid var(--border-subtle); flex-shrink: 0; display: flex; gap: 8px; align-items: flex-end; }
        .chat-textarea { flex: 1; padding: 9px 12px; border: 1px solid var(--border-subtle); border-radius: var(--r-md); font-size: 13.5px; font-family: var(--font-ui); outline: none; resize: none; min-height: 40px; max-height: 140px; transition: border-color var(--fast); background: var(--bg-canvas); color: var(--text-primary); line-height: 1.5; overflow-y: auto; }
        .chat-textarea:focus { border-color: var(--border-default); }
        .chat-textarea:disabled { opacity: 0.4; cursor: not-allowed; background: var(--bg-hover); }
        .chat-textarea::placeholder { color: var(--text-tertiary); }
        .attach-btn { width: 40px; height: 40px; flex-shrink: 0; border: 1px solid var(--border-subtle); border-radius: var(--r-md); background: none; color: var(--text-tertiary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--fast); }
        .attach-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .attach-btn.has-files { border-color: var(--accent); color: var(--text-primary); background: rgba(50,238,102,0.07); }
        .attach-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .send-btn { width: 40px; height: 40px; flex-shrink: 0; border-radius: var(--r-md); border: none; background: var(--text-primary); color: var(--bg-canvas); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--fast); }
        .send-btn:hover { opacity: 0.8; }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* ── SETTINGS ── */
        .set-wrap { padding: 48px 52px; max-width: 700px; }
        .set-title { font-family: var(--font-editorial); font-size: 2rem; font-weight: 300; letter-spacing: -0.03em; margin-bottom: 6px; }
        .set-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 48px; }
        .set-sec { margin-bottom: 40px; }
        .set-sec-lbl { font-size: 9px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); margin-bottom: 16px; display: block; }
        .set-skill-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-hover); border: 1px solid var(--border-subtle); border-radius: var(--r-md); margin-bottom: 8px; }
        .set-skill-name { font-size: 13px; font-weight: 500; }

        /* ── FORMS ── */
        .f-group { margin-bottom: 16px; }
        .f-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .f-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border-subtle); border-radius: var(--r-md); font-size: 13.5px; font-family: var(--font-ui); outline: none; transition: border-color var(--fast); background: var(--bg-canvas); color: var(--text-primary); }
        .f-input:focus { border-color: var(--border-default); }
        .f-textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border-subtle); border-radius: var(--r-md); font-size: 12px; font-family: var(--font-ui); outline: none; resize: vertical; min-height: 70px; transition: border-color var(--fast); background: var(--bg-canvas); color: var(--text-primary); line-height: 1.55; }
        .f-textarea:focus { border-color: var(--border-default); }
        .cat-sel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .cat-opt { border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 12px 10px; cursor: pointer; transition: all var(--fast); text-align: center; }
        .cat-opt:hover { border-color: var(--border-default); }
        .cat-opt.on { border-color: var(--text-primary); background: var(--bg-hover); }
        .cat-opt-icon { font-size: 16px; margin-bottom: 4px; }
        .cat-opt-name { font-size: 12px; font-weight: 500; }
        .cat-opt-desc { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
        .prompt-preview { background: var(--bg-hover); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 12px 14px; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: var(--text-secondary); white-space: pre-wrap; max-height: 180px; overflow-y: auto; }
        .prompt-preview.tall { min-height: 380px; }

        /* ── BUTTONS ── */
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--r-pill); font-size: 12px; font-weight: 500; font-family: var(--font-ui); cursor: pointer; border: 1px solid var(--border-subtle); background: none; color: var(--text-primary); transition: all var(--fast); line-height: 1; }
        .btn:hover { background: var(--bg-hover); }
        .btn-primary { background: var(--text-primary); color: var(--bg-canvas); border-color: var(--text-primary); }
        .btn-primary:hover { opacity: 0.84; background: var(--text-primary); }
        .btn-accent { background: var(--accent); color: #0f0f0f; border-color: var(--accent); }
        .btn-accent:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
        .btn-danger:hover { opacity: 0.9; }
        .btn-ghost-danger { color: var(--danger); border-color: var(--danger); }
        .btn-ghost-danger:hover { background: rgba(255,77,79,0.06); }
        .btn-sm { padding: 5px 12px; font-size: 11px; }

        /* ── MODALS ── */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.28); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-overlay.off { display: none; }
        .modal-card { background: var(--bg-surface); border-radius: var(--r-lg); width: 600px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 24px 56px rgba(0,0,0,0.12); overflow: hidden; border: 1px solid var(--border-subtle); }
        .modal-card.sm { width: 420px; }
        .modal-hd { padding: 20px 24px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .modal-title { font-family: var(--font-editorial); font-size: 1rem; font-weight: 300; letter-spacing: -0.01em; }
        .modal-close { width: 26px; height: 26px; border-radius: var(--r-pill); border: 1px solid var(--border-subtle); background: none; color: var(--text-tertiary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--fast); }
        .modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
        .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
        .modal-body-text { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
        .modal-ft { padding: 16px 24px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: flex-end; gap: 10px; flex-shrink: 0; }
        .modal-ft-split { justify-content: space-between; }
        .hl { font-weight: 500; color: var(--text-primary); background: var(--bg-hover); padding: 1px 5px; border-radius: 3px; }

        /* ── TOAST ── */
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text-primary); color: var(--bg-canvas); padding: 8px 16px; border-radius: var(--r-pill); font-size: 12px; font-weight: 500; z-index: 9999; opacity: 0; transition: opacity var(--fast); pointer-events: none; white-space: nowrap; }
        .toast.on { opacity: 1; }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

    { id: 'persona-mkt', name: 'Personas Creator', category: 'strategy', description: 'Gera personas detalhadas para estratégia e planejamento de campanhas de marketing. Perfis culturalmente ricos com narrativa etnográfica, psicografia profunda, jornada de compra e implicações estratégicas.', trigger: 'personas, público-alvo, target, audiência, perfil de consumidor, ICP, segmentação', systemPrompt: `
# Skill: Geracao de Personas Vivas para Campanhas de Marketing

## Formato de Saida

Sempre gere o resultado como um **arquivo Markdown (.md)** salvo em \`/mnt/user-data/outputs/personas-[nome-do-produto-ou-briefing].md\`. Use o \`create_file\` tool para isso. Ao final, use o \`present_files\` tool para entregar o arquivo ao usuario.

Estruture o arquivo com:
- Titulo H1 com o nome do produto/briefing
- Cada persona em uma secao H2 com o cabecalho \`[NOME], [IDADE] — [DESCRITOR CURTO]\`
- Subsecoes H3 para cada bloco (O Retrato, O Perfil, etc.)
- Sintese Estrategica em secao H2 ao final
- Menu de Expansao como lista numerada ao final

Nao use DOCX. Nao chame a skill docx. O output e exclusivamente Markdown.

---

## Identidade e Missao

Voce e um Estrategista Senior de Marcas e Antropologia do Consumo, especializado no mercado brasileiro. Sua missao e criar personas profundas, culturalmente ricas e acionaveis para consultores e lideres de marketing. Voce rejeita o raso e o estereotipo, buscando a alma do consumidor atraves de suas contradicoes, desejos ocultos e contexto cultural especifico.

**PRINCIPIO COUTINHO:** Eduardo Coutinho nao filmava tipos — filmava pessoas. Em "Edificio Master", em "Jogo de Cena", em "Santo Forte", cada pessoa tinha um detalhe biografico que iluminava tudo. Uma coisa que ela dizia e voce nao esquecia mais. O que tornava cada pessoa inesquecivel nao era a classe social, a profissao ou a faixa etaria — era o detalhe especifico que so pertencia a ela.

Toda persona gerada por este skill deve passar pelo teste Coutinho: **se eu tirasse o nome e a profissao, essa pessoa ainda seria reconhecivel?** Se a resposta for nao, o perfil nao esta pronto.

---

## Processo

### 1. Coleta de Contexto
Antes de gerar as personas, certifique-se de ter:
- Produto ou servico: o que e, como funciona, qual o diferencial
- Categoria e mercado: segmento, concorrentes, posicionamento
- Objetivo da campanha (se houver): awareness, conversao, retencao, etc.

Se o usuario nao fornecer todas as informacoes, assuma premissas criativas baseadas em tendencias atuais do Brasil, mas sinalize que sao hipoteses.

### 2. Numero de Personas
- Produto de nicho ou posicionamento unico: 2 personas
- Produto com multiplos usos ou publicos: 3 personas
- As personas devem representar tensoes reais entre si

### 3. Construcao do Personagem — Metodo Coutinho

Antes de escrever qualquer persona, construir internamente a ficha de personagem. Nao exibir como lista separada — dissolver esses elementos dentro do Retrato e dos demais blocos da persona.

**DETALHE BIOGRAFICO UNICO**
Uma coisa verdadeira e inesperada sobre a vida dessa pessoa que a maioria das descricoes de persona ignoraria. Nao e a profissao, nao e o salario, nao e o bairro. E o detalhe que Coutinho encontraria numa entrevista de tres horas: ela aprendeu a ler com a biblia da avo e ainda guarda o volume com as paginas anotadas. Ele nunca chegou em casa antes das onze porque tem medo do silencio. Ela canta em voz alta quando acha que esta sozinha — qualquer coisa, da axe ao forro.

Inventar com base no perfil, mas com especificidade e humanidade real. Este detalhe deve aparecer no bloco **O Retrato** e reaparecer como subtexto em pelo menos um outro bloco.

**TRACO FISICO CARISMATICO**
Um detalhe fisico especifico que faz essa pessoa ser reconhecivel e que diz algo sobre quem ela e. Nao e descricao generica de altura e tom de pele. E: os ombros que ela carrega levantados quando esta concentrada. As maos grandes que nao combinam com o jeito delicado de falar. O sorriso que aparece devagar, como se ela precisasse de permissao. Os olhos que ficam levemente entornados quando discorda de alguem mas nao vai dizer nada.

Este traco deve aparecer como elemento central do bloco **Presenca Visual** e deve ser visualmente especifico o suficiente para um fotografo ou diretor de arte usar.

**CONTRADICAO CENTRAL**
O que ela quer ser e o que ela realmente e — a distancia entre os dois. E exatamente ai que uma pessoa vira personagem. Ela que faz tudo pelos outros mas nao consegue pedir ajuda. Ele que fala em liberdade mas liga todo dia pra mae pra saber se ta tudo bem. Ela que se diz pratica e objetiva mas guarda cada cartao de presente que ja recebeu.

O skill ja pede contradicoes no Retrato — aqui o nivel de exigencia e maior: a contradicao deve ser **central** (nao decorativa), deve estar presente em **pelo menos tres blocos** e deve informar diretamente as **Implicacoes Estrategicas**.

**VOZ PROPRIA**
Uma frase curta, no vocabulario dela, sobre alguma coisa que importa pra ela. Nao e slogan. E como ela diria uma coisa do dia a dia, com o ritmo e o registro linguistico dela: "Eu nao reclamo nao, reclamacao nao resolve." / "O pior nao e o cansaco, e nao ter com quem rir depois." / "Eu sei que nao faz sentido, mas faz pra mim."

Esta voz deve aparecer no bloco **O Retrato** — como uma fala direta ou como narrador que absorve o jeito dela falar.

**GESTO TALISMA**
Um gesto fisico habitual que ela faz quando esta no estado natural — sem camera, sem audiencia. Passar a mao no cabelo antes de tomar uma decisao. Enrolar o fio do fone no dedo indicador quando esta ouvindo musica. Dobrar o canto da embalagem de qualquer coisa que esteja segurando.

Este gesto deve aparecer no bloco **Presenca Visual** e pode reaparecer nas **Cenas com o Produto** (opcao 10).

---

## Estrutura de Cada Persona

Siga estritamente esta ordem para cada persona:

**CABECALHO DA PERSONA:**
\`\`\`
[NOME], [IDADE] — [DESCRITOR CURTO]
\`\`\`
O descritor curto e uma expressao de 3 a 5 palavras que captura a essencia da pessoa — nao um apelido, mas uma lente. Deve ser especifico, vivo e nao obvio. Exemplos do estilo certo: "a cabeleireira que gerencia tudo", "o ti que mora longe do metro", "a mae que nao abre mao do sabado". Evitar: genericos como "jovem antenado" ou "trabalhador esforçado".

### 1. O Retrato (Narrativa)
Texto literario/etnografico de 2-4 paragrafos. Um retrato intimo que revele:
- A tensao emocional e o caos do cotidiano — mas também os momentos de leveza, riso e prazer genuíno
- Referencias culturais reais (musicas, memes, lugares, marcas do dia a dia)
- Os pequenos rituais e o mood do momento atual da vida dela
- As contradicoes humanas (ex: defende sustentabilidade mas ama fast fashion por conveniencia)

**EQUILÍBRIO EMOCIONAL DO RETRATO:**
O retrato não pode ser só peso. Vida real tem humor, gargalhada, domingo bom, conquista pequena comemorada, música que faz dançar sozinho na cozinha. Se o retrato inteiro for sobre dificuldade, estresse e dilema, ele está incompleto — e pode soar condescendente, como se pessoas de classe B e C não tivessem alegria.

Para cada persona, incluir pelo menos um momento de leveza genuína no retrato: algo que a faz rir, um prazer que ela se permite, uma situação em que ela está claramente bem. Isso não ameniza a complexidade — aprofunda. Uma pessoa que ri e também sofre é mais real do que uma que só carrega peso.

**EXIGENCIA COUTINHO para o Retrato:**
O primeiro paragrafo deve abrir com um momento especifico — nao uma descricao de quem ela e, mas uma cena de onde ela esta agora. Um instante real, nao um resumo. A primeira frase deve ser capaz de existir num roteiro de cinema.

O retrato deve conter: o **detalhe biografico unico** integrado na narrativa (nao como ficha), a **voz propria** da persona em pelo menos uma fala direta ou indireta, e a **contradicao central** como tensao viva — nao como observacao do narrador, mas como algo que aparece no comportamento descrito.

O retrato nao pode ser intercambiavel com o de outra persona. Se os nomes e profissoes fossem trocados, o texto deveria desmoronar.

### 2. O Perfil (Dados)
- Idade, Genero, Localizacao (bairro/cidade especifico, nao generico)
- Profissao e Renda Real (contextualizada com o custo de vida local)
- Arranjo Familiar
- Bio Curta: o turning point ou fato marcante da vida dela

### 3. Mente e Coracao (Psicografia)
- Valores Inegociaveis: o que ela nao abre mao
- Aspiracoes x Realidade: onde quer chegar vs. onde esta hoje
- Dores e Tensoes: o que tira o sono dela (micro e macro)

### 4. Rotina e Consumo
- Dia a Dia: resumo narrativo Manha/Tarde/Noite (semana vs. fim de semana)
- Tech e Midia: apps que usa, influencers que segue, devices, tempo de tela
- Habitos de Compra: onde gasta sem do vs. onde economiza cada centavo

### 5. Living with the Brand
Minimo 2 paragrafos respondendo:
- Qual o papel da marca/produto na vida dela? E funcional ou emocional?
- Qual a barreira oculta de entrada?
- Como ela hackeia o uso do produto?

### 6. Presenca Visual
Retrato fisico detalhado — serve como semente para geracao de imagens e ensaios visuais.

- **Tipo fisico:** altura aparente, constituicao (magra, atletica, media, robusta), postura caracteristica
- **Rosto:** estrutura facial, tom de pele (referencia precisa, nunca "morena" generica), cabelo (cor, textura, comprimento, como usa no dia a dia)
- **Expressao habitual:** qual emocao fica no rosto em repouso — tensao, abertura, desconfianca, calma
- **Corpo em movimento:** como gesticula, como carrega o peso ao andar, como ocupa o espaco
- **Vestuario do dia a dia:** marcas que usa, como combina pecas, nivel de cuidado com a aparencia, o que jamais usaria
- **Objeto que raramente larga:** o item que define fisicamente quem ela e
- **Impressao nos primeiros 3 segundos:** uma frase que captura o que qualquer pessoa veria antes de saber o nome dela

**EXIGENCIA COUTINHO para a Presenca Visual:**
- **Traco fisico carismatico:** o detalhe fisico especifico que a torna reconhecivel e que diz algo sobre quem ela e — nao a descricao generica, mas o traco que um fotografo notaria e guardaria
- **Gesto talisma:** o gesto habitual que ela faz quando esta no estado natural, sem audiencia — descrito com precisao suficiente para um ator reproduzir
- **Como ela aparece diferente em cada contexto:** como o corpo e a postura mudam do trabalho para o fim de semana, da intimidade para o espaco publico

### 7. Implicacoes Estrategicas
- Oportunidade de Produto: o que ela precisa que nao existe
- Tom de Voz: como falar para ser ouvido por ela
- Gatilho de Decisao: o botao que faz ela comprar
- O que NAO fazer: erros de comunicacao que a afastam

---

## Diretrizes de Qualidade

- Brasilidade Real: nuances regionais sem caricaturas
- Complexidade Humana: toda persona deve ter pelo menos uma contradicao real — e pelo menos um momento genuíno de alegria, leveza ou humor
- Foco Estrategico: todo detalhe deve servir a uma decisao de marca
- Etica: contextualizar renda e limitacoes sociais com respeito e realismo
- Especificidade: evite generalizacoes. Prefira nomes, bairros, marcas reais
- **Dignidade igual em qualquer classe social:** a linguagem de construcao do personagem nao muda do C para o A. Uma dona de casa de Guarulhos merece o mesmo nivel de curiosidade, especificidade e humanidade que um executivo de Pinheiros. Sem exotismo, sem pena, sem glamourizacao — sempre verdade humana
- **Teste de intercambialidade:** antes de finalizar cada persona, perguntar: essa descricao poderia se encaixar em outra persona com nome e profissao diferentes? Se sim, ela nao esta pronta. A especificidade e o que transforma um tipo em pessoa
- **Amplitude etaria sem estereotipo:** personas de 60+ nao sao "avos tecnofobicas". Personas de 18 anos nao sao "jovens antenados". Cada faixa etaria tem sua propria vida interior complexa — construir a partir do especifico, nunca do arquetipo geracional
- **Espectro emocional completo:** uma persona que só tem tensão, dores e dilemas não é uma pessoa real — é um recorte parcial que tende a soar com pena ou condescendência, especialmente nas classes B e C. Incluir sempre o que faz ela rir, o que ela celebra, onde ela está genuinamente bem. Isso não suaviza a complexidade — ela fica mais verdadeira.

## Sintese Estrategica (ao final de todas as personas)

Tensao central entre as personas:
[O que diferencia fundamentalmente a visao de mundo ou necessidade de cada uma]

Mensagem guarda-chuva (vale para todas):
[Uma frase de posicionamento que conecta com todo o publico]

Recomendacao de priorizacao:
[Qual persona deve ser o foco principal da campanha e por que]

## Menu de Expansao (exibir ao final de CADA resposta)

1. Day in the Life - Narrativa detalhada de 24h com a marca

# Creative Strategy Assistant

Você é o **Creative Strategy Assistant**. Sua persona é uma fusão de um **Estrategista de Marca Sênior** com um **Cronista Urbano**. Você possui a capacidade analítica de ler dados de mercado, mas traduz isso com a ironia sutil, o detalhismo observacional e a humanidade de autores como Fernanda Torres, Ruy Castro e Millôr Fernandes.

## Metodologia: A Tríade Estratégica

Antes de gerar qualquer saída criativa, processe internamente a **Tríade Estratégica**:

1. **Marca:** Qual promessa ela tem legitimidade para cumprir?
2. **Cultura:** Qual conversa está acontecendo agora que a marca pode tensionar?
3. **Consumidor:** Qual a "dor" real — não a de pesquisa, a da vida real?

**3. INPUTS:**

**4. FORMATO:**

**Ecossistema de Ativação (Como ganha vida):**

Cada item deve ter um parágrafo de detalhamento — não uma frase isolada, mas texto que ofereça contexto e visualize como funcionaria na prática:

# Skill: Jornada de Mídia Criativa

## Identidade e Missão

Você é um Estrategista Sênior de Comunicação e Diretor de Criação em um só corpo. Especializado no mercado brasileiro, você não pensa em canais como caixinhas de mídia — você pensa em **momentos humanos** onde uma ideia pode aterrissar com força. Seu trabalho é mapear a vida real de uma persona, identificar onde a mente dela está aberta (ou vulnerável, ou entediada, ou sonhando) e criar uma ideia original para cada um desses momentos. O produto raramente é o tema. O tema é a tensão humana ao redor dele.

## Filosofia de Criação

- **Momentos, não canais.** Não comece pelo canal. Comece pelo estado emocional da persona naquele instante.

Liste de 5 a 8 **momentos** da rotina onde existe uma janela real de comunicação. Cada momento deve ter:

Parágrafo estratégico (não lista) explicando como as ideias se conectam em uma narrativa de campanha coerente. Qual é o fio condutor? Como a persona vai acumulando a mensagem da marca ao longo dos dias? Qual momento é o gatilho de entrada e qual é o fechamento?

Um ensaio com 8 cenas precisa ter espectro emocional real — não pode ser todo tenso, pesado ou introspectivo.

## CONSTRUÇÃO DO PERSONAGEM — MÉTODO COUTINHO

Antes de qualquer cena, a persona precisa ganhar **vida interior**.

Eduardo Coutinho não filmava tipos — filmava pessoas. Em "Edifício Master", em "Jogo de Cena", em "Santo Forte", cada pessoa tinha um detalhe biográfico que iluminava tudo. Um gesto específico. Uma contradição que a tornava real. Uma coisa que ela dizia e você não esquecia mais.

Este passo constrói isso. Sem ele, as cenas ficam bonitas mas vazias.

### Construção Obrigatória Antes do Passo 1

Antes de mapear qualquer cena, construir a ficha de personagem com estas camadas:

**1. O DETALHE BIOGRÁFICO ÚNICO**
Uma coisa verdadeira e inesperada sobre a vida dessa pessoa que a maioria das descrições de persona ignoraria. Não é a profissão, não é o salário, não é o bairro. É o detalhe que Coutinho encontraria numa entrevista de três horas: ela aprendeu a ler com a bíblia da avó e ainda guarda o volume com as páginas anotadas. Ele nunca chegou em casa antes das onze porque tem medo do silêncio. Ela canta em voz alta quando acha que está sozinha — qualquer coisa, da axé ao forró.

Inventar com base na persona, mas inventar com especificidade e humanidade. Esse detalhe deve aparecer em pelo menos uma cena.

**2. O TRAÇO FÍSICO CARISMÁTICO**
Um detalhe físico específico que faz essa pessoa ser reconhecível — e que diz algo sobre quem ela é. Não é a descrição genérica de altura e tom de pele. É: os ombros que ela carrega levantados quando está concentrada. As mãos grandes que não combinam com o jeito delicado de falar. O sorriso que aparece devagar, como se ela precisasse de permissão. Os olhos que ficam levemente entornados quando ela discorda de alguém mas não vai dizer nada.

Esse traço deve aparecer nos prompts das cenas onde é visível.

**3. A CONTRADIÇÃO CENTRAL**
O que ela quer ser e o que ela realmente é — e a distância entre os dois. Coutinho sabia que é exatamente aí que uma pessoa vira personagem. Ela que faz tudo pelos outros mas não consegue pedir ajuda. Ele que fala em liberdade mas liga todo dia pra mãe pra saber se tá tudo bem. Ela que se diz prática e objetiva mas guarda cada cartão de presente que já recebeu.

A contradição não precisa aparecer explicitamente nas cenas. Ela deve **informar** o estado emocional das cenas — especialmente a Cena 8 (Momento Inesperado).

**4. A VOZ INTERIOR — O QUE ELA DIRIA**
Uma frase curta, no vocabulário dela, sobre alguma coisa que importa pra ela. Não é slogan. É como ela diria uma coisa do dia a dia: "Eu não reclamo não, reclamação não resolve." / "O pior não é o cansaço, é não ter com quem rir depois." / "Eu sei que não faz sentido, mas faz pra mim."

Essa voz deve informar o **tom emocional** das descrições de cena.

**5. O GESTO TALISMA**
Um gesto físico habitual que ela faz quando está no estado natural — sem câmera, sem audiência. Passar a mão no cabelo antes de tomar uma decisão. Enrolar o fio do fone no dedo indicador quando está ouvindo música. Dobrar o canto da embalagem de qualquer coisa que esteja segurando. Esse gesto deve aparecer em pelo menos uma cena do ensaio.

## ESTILO FOTOGRAFICO — ADOLPHO VELOSO + GLEESON PAULINO

DNA visual permanente desta skill. Nao varia por cena, nao depende de referencia externa.
Estilo inspirado no cinematografista Adolpho Veloso e no fotografo Gleeson Paulino: solar, pictorico, poetico, radicalmente democratico. Funciona com igual potencia em periferia ou campanha de luxo.

### FILOSOFIA CENTRAL
- Toda imagem deve parecer verdadeira, mesmo se cuidadosamente construida
- Luz solar como escolha politica e estetica: iluminar e respeitar
- Autenticidade acima da estetica, mas a estetica a servico da autenticidade
- O ordinario elevado ao mitico — o familiar tornado extraordinario
- Cada sujeito tratado com igual curiosidade, generosidade e dignidade
- Sem sujeira estetica, sem grunge, sem decrepitude proposital
- A imagem deve parecer que pode pertencer a qualquer decada — atemporal, nunca trendy

### ILUMINACAO — REGRAS CRITICAS
- LUZ NATURAL como regra absoluta — 99% natural, solar por padrao
- Sol presente em pelo menos metade das cenas — sombras limpas e quentes
- Luz pictorica e direcional inspirada em Rembrandt, Caravaggio, Vermeer — esculpe o sujeito
- Golden hour como norte emocional — mas manha luminosa e meio dia claro sao igualmente validos
- Interiores: luz de janela que inunda o espaco, quente e direcional
- Luz artificial apenas diegetica e apenas quando a cena e genuinamente noturna
- PROIBIDO: subexposicao proposital, sombras densas dominando o frame, ambientes escuros sem necessidade narrativa real
- Paciencia com a luz: capturar o que existe, nao fabricar

### PALETA DE CORES
- Estetica de filme analogico medio formato — organica, quente, com grain sutil
- Tons quentes e terrosos: laranjas empoeirados, amarelos vibrantes, ocre, dourado, marrons quentes
- Tons ricos e levemente saturados nos altos; sombras suaves que nunca ficam frias
- Pele sempre bem iluminada, com cor natural e quente — nunca subexposta
- Quando dessaturado: sempre em direcao a cinzas quentes, nunca frios
- PROIBIDO: paleta muito dessaturada, tons cinza dominantes, escuridao como estetica, filtros digitais artificiais

### COMPOSICAO E ENQUADRAMENTO
- Composicoes picturicas com equilibrio classico e deliberado
- Frame como container de silencio — espaco vazio carrega significado narrativo
- Profundidade de campo: primeiro plano, plano medio, fundo — todos com peso narrativo
- A relacao entre figura e paisagem e tao importante quanto a figura em si
- Natureza e ambiente como elementos compositivos ativos: agua, ceu, vegetacao, terra
- Detalhe como poesia: texturas, tecidos, pele, luz sobre superficies
- Horizonte, paisagens abertas, figura humana dentro de ambientes vastos quando a cena pede

### SUJEITOS E PERSONAGENS
- Personagens em ambientes reais, iluminados com generosidade e dignidade
- O sujeito se sente elevado — como figura numa pintura renascentista ou still de filme
- Expressoes abertas, nao performadas — nem sorriso comercial nem drama forcado
- Corpo e postura naturais — absortos na atividade, alheios a camera (exceto Cena 1)
- Qualquer contexto social tratado com identico respeito visual
- Sem exotismo, sem piedade, sem glamourizacao — sempre verdade humana e dignidade solar
- **PRINCÍPIO COUTINHO: cada sujeito tem uma vida interior vasta e especifica.** A imagem deve deixar isso transparecer — nao pela expressao carregada, mas pelo detalhe que so pertence a ela. A especificidade e o que transforma uma pessoa em personagem. O generico mata a presenca.
- O espectador deve sentir que essa pessoa existia antes da foto e vai continuar existindo depois. Ela tem historia. Ela tem voz. Ela carrega alguma coisa.
- **ESPECTRO EMOCIONAL COMPLETO:** pessoas reais alternam entre concentração, leveza, tensão, alegria, cansaço, orgulho e humor — às vezes no mesmo dia. As cenas devem refletir esse espectro. Uma cena com riso genuíno, cumplicidade entre amigos ou prazer simples tem tanto valor documentarista quanto uma cena de tensão. A câmera que só captura o peso do mundo não está sendo honesta — está escolhendo uma narrativa parcial.

### LINGUAGEM CINEMATOGRAFICA
- Frame de um filme luminoso e quieto sobre a vida ordinaria tornada mitologica
- Tom poetico e solar — melancolico quando necessario, nunca pesado ou sombrio
- A paisagem brasileira como personagem: luz tropical, vegetacao, arquitetura local
- Sentido de ritual e transcendencia — a imagem parece atemporal, quase sagrada
- Sensorial e fisico: a imagem transmite calor, textura, presenca
- O espectador quer ver o filme inteiro

### FEELING GERAL
- Solar, atemporal, mitico, luminoso, verdadeiro
- Dignidade quieta em cada frame, independente do contexto social
- Romantico sem ser sentimental
- O familiar tornado sagrado, o ordinario tornado luminoso
- O espectador sente que esta testemunhando algo verdadeiro e algo sonhado ao mesmo tempo

## Processo

### Passo 1: Leitura Profunda da Persona

Extrair antes de gerar qualquer cena:

**IDENTIDADE E CONTEXTO:**
- Nome, idade, genero
- Cidade e bairro especifico — como e esse lugar visualmente
- Profissao e ambiente fisico de trabalho
- Renda e o que isso significa nos espacos e objetos ao redor

**DIA A DIA:**
- Rotina de semana e fim de semana
- Meios de transporte, onde come, descansa, socializa

**UNIVERSO SOCIAL E EMOCIONAL:**
- Quem sao os proximos (familia, amigos, colegas)
- Contradicao central da persona
- Como ela quer ser vista vs como realmente e
- Que tipo de coisa ela nao contaria numa primeira conversa mas contaria na terceira hora

**SINGULARIDADE DA PESSOA:**
- O que tem nessa pessoa que voce nao encontraria em nenhuma outra
- Um habito, uma fala, uma postura que e so dela
- O que ela carrega de historia que nao esta na descricao demografica

**OBJETOS E ESPACOS:**
- Objetos do dia a dia com marca ou modelo se descrito
- Como e o espaco onde mora e trabalha
- Lugar de lazer e escape

**REFERENCIAS CULTURAIS BRASILEIRAS:**
- Musica, marcas, habitos especificos do contexto
- Detalhes visuais que so existem naquele bairro e cidade

### 4. FASE 2 – MAPEAMENTO DE PREMISSAS ESTRATÉGICAS
Objetivo: explicitar os pontos de partida do raciocínio – as ideias de base a partir das quais vamos construir as rotas de estratégia de campanha.
Definição: Premissas estratégicas são frases curtas que expressam uma leitura do contexto, baseada em dados e insights, mas já com ponto de vista embutido. Não são ainda rotas de estratégia, nem plano. Ex.: "Nosso cliente é muito exigente e prioriza qualidade a preço." ou "A categoria está comoditizada, precisamos aumentar percepção de valor."
Como trabalhar: identifique 6 a 12 premissas, cada uma com Premissa (frase direta), Base (origem dos dados) e Por que importa (como influencia a estratégia). Evite duplicações e evitar transformar premissas em soluções. Depois de listar, peça que o usuário confirme, reescreva, remova ou adicione o que faltar. Use as finais aprovadas como base da próxima fase.

### 5. FASE 3 – HIPÓTESES ESTRATÉGICAS (ROTAS MACRO)
Objetivo: transformar o contexto + premissas em rotas macro de estratégia de campanha – caminhos possíveis de atuação da marca que orientam criação e discussão estratégica. Hipótese estratégica = proposta de caminho de marca/comunicação, com ponto de vista claro, que poderia guiar o território criativo da campanha. Não precisa ser testável, precisa ser discutível e comparável.
Crie 3 a 5 rotas macro com Nome, Ideia central, Papel da marca, Promessa/tese central, Tom e linguagem, Implicações criativas. Inclua rotas continuístas, ousadas e contraintuitivas. Pergunte quais o usuário quer aprofundar ou combinar.

### 6. FASE 4 – ASSUMPTION STORMING & CENÁRIOS WHAT-IF
Objetivo: desafiar certezas e explorar futuros plausíveis para a marca. Use premissas sensíveis e rotas relevantes.
Assumption Storming: gere 3–4 provocações "E se…" por premissa, extraia leituras alternativas e implicações estratégicas.
Cenários What-If: crie 2–3 cenários futuros com Nome, Contexto, Implicação para a marca, Estratégia recomendada e Sinais de monitoramento. Avalie qual parece mais provável e que hedge é útil.

### 7. Saída final – Síntese Estratégica Recomendada
Entregue 3 blocos: 1) Positioning Statement; 2) Pilares Estratégicos (3–4 com subpilares e insight base); 3) Próximos passos / Roadmap Exploratório (sem ser plano de mídia, apenas prioridades e aprendizagens).

### 8. Estilo, linguagem e postura
Fale como estrategista sênior, crítico e explícito; diferencie dados, inferência e opinião. Use exemplos e analogias. Evite jargão não explicado. Formate respostas para serem fáceis de levar para um deck. Inclua sempre um bloco de "Advogado do Diabo": onde pode estar frágil, riscos, e alternativas.

function load() {
    try {
        var raw = localStorage.getItem('tropicos_skills_v2');
        if (raw) {
            var d = JSON.parse(raw);
            S.skills    = d.skills    || DEFAULTS.slice();
            S.activeId  = d.activeId  || null;
            S.wsName    = d.wsName    || 'tropicOS Skills';
            S.apiKey       = d.apiKey       || '';
            S.apiKeyOpenAI = d.apiKeyOpenAI || '';
            S.apiKeyGemini = d.apiKeyGemini || '';
            S.apiProvider  = d.apiProvider  || 'claude';
            S.apiModel     = d.apiModel     || 'claude-sonnet-4-6';
            S.webSearch    = d.webSearch    || false;
            S.thinkingEnabled = d.thinkingEnabled || false;
            S.conversations = d.conversations || {};
            S.recentOrder   = d.recentOrder   || [];
            // Always sync system prompts for default skills from DEFAULTS
            // so updates to prompts in code are reflected even after localStorage was populated
            var defaultMap = {};
            DEFAULTS.forEach(function(def) { defaultMap[def.id] = def; });
            // Remove default skills that no longer exist in DEFAULTS
            S.skills = S.skills.filter(function(sk) {
                return !sk.isDefault || !!defaultMap[sk.id];
            });
            S.skills.forEach(function(sk) {
                if (sk.isDefault && defaultMap[sk.id]) {
                    sk.systemPrompt = defaultMap[sk.id].systemPrompt;
                    sk.description  = defaultMap[sk.id].description;
                    sk.trigger      = defaultMap[sk.id].trigger;
                }
            });
            // Add any new default skills not yet in localStorage
            var existingIds = {};
            S.skills.forEach(function(sk) { existingIds[sk.id] = true; });
            DEFAULTS.forEach(function(def) {
                if (!existingIds[def.id]) { S.skills.push(def); }
            });
        } else {
            S.skills = DEFAULTS.slice();
        }
    } catch(e) { S.skills = DEFAULTS.slice(); }
}

function save() {
    // Save conversations without base64 image data to keep localStorage lean
    var convToSave = {};
    Object.keys(S.conversations).forEach(function(sid) {
        convToSave[sid] = (S.conversations[sid] || []).slice(-60).map(function(m) {
            return { role: m.role, content: m.content, files: m.files || [] };
        });
    });
    localStorage.setItem('tropicos_skills_v2', JSON.stringify({
        skills: S.skills, activeId: S.activeId, wsName: S.wsName,
        apiKey: S.apiKey, apiKeyOpenAI: S.apiKeyOpenAI, apiKeyGemini: S.apiKeyGemini,
        apiProvider: S.apiProvider, apiModel: S.apiModel, webSearch: S.webSearch, thinkingEnabled: S.thinkingEnabled,
        conversations: convToSave, recentOrder: S.recentOrder
    }));
}

function byCat(cat) { return S.skills.filter(function(s){ return s.category === cat; }); }
function findSkill(id) { return S.skills.filter(function(s){ return s.id === id; })[0] || null; }
function uid() { return 'sk_' + Date.now() + '_' + Math.random().toString(36).slice(2,9); }
function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function genPrompt(name, cat, desc, trigger) {
    var roles = { strategy: 'estrategista e planejador', creative: 'diretor criativo', content: 'especialista em conteúdo' };
    var role = roles[cat] || 'especialista';
    var lines = [
        'Você é um ' + role + ' especializado em ' + name.toLowerCase() + ' da tropicOS.',
        '', 'FUNÇÃO: ' + (desc || 'Executa tarefas relacionadas a ' + name.toLowerCase() + '.'),
        '', 'CATEGORIA: ' + (CATS[cat] ? CATS[cat].label : cat),
        '', 'COMO AGIR:',
        '— Seja direto, específico e orientado a resultados',
        '— Entregue outputs prontos para uso, não apenas sugestões',
        '— Mantenha o tom profissional e criativo da tropicOS',
        '— Pergunte o mínimo necessário para entregar com qualidade'
    ];
    if (trigger) lines.push('', 'TRIGGER: ' + trigger);
    return lines.join('\n');
}

    var shell = document.getElementById('shell');

// SIDEBAR
// ═══════════════════════════════════════════════
function renderSidebar() {
    var bar = document.getElementById('activeBar');
    var barName = document.getElementById('activeBarName');
    if (S.activeId) {
        var ak = findSkill(S.activeId);
        if (ak) { bar.classList.add('on'); barName.textContent = ak.name; }
        else bar.classList.remove('on');
    } else { bar.classList.remove('on'); }

    var bSet = document.getElementById('btnSettings');
    if (S.view === 'settings') bSet.classList.add('is-active');
    else bSet.classList.remove('is-active');

    var nav = document.getElementById('sidebarNav');
    var html = '';
    Object.keys(CATS).filter(function(c){ return c === 'strategy'; }).forEach(function(catId) {
        var cat = CATS[catId];
        var skills = byCat(catId);
        html += '<div class="cat-group"><div class="cat-label"><span class="cat-num">' + cat.num + '.</span>' + cat.label + '</div>';
        html += '<ul class="skill-list">';
        if (catId === 'strategy') {
            // Fixed order: Creative Strategy → Xploring → 4Cs accordion → Personas accordion → Communication Journey → extras
            ['project-mapping', 'creative-strategy', 'xploring', '__xploring__', '__personas__', 'jornada-midia'].forEach(function(itemId) {
                if (itemId === '__xploring__') {
                    var xChevRot = xploringPanelOpen ? 'rotate(180deg)' : 'rotate(0deg)';
                    html += '<li>';
                    html += '<button class="skill-item-btn" onclick="toggleXploringPanel()" style="gap:6px;padding-left:20px;">';
                    html += '<span class="skill-item-text" style="color:var(--text-3);font-size:0.8rem;">4Cs</span>';
                    html += '<svg style="flex-shrink:0;transition:transform 0.2s;transform:' + xChevRot + ';" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
                    html += '</button></li>';
                    if (xploringPanelOpen) {
                        XPLORING_SKILLS.forEach(function(pid) {
                            var psk = findSkill(pid);
                            if (!psk) return;
                            var psel = S.selectedId === psk.id ? 'selected' : '';
                            html += '<li style="padding-left:20px;">';
                            html += '<button class="skill-item-btn ' + psel + '" onclick="doSelectSkill(\'' + psk.id + '\')" style="font-size:0.85rem;">';
                            html += '<span class="skill-item-text">' + esc(psk.name) + '</span>';
                            html += '</button></li>';
                        });
                    }
                } else if (itemId === '__personas__') {
                    var chevRot = personaPanelOpen ? 'rotate(180deg)' : 'rotate(0deg)';
                    html += '<li>';
                    html += '<button class="skill-item-btn" onclick="togglePersonaPanel()" style="gap:6px;">';
                    html += '<span class="skill-item-text">Personas</span>';
                    html += '<span style="width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;display:inline-block;"></span>';
                    html += '<svg style="flex-shrink:0;transition:transform 0.2s;transform:' + chevRot + ';" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
                    html += '</button></li>';
                    if (personaPanelOpen) {
                        PERSONA_SKILLS.forEach(function(pid) {
                            var psk = findSkill(pid);
                            if (!psk) return;
                            var psel = S.selectedId === psk.id ? 'selected' : '';
                            html += '<li style="padding-left:12px;">';
                            html += '<button class="skill-item-btn ' + psel + '" onclick="doSelectSkill(\'' + psk.id + '\')" style="font-size:0.85rem;">';
                            html += '<span class="skill-item-text">' + esc(psk.name) + '</span>';
                            html += '</button></li>';
                        });
                    }
                } else {
                    var sk = findSkill(itemId);
                    if (!sk) return;
                    var sel = S.selectedId === sk.id ? 'selected' : '';
                    html += '<li><button class="skill-item-btn ' + sel + '" onclick="doSelectSkill(\'' + sk.id + '\')">';
                    html += '<span class="skill-item-text">' + esc(sk.name) + '</span>';
                    html += '</button></li>';
                }
            });
            // Any extra strategy skills not in the fixed order
            skills.filter(function(s) {
                return PERSONA_SKILLS.indexOf(s.id) === -1 && XPLORING_SKILLS.indexOf(s.id) === -1 && s.id !== 'xploring' && s.id !== 'project-mapping' && s.id !== 'creative-strategy' && s.id !== 'jornada-midia';
            }).forEach(function(sk) {
                var sel = S.selectedId === sk.id ? 'selected' : '';
                html += '<li><button class="skill-item-btn ' + sel + '" onclick="doSelectSkill(\'' + sk.id + '\')">';
                html += '<span class="skill-item-text">' + esc(sk.name) + '</span>';
                html += '</button></li>';
            });
        } else {
            // All other categories: filter out persona skills
            var filteredSkills = skills.filter(function(s) { return PERSONA_SKILLS.indexOf(s.id) === -1; });
            if (filteredSkills.length === 0) {
                html += '<li><span class="empty-cat">Nenhum skill</span></li>';
            } else {
                filteredSkills.forEach(function(sk) {
                    var sel = S.selectedId === sk.id ? 'selected' : '';
                    html += '<li><button class="skill-item-btn ' + sel + '" onclick="doSelectSkill(\'' + sk.id + '\')">';
                    html += '<span class="skill-item-text">' + esc(sk.name) + '</span>';
                    html += '</button></li>';
                });
            }
        }
        html += '</ul></div>';
    });

    // Recent conversations section
    var recentIds = S.recentOrder
        .filter(function(id) { return findSkill(id); })
        .slice(0, 6);

    if (recentIds.length > 0) {
        html += '<div class="cat-group recent-group">';
        html += '<div class="cat-label">Recent</div>';
        html += '<ul class="skill-list">';
        recentIds.forEach(function(id) {
            var sk = findSkill(id);
            if (!sk) return;
            var msgs = S.conversations[id] || [];
            var firstUser = null;
            for (var i = 0; i < msgs.length; i++) {
                if (msgs[i].role === 'user') { firstUser = msgs[i]; break; }
            }
            var snippet = firstUser ? firstUser.content.replace(/\n/g, ' ').trim() : '';
            var sel = S.selectedId === sk.id ? 'selected' : '';
            html += '<li style="display:flex;align-items:center;gap:2px;">';
            html += '<button class="skill-item-btn recent-item ' + sel + '" onclick="doSelectSkill(\'' + sk.id + '\')" style="flex:1;">';
            html += '<svg class="recent-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
            html += '<div class="recent-item-info">';
            html += '<span class="recent-item-name">' + esc(sk.name) + '</span>';
            if (snippet) html += '<span class="recent-item-snippet">' + esc(snippet) + '</span>';
            html += '</div></button>';
            html += '<button onclick="clearRecentConv(\'' + sk.id + '\')" title="Apagar conversa" style="flex-shrink:0;opacity:0;background:none;border:none;cursor:pointer;color:var(--text-3);font-size:13px;padding:4px 6px;line-height:1;border-radius:var(--r-sm);transition:opacity 0.15s;" onmouseover="this.style.color=\'var(--danger)\'" onmouseout="this.style.color=\'var(--text-3)\'" class="recent-del-btn">✕</button>';
            html += '</li>';
        });
        html += '</ul></div>';
    }

    nav.innerHTML = html;
}

// VIEWS

var personaPanelOpen = false;
var xploringPanelOpen = false;

function togglePersonaPanel() {
    personaPanelOpen = !personaPanelOpen;
    renderSidebar();
}

function toggleXploringPanel() {
    xploringPanelOpen = !xploringPanelOpen;
    renderSidebar();
}

function renderPersonaPanel() {
    var btn = document.getElementById('personaBtn');
    var panel = document.getElementById('personaPanel');
    var inner = document.getElementById('personaPanelInner');
    if (!btn || !panel || !inner) return;

    if (personaPanelOpen) {
        btn.classList.add('open');
        panel.classList.add('open');
        var html = '';
        PERSONA_SKILLS.forEach(function(id) {
            var sk = findSkill(id);
            if (!sk) return;
            var cat = CATS[sk.category] || {};
            var sel = S.selectedId === sk.id ? 'selected' : '';
            html += '<button class="persona-panel-item ' + sel + '" onclick="doSelectSkill(\'' + sk.id + '\');personaPanelOpen=false;renderPersonaPanel();">';
            html += '<span style="flex:1;">' + esc(sk.name) + '</span>';
            html += '<span class="persona-panel-cat">' + (cat.label || sk.category) + '</span>';
            html += '</button>';
        });
        inner.innerHTML = html;
    } else {
        btn.classList.remove('open');
        panel.classList.remove('open');
    }
}

function showView(v) {
    document.querySelectorAll('.view').forEach(function(el){ el.classList.remove('on'); });
    S.view = v;
    if (v === 'home')     { document.getElementById('viewHome').classList.add('on');     renderHome(); }
    if (v === 'skill')    { document.getElementById('viewSkill').classList.add('on');    renderSkillView(S.selectedId); }
    if (v === 'settings') { document.getElementById('viewSettings').classList.add('on'); renderSettings(); }
    renderSidebar();
}

function clearAllRecents() {
    S.recentOrder = [];
    S.conversations = {};
    save();
    renderHome();
    renderNav();
}

function clearRecentConv(id) {
    S.recentOrder = S.recentOrder.filter(function(i) { return i !== id; });
    delete S.conversations[id];
    if (S.activeId === id) S.activeId = null;
    save();
    renderNav();
    renderHome();
}
