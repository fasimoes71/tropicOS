// ═══════════════════════════════════════════════
// SKILL VIEW (CHAT)
// ═══════════════════════════════════════════════
function renderSkillView(id) {
    var sk = findSkill(id);
    if (!sk) { showView('home'); return; }
    var cat = CATS[sk.category] || { label: sk.category, num: '—' };
    var isActive = S.activeId === sk.id;

    // Header
    var hd = '<div class="sd-meta">';
    hd += '<div class="sd-name">' + esc(sk.name) + '</div>';
    hd += '<span class="sd-cat-badge">' + cat.num + '. ' + cat.label + '</span>';
    hd += '</div>';
    hd += '<div class="sd-actions">';
    // Edit button
    hd += '<button class="btn btn-sm" onclick="openEdit(\'' + sk.id + '\')" title="Editar skill">';
    hd += '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
    hd += 'Editar</button>';
    // New conversation button
    var conv = S.conversations[sk.id] || [];
    var hasHistory = conv.length > 0;
    hd += '<button class="btn btn-sm" onclick="clearConversation(\'' + sk.id + '\')" title="Nova conversa"' + (hasHistory ? '' : ' disabled style="opacity:0.4;cursor:default;"') + '>';
    hd += '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>';
    hd += 'Nova conversa</button>';
    // Active toggle
    if (isActive) {
        hd += '<button class="btn btn-accent btn-sm" onclick="deactivate()">';
        hd += '<div style="width:5px;height:5px;background:var(--text);border-radius:50%;"></div>Ativo</button>';
    } else {
        hd += '<button class="btn btn-primary btn-sm" onclick="activate(\'' + sk.id + '\')">Ativar</button>';
    }
    hd += '</div>';
    document.getElementById('sdHeader').innerHTML = hd;

    // Chat messages
    renderChatMessages(sk, isActive);

    // Input state
    var inp = document.getElementById('chatInput');
    var sendBtn = document.getElementById('sendBtn');
    var attachBtn = document.getElementById('attachBtn');
    if (inp) {
        inp.disabled = !isActive || S.isStreaming;
        inp.placeholder = isActive ? 'Mensagem para ' + sk.name + '...' : 'Clique em "Ativar" para usar o chat';
    }
    if (sendBtn) sendBtn.disabled = !isActive || S.isStreaming;
    if (attachBtn) attachBtn.disabled = !isActive || S.isStreaming;
}

function renderChatMessages(sk, isActive) {
    var conv = S.conversations[sk.id] || [];
    var el = document.getElementById('chatMessages');
    if (!el) return;
    if (conv.length === 0) {
        var triggers = sk.trigger ? sk.trigger.split(',').map(function(t){ return t.trim(); }).filter(Boolean) : [];
        var cat = CATS[sk.category] || { icon: '◈' };
        var html = '<div class="chat-empty">';
        html += '<div class="hint-box">';
        html += '<div class="hint-box-hd"><span class="hint-icon">' + cat.icon + '</span><span class="hint-name">' + esc(sk.name) + '</span>';
        if (!isActive) html += '<button class="btn btn-primary btn-sm" onclick="activate(\'' + sk.id + '\')">Ativar</button>';
        html += '</div>';
        if (sk.description) html += '<p class="hint-desc">' + esc(sk.description) + '</p>';
        if (triggers.length > 0) {
            html += '<div class="hint-triggers-lbl">Experimente perguntar sobre</div>';
            html += '<div class="hint-triggers">';
            triggers.forEach(function(t) {
                if (isActive) {
                    html += '<button class="hint-chip" onclick="fillInput(\'' + esc(t) + '\')">' + esc(t) + '</button>';
                } else {
                    html += '<span class="hint-chip hint-chip-off">' + esc(t) + '</span>';
                }
            });
            html += '</div>';
        }
        html += '</div></div>';
        el.innerHTML = html;
    } else {
        var html = '';
        conv.forEach(function(msg, i) { html += buildMsgHTML(msg, i); });
        el.innerHTML = html;
        scrollToBottom();
    }
}

function buildMsgHTML(msg, idx) {
    var isUser = msg.role === 'user';
    var cls = isUser ? 'msg-user' : 'msg-assistant';
    var av = isUser ? 'TU' : 'AI';
    var idxAttr = (idx !== undefined) ? ' data-midx="' + idx + '"' : '';
    var html = '<div class="msg ' + cls + '"' + idxAttr + '><div class="msg-avatar">' + av + '</div><div class="msg-body">';
    if (msg.files && msg.files.length > 0) {
        html += '<div class="msg-files">';
        msg.files.forEach(function(f) {
            html += '<span class="msg-file-chip"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> ' + esc(f.name) + '</span>';
        });
        html += '</div>';
    }
    html += '<div class="msg-bubble">' + fmtContent(msg.content) + '</div>';
    if (!isUser && isWorkOutput(msg.content)) {
        html += '<div class="msg-actions">';
        html += '<button class="msg-action-btn" onclick="downloadMd(' + idx + ')" title="Baixar como .md">';
        html += '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
        html += ' .md</button>';
        html += '</div>';
    }
    html += '</div></div>';
    return html;
}

function fmtContent(text) {
    var t = esc(text || '');
    t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\n/g, '<br>');
    return t;
}

function scrollToBottom() {
    var el = document.getElementById('chatMessages');
    if (el) setTimeout(function(){ el.scrollTop = el.scrollHeight; }, 10);
}

// ═══════════════════════════════════════════════
// CHAT ACTIONS
// ═══════════════════════════════════════════════
function activate(id) {
    S.activeId = id;
    save(); showView('skill'); toast('Skill ativado');
    setTimeout(function(){ var inp = document.getElementById('chatInput'); if (inp) inp.focus(); }, 80);
}

function deactivate() {
    S.activeId = null;
    save(); showView('skill'); toast('Skill desativado');
}

function clearConversation(id) {
    S.conversations[id] = [];
    S.recentOrder = S.recentOrder.filter(function(i){ return i !== id; });
    // Auto-activate so the input is immediately ready
    if (S.activeId !== id) S.activeId = id;
    save();
    renderSkillView(id);
    toast('Nova conversa iniciada');
    var inp = document.getElementById('chatInput');
    if (inp) { inp.disabled = false; inp.focus(); }
}

function isWorkOutput(content) {
    if (!content) return false;
    var hasHeaders   = /^#{1,3} /m.test(content);
    var hasBulkBold  = (content.match(/\*\*/g) || []).length >= 4;
    var hasBullets   = /^[-*•] /m.test(content);
    var isLong       = content.length > 800;
    // Consider it a work output if it has structural markdown AND is substantial
    return isLong && (hasHeaders || (hasBulkBold && hasBullets));
}

function downloadMd(idx) {
    var sk = findSkill(S.selectedId);
    if (!sk) return;
    var conv = S.conversations[sk.id] || [];
    var msg = conv[idx];
    if (!msg || msg.role !== 'assistant') return;
    var filename = sk.name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '') + '-' + new Date().toISOString().slice(0,10) + '.md';
    var blob = new Blob([msg.content], { type: 'text/markdown' });
    var url  = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    toast('Baixando ' + filename);
}

// ── File Upload ──
function handleFileSelect(event) {
    var files = event.target.files;
    if (!files || files.length === 0) return;
    Array.from(files).forEach(function(file) {
        var isImage = file.type.startsWith('image/');
        var isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        var isBinary = file.name.toLowerCase().endsWith('.docx') || file.name.toLowerCase().endsWith('.xlsx');

        if (isImage) {
            if (file.size > 10 * 1024 * 1024) {
                toast('Imagem muito grande (' + (file.size / 1024 / 1024).toFixed(1) + 'MB). Máximo 10MB.');
                return;
            }
            var reader = new FileReader();
            reader.onload = function(e) {
                S.pendingFiles.push({ name: file.name, type: file.type, data: e.target.result.split(',')[1], isImage: true, isPDF: false });
                updateFilePreview();
            };
            reader.readAsDataURL(file);

        } else if (isPDF) {
            // Extract text client-side with PDF.js — no file size limit
            var chipId = 'pdf-loading-' + Date.now();
            var el = document.getElementById('chatFilePreview');
            if (el) el.insertAdjacentHTML('beforeend', '<div class="file-chip" id="' + chipId + '"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> <span>' + esc(file.name) + ' — lendo…</span></div>');
            var attachBtn = document.getElementById('attachBtn');
            if (attachBtn) attachBtn.classList.add('has-files');

            var pdfReader = new FileReader();
            pdfReader.onload = function(e) {
                var remove = function() { var c = document.getElementById(chipId); if (c) c.remove(); };
                if (window.pdfjsLib) {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
                        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    var typedArr = new Uint8Array(e.target.result);
                    window.pdfjsLib.getDocument({ data: typedArr }).promise.then(function(pdf) {
                        var pages = [];
                        for (var p = 1; p <= pdf.numPages; p++) pages.push(p);
                        return pages.reduce(function(chain, p) {
                            return chain.then(function(acc) {
                                return pdf.getPage(p).then(function(pg) {
                                    return pg.getTextContent().then(function(content) {
                                        return acc + content.items.map(function(i){ return i.str; }).join(' ') + '\n';
                                    });
                                });
                            });
                        }, Promise.resolve(''));
                    }).then(function(fullText) {
                        fullText = fullText.replace(/\s{3,}/g, '\n').trim();
                        if (fullText.length > 40000) fullText = fullText.slice(0, 40000) + '\n[... truncado]';
                        remove();
                        S.pendingFiles.push({ name: file.name, type: 'text/plain', data: fullText, isImage: false, isPDF: false });
                        updateFilePreview();
                    }).catch(function(err) {
                        remove();
                        toast('Erro ao ler PDF: ' + err.message);
                        updateFilePreview();
                    });
                } else {
                    // Fallback: send as binary if PDF.js unavailable (still cap at 20MB)
                    remove();
                    if (file.size > 20 * 1024 * 1024) {
                        toast('PDF muito grande (' + (file.size / 1024 / 1024).toFixed(1) + 'MB). Máximo 20MB sem PDF.js.');
                        updateFilePreview();
                        return;
                    }
                    var bytes = new Uint8Array(e.target.result);
                    var bin = ''; bytes.forEach(function(b){ bin += String.fromCharCode(b); });
                    S.pendingFiles.push({ name: file.name, type: 'application/pdf', data: btoa(bin), isImage: false, isPDF: true });
                    updateFilePreview();
                }
            };
            pdfReader.readAsArrayBuffer(file);

        } else if (isBinary) {
            toast('Formato ' + file.name.split('.').pop().toUpperCase() + ' não suportado. Use PDF, imagem ou texto.');
        } else {
            var reader2 = new FileReader();
            reader2.onload = function(e) {
                S.pendingFiles.push({ name: file.name, type: file.type || 'text/plain', data: e.target.result, isImage: false, isPDF: false });
                updateFilePreview();
            };
            reader2.readAsText(file);
        }
    });
    event.target.value = '';
}

function updateFilePreview() {
    var el = document.getElementById('chatFilePreview');
    var attachBtn = document.getElementById('attachBtn');
    if (!el) return;
    if (S.pendingFiles.length === 0) {
        el.innerHTML = '';
        if (attachBtn) attachBtn.classList.remove('has-files');
        return;
    }
    if (attachBtn) attachBtn.classList.add('has-files');
    var html = '';
    S.pendingFiles.forEach(function(f, i) {
        html += '<div class="file-chip">';
        if (f.isImage) {
            html += '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
        } else {
            html += '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
        }
        html += ' <span>' + esc(f.name) + '</span>';
        html += '<button class="file-chip-rm" onclick="removeFile(' + i + ')">×</button></div>';
    });
    el.innerHTML = html;
}

function removeFile(i) { S.pendingFiles.splice(i, 1); updateFilePreview(); }

// ── Send Message ──
async function sendMessage() {
    if (S.isStreaming) return;
    var sk = findSkill(S.selectedId);
    if (!sk || S.activeId !== sk.id) return;
    var activeKey = S.apiProvider === 'openai' ? S.apiKeyOpenAI : S.apiProvider === 'gemini' ? S.apiKeyGemini : S.apiKey;
    if (!activeKey) { toast('Configure a API Key nas configurações ⚙'); return; }

    var inp = document.getElementById('chatInput');
    var text = inp ? inp.value.trim() : '';
    if (!text && S.pendingFiles.length === 0) return;

    // Build user message
    var filesInfo = S.pendingFiles.map(function(f){ return { name: f.name, type: f.type, isImage: f.isImage }; });
    var userMsg = { role: 'user', content: text || '(arquivo)', files: filesInfo };

    // Build API content for current message
    var apiContent = [];
    S.pendingFiles.forEach(function(f) {
        if (f.isImage) {
            apiContent.push({ type: 'image', source: { type: 'base64', media_type: f.type, data: f.data } });
        } else if (f.isPDF) {
            apiContent.push({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: f.data } });
        } else {
            apiContent.push({ type: 'text', text: '[Arquivo: ' + f.name + ']\n' + f.data });
        }
    });
    if (text) apiContent.push({ type: 'text', text: text });
    var apiUserMsg = { role: 'user', content: apiContent.length === 1 && apiContent[0].type === 'text' ? apiContent[0].text : apiContent };

    // Update state
    if (!S.conversations[sk.id]) S.conversations[sk.id] = [];
    S.conversations[sk.id].push(userMsg);
    // Track recent order (move to front)
    S.recentOrder = S.recentOrder.filter(function(i){ return i !== sk.id; });
    S.recentOrder.unshift(sk.id);

    // Clear input
    if (inp) { inp.value = ''; inp.style.height = 'auto'; }
    S.pendingFiles = []; updateFilePreview();

    // Render user msg
    var msgEl = document.getElementById('chatMessages');
    if (msgEl) {
        var emptyEl = msgEl.querySelector('.chat-empty');
        if (emptyEl) emptyEl.remove();
        msgEl.insertAdjacentHTML('beforeend', buildMsgHTML(userMsg));
        scrollToBottom();
    }

    // Typing indicator
    var typingId = 'typing_' + Date.now();
    if (msgEl) {
        msgEl.insertAdjacentHTML('beforeend',
            '<div class="msg msg-assistant" id="' + typingId + '"><div class="msg-avatar">AI</div>' +
            '<div class="msg-body"><div class="msg-bubble"><div class="typing-dots">' +
            '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>' +
            '</div></div></div></div>');
        scrollToBottom();
    }

    S.isStreaming = true;
    setInputState(true);

    // Build history for API (text-only for past messages)
    var apiMessages = [];
    S.conversations[sk.id].slice(0, -1).forEach(function(m) {
        apiMessages.push({ role: m.role, content: m.content });
    });
    apiMessages.push(apiUserMsg);

    var hasPDF = S.conversations[sk.id].some(function(m){ return m.files && m.files.some(function(f){ return f.isImage === false && f.name && f.name.toLowerCase().endsWith('.pdf'); }); }) || filesInfo.some(function(f){ return f.name && f.name.toLowerCase().endsWith('.pdf'); });

    try {
        var res;
        var provider = S.apiProvider || 'claude';

        if (provider === 'openai') {
            var oaiMessages = [{ role: 'system', content: sk.systemPrompt }].concat(
                apiMessages.map(function(m) {
                    if (Array.isArray(m.content)) {
                        var txt = m.content.filter(function(c){ return c.type === 'text'; }).map(function(c){ return c.text; }).join('\n');
                        return { role: m.role, content: txt };
                    }
                    return { role: m.role, content: m.content };
                })
            );
            res = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + activeKey },
                body: JSON.stringify({ model: S.apiModel, max_tokens: 16000, messages: oaiMessages, stream: true })
            });
        } else if (provider === 'gemini') {
            var gemContents = apiMessages.map(function(m) {
                var txt = Array.isArray(m.content) ? m.content.filter(function(c){ return c.type==='text'; }).map(function(c){ return c.text; }).join('\n') : m.content;
                return { role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: txt }] };
            });
            res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + S.apiModel + ':streamGenerateContent?key=' + activeKey + '&alt=sse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ system_instruction: { parts: [{ text: sk.systemPrompt }] }, contents: gemContents, generationConfig: { maxOutputTokens: 16000 } })
            });
        } else {
            var apiHeaders = {
                'Content-Type': 'application/json',
                'x-api-key': activeKey,
                'anthropic-version': '2023-06-01',
                'anthropic-dangerous-direct-browser-access': 'true'
            };
            var betaFlags = [];
            if (hasPDF) betaFlags.push('pdfs-2024-09-25');
            if (S.webSearch) betaFlags.push('web-search-2025-03-05');
            if (betaFlags.length) apiHeaders['anthropic-beta'] = betaFlags.join(',');
            var claudeBody = { model: S.apiModel || 'claude-sonnet-4-6', max_tokens: 16000, system: sk.systemPrompt, messages: apiMessages, stream: true };
            if (S.thinkingEnabled) claudeBody.thinking = { type: 'enabled', budget_tokens: 8000 };
            if (S.webSearch) claudeBody.tools = [{ type: 'web_search_20250305', name: 'web_search', max_uses: 5 }];
            res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: apiHeaders,
                body: JSON.stringify(claudeBody)
            });
        }

        if (!res.ok) {
            var errJson = await res.json().catch(function(){ return {}; });
            var errMsg = (errJson.error && errJson.error.message) || 'Erro ' + res.status;
            if (res.status === 429) throw new Error('Limite de requisições atingido. Aguarde alguns segundos.');
            throw new Error(errMsg);
        }

        // Remove typing indicator
        var typEl = document.getElementById(typingId);
        if (typEl) typEl.remove();

        // Add streaming assistant bubble
        var aId = 'amsg_' + Date.now();
        if (msgEl) {
            msgEl.insertAdjacentHTML('beforeend',
                '<div class="msg msg-assistant" id="' + aId + '"><div class="msg-avatar">AI</div>' +
                '<div class="msg-body"><div class="msg-bubble" id="' + aId + '_c"></div></div></div>');
            scrollToBottom();
        }

        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var fullText = '';
        var contentEl = document.getElementById(aId + '_c');
        var searchIndicatorId = 'srch_' + aId;
        var thinkingBlockId = 'think_' + aId;
        var currentBlockType = null;
        var thinkingText = '';

        while (true) {
            var result = await reader.read();
            if (result.done) break;
            var chunk = decoder.decode(result.value, { stream: true });
            chunk.split('\n').forEach(function(line) {
                if (!line.startsWith('data: ')) return;
                var data = line.slice(6);
                if (data === '[DONE]') return;
                try {
                    var parsed = JSON.parse(data);
                    var delta = '';
                    if (provider === 'openai' && parsed.choices && parsed.choices[0].delta && parsed.choices[0].delta.content) {
                        delta = parsed.choices[0].delta.content;
                    } else if (provider === 'gemini' && parsed.candidates && parsed.candidates[0].content && parsed.candidates[0].content.parts) {
                        delta = parsed.candidates[0].content.parts.map(function(p){ return p.text || ''; }).join('');
                    } else if (parsed.type === 'content_block_start' && parsed.content_block) {
                        var blk = parsed.content_block;
                        currentBlockType = blk.type;
                        if (blk.type === 'thinking') {
                            thinkingText = '';
                            if (contentEl && !document.getElementById(thinkingBlockId)) {
                                var thEl = document.createElement('div');
                                thEl.id = thinkingBlockId;
                                thEl.className = 'thinking-block collapsed';
                                thEl.innerHTML = '<div class="thinking-toggle" onclick="this.parentElement.classList.toggle(\'collapsed\')">' +
                                    '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
                                    ' Raciocínio <span class="th-count" style="color:var(--text-tertiary);margin-left:2px;"></span>' +
                                    '<svg class="th-chevron" style="margin-left:auto;" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>' +
                                    '<div class="thinking-content"></div>';
                                contentEl.parentNode.insertBefore(thEl, contentEl);
                            }
                        } else if (blk.type === 'server_tool_use' && blk.name === 'web_search') {
                            if (contentEl && !document.getElementById(searchIndicatorId)) {
                                var srchEl = document.createElement('div');
                                srchEl.id = searchIndicatorId;
                                srchEl.className = 'search-indicator';
                                srchEl.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> pesquisando na web…';
                                contentEl.parentNode.insertBefore(srchEl, contentEl);
                                scrollToBottom();
                            }
                        } else if (blk.type === 'web_search_tool_result') {
                            var ind = document.getElementById(searchIndicatorId);
                            if (ind) ind.remove();
                        }
                    } else if (parsed.type === 'content_block_delta') {
                        if (currentBlockType === 'thinking' && parsed.delta && parsed.delta.thinking) {
                            thinkingText += parsed.delta.thinking;
                            var thContent = document.querySelector('#' + thinkingBlockId + ' .thinking-content');
                            if (thContent) thContent.textContent = thinkingText;
                            var thCount = document.querySelector('#' + thinkingBlockId + ' .th-count');
                            if (thCount) thCount.textContent = '~' + Math.round(thinkingText.split(' ').length) + ' palavras';
                        } else if (parsed.delta && parsed.delta.text) {
                            delta = parsed.delta.text;
                        }
                    } else if (parsed.type === 'content_block_stop') {
                        currentBlockType = null;
                    }
                    if (delta) {
                        fullText += delta;
                        if (contentEl) contentEl.innerHTML = fmtContent(fullText);
                        scrollToBottom();
                    }
                } catch(e) {}
            });
        }

        var aMsg = { role: 'assistant', content: fullText };
        S.conversations[sk.id].push(aMsg);
        save();

        // Add download button to the just-finished bubble — only for real work outputs
        var newIdx = S.conversations[sk.id].length - 1;
        var streamBubble = document.getElementById(aId);
        if (streamBubble && isWorkOutput(fullText)) {
            streamBubble.setAttribute('data-midx', newIdx);
            var bodyEl = streamBubble.querySelector('.msg-body');
            if (bodyEl && !bodyEl.querySelector('.msg-actions')) {
                var actDiv = document.createElement('div');
                actDiv.className = 'msg-actions';
                actDiv.innerHTML = '<button class="msg-action-btn" onclick="downloadMd(' + newIdx + ')" title="Baixar como .md">' +
                    '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> .md</button>';
                bodyEl.appendChild(actDiv);
            }
        }

        // Refresh header (to show "Limpar" if first exchange)
        if (S.conversations[sk.id].length === 2) renderSkillView(S.selectedId);

    } catch(err) {
        var typEl2 = document.getElementById(typingId);
        if (typEl2) typEl2.remove();
        S.conversations[sk.id].pop(); // rollback user msg
        toast('Erro: ' + (err.message || 'Falha na requisição'));
    } finally {
        S.isStreaming = false;
        setInputState(false);
        var inpEl = document.getElementById('chatInput');
        if (inpEl) inpEl.focus();
    }
}

function setInputState(disabled) {
    var inp = document.getElementById('chatInput');
    var send = document.getElementById('sendBtn');
    var attach = document.getElementById('attachBtn');
    if (inp)    inp.disabled    = disabled;
    if (send)   send.disabled   = disabled;
    if (attach) attach.disabled = disabled;
}

    h += '<span>Raciocínio estendido <span style="font-size:0.7rem;font-weight:400;color:var(--text-3);">(apenas Claude — mais lento, muito mais profundo)</span></span></label>';
    h += '<p style="font-size:0.7rem;color:var(--text-3);margin-top:4px;padding-left:25px;">Claude pensa antes de responder usando um bloco de raciocínio interno — produz análises substancialmente mais profundas e bem estruturadas.</p></div>';
    h += '<button class="btn btn-primary" onclick="saveApiSettings()">Salvar</button>';
    h += '</div>';

    // Workspace
    h += '<div class="set-sec"><span class="set-sec-lbl">Workspace</span>';
    h += '<div class="f-group"><label class="f-label">Nome</label>';
    h += '<input type="text" class="f-input" id="wsNameIn" value="' + esc(S.wsName) + '" placeholder="Ex: tropicOS Skills"></div>';
    h += '<button class="btn btn-primary" onclick="saveWsName()">Salvar</button></div>';

    // Skills
    h += '<div class="set-sec"><span class="set-sec-lbl">Skills</span>';
    Object.keys(CATS).forEach(function(catId) {
        var cat = CATS[catId]; var skills = byCat(catId);
        h += '<div style="margin-bottom:22px;"><div style="font-size:0.8125rem;font-weight:600;margin-bottom:10px;color:var(--text-2);">' + cat.num + '. ' + cat.label + ' <span style="font-weight:400;color:var(--text-3);">(' + skills.length + ')</span></div>';
        if (skills.length === 0) {
            h += '<div style="font-size:0.8125rem;color:var(--text-3);padding:8px 0;">Nenhum skill.</div>';
        } else {
            skills.forEach(function(sk) {
                h += '<div class="set-skill-row"><span class="set-skill-name">' + esc(sk.name) + '</span>';
                h += '<button class="btn btn-ghost-danger" style="padding:6px 12px;font-size:0.75rem;" onclick="openDelete(\'' + sk.id + '\')">';
                h += '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Deletar</button></div>';
            });
        }
        h += '</div>';
    });
    h += '</div>';

    // Data
    h += '<div class="set-sec"><span class="set-sec-lbl">Dados</span>';
    h += '<p style="font-size:0.8125rem;color:var(--text-2);margin-bottom:16px;">Skills e conversas salvos no localStorage.</p>';
    h += '<div style="display:flex;gap:10px;">';
    h += '<button class="btn" onclick="exportData()">Exportar JSON</button>';
    h += '<button class="btn btn-ghost-danger" onclick="resetDefaults()">Restaurar Padrões</button>';
    h += '</div></div>';

    el.innerHTML = h;
}

function onProviderChange() {
    var sel = document.getElementById('apiProviderSelect');
    if (!sel) return;
    var parts = sel.value.split('|');
    var prov = parts[0];
    document.getElementById('keyFieldClaude').style.display  = prov === 'claude'  ? 'block' : 'none';
    document.getElementById('keyFieldOpenAI').style.display  = prov === 'openai'  ? 'block' : 'none';
    document.getElementById('keyFieldGemini').style.display  = prov === 'gemini'  ? 'block' : 'none';
}

function saveApiSettings() {
    var sel = document.getElementById('apiProviderSelect');
    if (sel) {
        var parts = sel.value.split('|');
        S.apiProvider = parts[0];
        S.apiModel    = parts[1];
    }
    var k  = document.getElementById('apiKeyInput');
    var ko = document.getElementById('apiKeyOpenAIInput');
    var kg = document.getElementById('apiKeyGeminiInput');
    var ws = document.getElementById('webSearchToggle');
    if (k)  S.apiKey       = k.value.trim();
    if (ko) S.apiKeyOpenAI = ko.value.trim();
    if (kg) S.apiKeyGemini = kg.value.trim();
    if (ws) S.webSearch    = ws.checked;
    var th = document.getElementById('thinkingToggle');
    if (th) S.thinkingEnabled = th.checked;
    save(); toast('Configurações de API salvas');
}

function saveWsName() {
    var v = document.getElementById('wsNameIn');
    if (v) { S.wsName = v.value.trim() || 'tropicOS Skills'; save(); toast('Nome salvo'); }
}

function exportData() {
    var data = JSON.stringify({ skills: S.skills, wsName: S.wsName }, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url  = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'tropicos-skills.json'; a.click();
    URL.revokeObjectURL(url);
}

function resetDefaults() {
    if (confirm('Restaurar todos os skills e limpar conversas?')) {
        S.skills = DEFAULTS.slice(); S.activeId = null; S.selectedId = null; S.conversations = {};
        save(); showView('home'); toast('Skills restaurados');
    }
}

// ═══════════════════════════════════════════════
// SKILL ACTIONS
// ═══════════════════════════════════════════════
function doSelectSkill(id) {
    S.selectedId = id;
    save();
    showView('skill');
}

function copyPrompt(id) {
    var sk = findSkill(id);
    if (!sk) return;
    navigator.clipboard.writeText(sk.systemPrompt).then(function(){ toast('System prompt copiado!'); }).catch(function(){ toast('Erro ao copiar'); });
}

// ═══════════════════════════════════════════════
// EDIT MODAL
// ═══════════════════════════════════════════════
function openEdit(id) {
    var sk = findSkill(id);
    if (!sk) return;
    S.toEditId = id;
    document.getElementById('editName').value    = sk.name;
    document.getElementById('editDesc').value    = sk.description || '';
    document.getElementById('editTrigger').value = sk.trigger || '';
    document.getElementById('editPromptPrev').value = sk.systemPrompt || '';
    document.getElementById('modalEdit').classList.remove('off');
    setTimeout(function(){ document.getElementById('editName').focus(); }, 50);
}

function closeEdit() { document.getElementById('modalEdit').classList.add('off'); S.toEditId = null; }

function regenEditPrompt() {
    var sk = findSkill(S.toEditId); if (!sk) return;
    var name = document.getElementById('editName').value.trim();
    if (!name) { toast('Insira um nome para regenerar'); return; }
    var desc    = document.getElementById('editDesc').value.trim();
    var trigger = document.getElementById('editTrigger').value.trim();
    var newPrompt = genPrompt(name, sk.category, desc, trigger);
    document.getElementById('editPromptPrev').value = newPrompt;
    toast('Prompt regenerado');
}

function doEdit() {
    var id = S.toEditId; if (!id) return;
    var sk = findSkill(id); if (!sk) return;
    var name = document.getElementById('editName').value.trim();
    if (!name) { document.getElementById('editName').focus(); toast('Insira um nome'); return; }
    sk.name        = name;
    sk.description = document.getElementById('editDesc').value.trim();
    sk.trigger     = document.getElementById('editTrigger').value.trim();
    sk.systemPrompt = document.getElementById('editPromptPrev').value;
    save(); closeEdit();
    if (S.selectedId === id) renderSkillView(id);
    renderSidebar();
    toast('Skill atualizado');
}

// ═══════════════════════════════════════════════
// CREATE MODAL
// ═══════════════════════════════════════════════
// ── Import prompt from file ──
function importPromptFile(event, targetId) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        var el = document.getElementById(targetId);
        if (el) { if (el.tagName === 'TEXTAREA') { el.value = e.target.result; } else { el.textContent = e.target.result; } }
        toast('Prompt importado: ' + file.name);
    };
    reader.readAsText(file);
    event.target.value = '';
}

function openCreate(defaultCat) {
    S.newCat = defaultCat || 'strategy';
    document.getElementById('inName').value    = '';
    document.getElementById('inDesc').value    = '';
    document.getElementById('inTrigger').value = '';
    syncCatSel(); updatePrev();
    document.getElementById('modalCreate').classList.remove('off');
    setTimeout(function(){ document.getElementById('inName').focus(); }, 50);
}
function closeCreate() { document.getElementById('modalCreate').classList.add('off'); }
function syncCatSel() {
    document.querySelectorAll('#catSel .cat-opt').forEach(function(el){
        el.classList.toggle('on', el.dataset.cat === S.newCat);
    });
}
function updatePrev() {
    var name = document.getElementById('inName').value.trim();
    var desc = document.getElementById('inDesc').value.trim();
    var trigger = document.getElementById('inTrigger').value.trim();
    var prev = document.getElementById('promptPrev');
    if (name) prev.textContent = genPrompt(name, S.newCat, desc, trigger);
    else prev.textContent = 'Preencha os campos acima para visualizar o system prompt.';
}
function doCreate() {
    var name    = document.getElementById('inName').value.trim();
    var desc    = document.getElementById('inDesc').value.trim();
    var trigger = document.getElementById('inTrigger').value.trim();
    if (!name) { document.getElementById('inName').focus(); toast('Insira um nome para o skill'); return; }
    var sk = { id: uid(), name: name, category: S.newCat, description: desc || 'Skill de ' + name.toLowerCase(), trigger: trigger, systemPrompt: genPrompt(name, S.newCat, desc, trigger), isDefault: false, createdAt: new Date().toISOString() };
    S.skills.push(sk); save(); closeCreate();
    S.selectedId = sk.id; showView('skill');
    toast('Skill criado');
}

// ═══════════════════════════════════════════════
// DELETE MODAL
// ═══════════════════════════════════════════════
function openDelete(id) {
    var sk = findSkill(id); if (!sk) return;
    S.toDeleteId = id;
    document.getElementById('delSkillName').textContent = sk.name;
    document.getElementById('modalDelete').classList.remove('off');
}
function closeDelete() { document.getElementById('modalDelete').classList.add('off'); S.toDeleteId = null; }
function confirmDelete() {
    var id = S.toDeleteId; if (!id) return;
    S.skills = S.skills.filter(function(s){ return s.id !== id; });
    if (S.activeId   === id) S.activeId   = null;
    if (S.selectedId === id) S.selectedId = null;
    delete S.conversations[id];
    save(); closeDelete(); closeEdit();
    if (S.view === 'skill') showView('home'); else showView(S.view);
    toast('Skill deletado');
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
var _tt = null;
function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('on');
    if (_tt) clearTimeout(_tt);
    _tt = setTimeout(function(){ el.classList.remove('on'); }, 2800);
}

// ═══════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════
document.getElementById('logoHome').addEventListener('click', function(){ showView('home'); });
var btnNew = document.getElementById('btnNew'); if (btnNew) btnNew.addEventListener('click', function(){ openCreate(); });
document.getElementById('btnSettings').addEventListener('click', function(){
    if (S.view === 'settings') showView('home'); else showView('settings');
});
var btnSettingsSidebar = document.getElementById('btnSettingsSidebar');
if (btnSettingsSidebar) btnSettingsSidebar.addEventListener('click', function(){
    if (S.view === 'settings') showView('home'); else showView('settings');
});
var darkToggle = document.getElementById('darkToggle');
if (darkToggle) darkToggle.addEventListener('click', function(){
    document.documentElement.classList.toggle('dark');
    darkToggle.classList.toggle('on');
});


// Edit modal
document.getElementById('btnCloseEdit').addEventListener('click', closeEdit);
document.getElementById('btnCancelEdit').addEventListener('click', closeEdit);
document.getElementById('btnSaveEdit').addEventListener('click', doEdit);
document.getElementById('btnRegenPrompt').addEventListener('click', regenEditPrompt);
document.getElementById('btnCopyEditPrompt').addEventListener('click', function(){
    var txt = document.getElementById('editPromptPrev').value;
    navigator.clipboard.writeText(txt).then(function(){ toast('Prompt copiado!'); });
});
document.getElementById('btnDeleteFromEdit').addEventListener('click', function(){
    if (S.toEditId) { closeEdit(); openDelete(S.toEditId); }
});
document.getElementById('modalEdit').addEventListener('click', function(e){ if (e.target === this) closeEdit(); });

// Delete modal
document.getElementById('btnCloseDelete').addEventListener('click', closeDelete);
document.getElementById('btnCancelDelete').addEventListener('click', closeDelete);
document.getElementById('btnConfirmDelete').addEventListener('click', confirmDelete);
document.getElementById('modalDelete').addEventListener('click', function(e){ if (e.target === this) closeDelete(); });

// Chat
document.getElementById('attachBtn').addEventListener('click', function(){ document.getElementById('fileInput').click(); });
document.getElementById('fileInput').addEventListener('change', handleFileSelect);
document.getElementById('chatInput').addEventListener('keydown', handleChatKey);
document.getElementById('chatInput').addEventListener('input', function(){ autoResize(this); });
document.getElementById('sendBtn').addEventListener('click', sendMessage);

// ESC
document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') { closeCreate(); closeDelete(); closeEdit(); }
});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
load();
showView('home');

// Deep-link: ?skill=project-mapping opens that skill directly
(function() {
    var skillId = new URLSearchParams(window.location.search).get('skill');
    if (skillId && findSkill(skillId)) { doSelectSkill(skillId); }
})();
</script>
