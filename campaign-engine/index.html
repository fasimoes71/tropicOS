<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Engine — tropicOS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --glass:        rgba(255,255,255,0.90);
  --glass-border: rgba(0,0,0,0.13);
  --text:         #1a1a1a;
  --muted:        #6a6a6a;
  --accent:       #32EE66;
  --warn:         #f59e0b;
  --err:          #ef4444;
  --font:         'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

html, body { height: 100%; overflow: hidden; }

body {
  background: #f7f7f9;
  font-family: var(--font);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ─── Logo ──────────────────────────────────────────── */
#logo { position: absolute; top: 16px; left: 20px; pointer-events: none; z-index: 10; }
#logo-text { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1; }
#logo-sub  { font-size: 10px; color: var(--muted); line-height: 1; margin-top: 1px; }

/* ─── Run indicator ─────────────────────────────────── */
#run-indicator {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
  background: var(--glass);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--glass-border);
  border-radius: 100px; padding: 6px 14px; z-index: 10;
  font-size: 10px; font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--text);
}
#run-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
#run-indicator.running .dot { background: var(--accent); animation: pulse 1s infinite; }
#run-indicator.done .dot { background: var(--accent); }
#run-indicator.error .dot { background: var(--err); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ─── Bottom buttons ────────────────────────────────── */
#bottom-btns {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px;
  background: var(--glass);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--glass-border);
  border-radius: 100px; padding: 4px; z-index: 10;
}
.bb {
  font-family: var(--font); font-size: 9.5px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); padding: 6px 16px;
  border-radius: 100px; border: none; background: transparent;
  cursor: pointer; transition: all 0.18s; line-height: 1;
}
.bb.primary       { background: var(--text); color: #fff; }
.bb.primary-morph { background: var(--accent); color: #1a1a1a; }
.bb.danger        { background: var(--err); color: #fff; }
.bb:hover:not(.primary):not(.primary-morph):not(.danger) { color: var(--text); background: rgba(0,0,0,0.05); }
.bb.primary:hover, .bb.primary-morph:hover, .bb.danger:hover { opacity: .85; }
.bb:disabled { opacity: .35; cursor: not-allowed; }

/* ─── Floating boxes ────────────────────────────────── */
.fbox {
  position: absolute; top: 70px; bottom: 90px;
  display: flex; flex-direction: column; align-items: stretch;
  width: 220px;
  background: var(--glass);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--glass-border);
  border-radius: 20px; padding: 18px 14px; z-index: 10;
  box-shadow: 0 16px 56px rgba(0,0,0,0.13), 0 1px 0 rgba(255,255,255,0.70) inset;
  overflow-y: auto;
}
.fbox::-webkit-scrollbar { width: 0; }
#bar-left  { left: 20px; }
#bar-right { right: 20px; }

.bs { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; }
.bs:first-child { padding-top: 0; }
.bs:last-child  { padding-bottom: 0; }

.bl { font-size: 9.5px; font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text); line-height: 1; }
.bd { width: 100%; height: 1px; background: rgba(0,0,0,0.14); flex-shrink: 0; }

/* ─── Inputs ────────────────────────────────────────── */
.txt-in {
  width: 100%; height: 30px; padding: 0 10px;
  border-radius: 8px; border: 1px solid rgba(0,0,0,0.10);
  background: rgba(255,255,255,0.5); font-family: var(--font);
  font-size: 11px; font-weight: 500; color: var(--text);
  outline: none; transition: all 0.18s; line-height: 1;
}
.txt-in:focus { border-color: var(--text); background: #fff; }
.txt-in::placeholder { color: var(--muted); }
textarea.txt-in {
  height: auto; min-height: 56px; padding: 8px 10px;
  resize: none; line-height: 1.4;
}
.api-key-row { position: relative; display: flex; gap: 4px; align-items: center; }
.api-key-row .txt-in { padding-right: 32px; font-family: 'SF Mono', monospace; font-size: 10px; }
.api-eye {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  background: transparent; border: none; cursor: pointer;
  color: var(--muted); font-size: 11px; padding: 4px;
}
.api-eye:hover { color: var(--text); }
.api-status {
  font-size: 9px; color: var(--muted);
  display: flex; align-items: center; gap: 5px;
}
.api-status.ok { color: #15a34a; }
.api-status.no { color: var(--warn); }
.api-status::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; display: inline-block;
}

/* ─── Action buttons ────────────────────────────────── */
.ex-btn {
  width: 100%; height: 30px; padding: 0 10px;
  background: var(--text); color: #fff; border: none;
  border-radius: 8px; font-family: var(--font);
  font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
  cursor: pointer; transition: opacity 0.18s; text-align: left; line-height: 1;
}
.ex-btn:hover { opacity: .75; }
.ex-btn:disabled { opacity: .35; cursor: not-allowed; }
.ex-ghost {
  width: 100%; height: 30px; padding: 0 10px;
  background: transparent; color: var(--muted);
  border: 1px solid rgba(0,0,0,0.12); border-radius: 8px;
  font-family: var(--font); font-size: 10px; font-weight: 500;
  letter-spacing: 0.04em; cursor: pointer;
  transition: all 0.18s; text-align: left; line-height: 1;
}
.ex-ghost:hover { border-color: var(--text); color: var(--text); }
.ex-ghost:disabled { opacity: .35; cursor: not-allowed; }

/* ─── Ref preview (bar-left) ────────────────────────── */
#ref-thumb-wrap { position: relative; width: 100%; }
#ref-thumb {
  width: 100%; aspect-ratio: 4/3; object-fit: cover;
  border-radius: 8px; display: block;
  border: 1px solid var(--glass-border);
}
#ref-drop-mini {
  width: 100%; aspect-ratio: 4/3;
  border: 1.5px dashed rgba(0,0,0,0.18);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9.5px; color: var(--muted); text-align: center; line-height: 1.4;
  cursor: pointer; transition: all 0.18s; padding: 6px;
}
#ref-drop-mini:hover, #ref-drop-mini.dragging { border-color: var(--accent); background: rgba(50,238,102,0.06); color: var(--text); }

/* ─── Center stage / TIMELINE ───────────────────────── */
#center {
  position: absolute; top: 70px; bottom: 90px;
  left: 260px; right: 260px;
  overflow-y: auto; overflow-x: hidden;
  padding: 0 8px;
}
#center::-webkit-scrollbar { width: 8px; }
#center::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }
#center::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.22); }

#timeline {
  display: flex; flex-direction: column; gap: 14px;
  padding: 4px 12px 20px;
  max-width: 720px;
  margin: 0 auto;
}

/* ─── Card ──────────────────────────────────────────── */
.tc {
  background: var(--glass);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 14px 16px 12px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.05);
  transition: border-color 0.2s;
}
.tc.running { border-color: var(--accent); box-shadow: 0 8px 32px rgba(50,238,102,0.18); }
.tc.error   { border-color: var(--err);    box-shadow: 0 8px 32px rgba(239,68,68,0.12); }

.tc-head {
  display: flex; align-items: center; gap: 10px;
}
.tc-num {
  font-family: 'Syncopate', sans-serif;
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--muted);
  background: rgba(0,0,0,0.04);
  padding: 5px 9px; border-radius: 6px;
  flex-shrink: 0;
}
.tc-title {
  font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
  color: var(--text);
  flex: 1; min-width: 0;
}
.tc-status {
  font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 100px;
  background: rgba(0,0,0,0.05); color: var(--muted);
  flex-shrink: 0;
}
.tc-status.running { background: var(--accent); color: #1a1a1a; }
.tc-status.done    { background: var(--text);   color: #fff; }
.tc-status.error   { background: var(--err);    color: #fff; }

.tc-body {
  position: relative;
  width: 100%; aspect-ratio: 4/3;
  background: rgba(0,0,0,0.025);
  border-radius: 10px;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.tc-ref .tc-body { aspect-ratio: 4/3; }
.tc-body img {
  width: 100%; height: 100%; object-fit: contain;
  display: block; background: #fff;
}
.tc-placeholder {
  display: flex; flex-direction: column; gap: 4px;
  color: var(--muted); text-align: center;
  pointer-events: none;
}
.tc-placeholder .lg { font-size: 11.5px; font-weight: 500; color: var(--text); }
.tc-placeholder .sm { font-size: 10px; }

.tc-spinner {
  width: 28px; height: 28px;
  border: 2.5px solid rgba(0,0,0,0.08);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.tc-foot {
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap;
}
.tc-btn {
  font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 5px 10px; border-radius: 100px;
  background: transparent; border: 1px solid rgba(0,0,0,0.12);
  color: var(--text); cursor: pointer; font-family: var(--font);
  transition: all 0.18s;
}
.tc-btn:hover { background: var(--text); color: #fff; border-color: var(--text); }
.tc-btn:disabled { opacity: .35; cursor: not-allowed; background: transparent; color: var(--muted); border-color: rgba(0,0,0,0.12); }
.tc-btn.accent { background: var(--accent); border-color: var(--accent); color: #1a1a1a; }
.tc-btn.accent:hover { opacity: .85; background: var(--accent); color: #1a1a1a; }
.tc-err {
  font-size: 10px; color: var(--err); line-height: 1.4;
  background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.15);
  border-radius: 6px; padding: 6px 10px;
  font-family: 'SF Mono', monospace;
  word-break: break-word;
}
.tc-prompt {
  display: none;
  font-family: 'SF Mono', monospace;
  font-size: 10px; line-height: 1.5;
  color: var(--muted);
  white-space: pre-wrap; word-break: break-word;
  background: rgba(0,0,0,0.03); border-radius: 6px;
  padding: 8px 10px;
  max-height: 220px; overflow-y: auto;
}
.tc.show-prompt .tc-prompt { display: block; }

.tk { color: #1a8b35; font-weight: 600; background: rgba(50,238,102,0.12); padding: 0 3px; border-radius: 2px; }

#toast {
  position: absolute; bottom: 78px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff;
  padding: 8px 18px; border-radius: 100px;
  font-size: 10px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
  z-index: 20;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(-4px); }
#toast.err { background: var(--err); }

@media (max-width: 1100px) {
  .fbox { width: 190px; }
  #center { left: 230px; right: 230px; }
}
@media (max-width: 900px) {
  html, body { overflow: auto; }
  .fbox { position: static; transform: none; width: 100%; max-width: 480px; margin: 16px auto; height: auto; top: auto; bottom: auto; }
  #center { position: static; left: auto; right: auto; top: auto; bottom: auto; max-width: 720px; margin: 0 auto; padding: 16px; }
  #bottom-btns { position: static; transform: none; margin: 16px auto; }
}
</style>
</head>
<body>

<div id="logo">
  <div id="logo-text">CampaignEngine</div>
  <div id="logo-sub">by tropicOS</div>
</div>

<div id="run-indicator">
  <span class="dot"></span>
  <span id="ind-text">idle</span>
</div>

<!-- LEFT: Inputs -->
<div class="fbox" id="bar-left">

  <div class="bs">
    <div class="bl">Reference</div>
    <input type="file" id="img-input" accept="image/*" style="display:none">
    <div id="ref-thumb-wrap" style="display:none">
      <img id="ref-thumb" alt="reference">
    </div>
    <div id="ref-drop-mini">drop, click<br>or paste (⌘V)</div>
    <button class="ex-ghost" id="btn-clear-img" style="display:none;margin-top:4px">↺ Clear</button>
  </div>

  <div class="bd"></div>

  <div class="bs">
    <div class="bl">Brand A</div>
    <input type="text" class="txt-in" id="in-brand-a" placeholder="Gucci" autocomplete="off">
  </div>

  <div class="bs">
    <div class="bl">Brand B <span style="color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400">— colab</span></div>
    <input type="text" class="txt-in" id="in-brand-b" placeholder="Crocs (optional)" autocomplete="off">
  </div>

  <div class="bs">
    <div class="bl">Vibe</div>
    <textarea class="txt-in" id="in-vibe" rows="2" placeholder="luxury × streetwear tension"></textarea>
  </div>

</div>

<!-- CENTER: Timeline -->
<div id="center">
  <div id="timeline"></div>
</div>

<!-- RIGHT: API + Run + Export -->
<div class="fbox" id="bar-right">

  <div class="bs">
    <div class="bl">Gemini API key</div>
    <div class="api-key-row">
      <input type="password" class="txt-in" id="in-api-key" placeholder="AIza..." autocomplete="off">
      <button class="api-eye" id="btn-api-eye" title="show/hide">◉</button>
    </div>
    <div class="api-status no" id="api-status">no key</div>
    <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="font-size:9px;color:var(--muted);text-decoration:underline;line-height:1.3">get key at aistudio.google.com</a>
  </div>

  <div class="bd"></div>

  <div class="bs">
    <div class="bl">Model</div>
    <select class="txt-in" id="in-model" style="cursor:pointer">
      <option value="gemini-2.5-flash-image">Nano Banana (flash)</option>
      <option value="gemini-3-pro-image">Nano Banana Pro</option>
    </select>
  </div>

  <div class="bd"></div>

  <div class="bs">
    <div class="bl">Run</div>
    <button class="ex-btn" id="btn-run-all" style="background:var(--accent);color:#1a1a1a">▶ Run all 5 steps</button>
    <button class="ex-ghost" id="btn-run-next">▶ Run next step</button>
    <button class="ex-ghost" id="btn-stop" disabled style="border-color:rgba(239,68,68,.4);color:#ef4444">■ Stop</button>
    <button class="ex-ghost" id="btn-reset">↺ Reset outputs</button>
  </div>

  <div class="bd"></div>

  <div class="bs">
    <div class="bl">Export</div>
    <button class="ex-btn" id="btn-copy-all">⎘ Copy all prompts</button>
    <button class="ex-ghost" id="btn-export-md">↓ Export brief.md</button>
    <button class="ex-ghost" id="btn-export-imgs">↓ Download images</button>
  </div>

</div>

<div id="toast">copied</div>

<script>
// ─── Step definitions ─────────────────────────────────────────
const STEPS = [
  {
    key: 'reference', title: 'Reference deconstruction',
    placeholder: 'brand board extracted from your reference',
    inputs: (s) => [s.refImage].filter(Boolean),
    build: () => `You are a world-class Creative Director and Brand Designer working at a top-tier agency.

Using the provided reference image as the source of truth, create a clean 4:3 visual brand board.

Do NOT copy the reference directly. Extract and rebuild its underlying creative system:

* core idea and creative tension
* color and material language
* typography direction
* image and composition logic
* signature visual device
* layout/grid system
* scalable campaign applications

The output must be a polished visual brand board, not a text-heavy document.

Design direction:

* premium editorial layout
* clear modular grid
* strong hero visual area
* limited, readable labels only
* large visual tiles
* minimal micro-copy
* no overcrowding
* no overlapping text on active backgrounds
* clean margins and consistent spacing

The board should feel like a professional agency campaign direction slide: visual, structured, immediately understandable, and ready to use as the foundation for a full brand campaign.`
  },
  {
    key: 'concept', title: 'Concept transfer',
    placeholder: 'system applied to your brand',
    inputs: (s) => [s.refImage, s.outputs[0]].filter(Boolean),
    build: (s) => {
      const brand = brandToken(s);
      const vibeLine = s.vibe.trim() ? `\n\nDesign tension to embody: ${s.vibe.trim()}` : '';
      return `recreate the whole campaign document for ${brand}
imaginary collab campaign,
using the source image I provided as a material & vibe reference,
but rebuild it completely according to new brands' visual aesthetic
and brand guidelines,
be especially careful with brands' fonts consistency and accuracy${vibeLine}`;
    }
  },
  {
    key: 'assets', title: 'Asset moodboard',
    placeholder: 'bento of banners, posts, mockups',
    inputs: (s) => [s.refImage, s.outputs[1]].filter(Boolean),
    build: () => `Now create me a moodboard of actual visual assets for this campaign:
* digital banners,
* social media banners & posts,
* ad materials,
* aesthetical assets
etc

avoid overlapping text layers over active backgrounds

make 30% less images, but make them tighter
and looking more like a bento grid`
  },
  {
    key: 'brief', title: 'Brief slide',
    placeholder: 'idea + goals slide',
    inputs: (s) => [s.refImage, s.outputs[1]].filter(Boolean),
    build: () => `now create me a slide with this campaign's
* brief,
* idea
* and goals`
  },
  {
    key: 'keyvisual', title: 'Key visual',
    placeholder: 'cover art — Forbes / Esquire level',
    inputs: (s) => [s.refImage, s.outputs[1]].filter(Boolean),
    build: () => `now create a clean image slide with
a photo scene of campaign-relevant characters
positioned in a campaign-relevant surrounding
with campaign slogan positioned on top of the photograph
in a fashion-magazine typography design style and level

act as a world class art director
presenting the campaign with a single visual slide:
the key visual that deserves to be on the first page of
Forbes or Esquire magazines

I don't need an overwhelmed tech slide,
I need a cover art for the whole campaign`
  }
];

function brandToken(s) {
  const a = s.brandA.trim(), b = s.brandB.trim();
  if (a && b) return `[${a} × ${b}]`;
  if (a)      return `[${a}]`;
  return '[INSERT ANY BRAND HERE]';
}

// ─── State ────────────────────────────────────────────────────
const LS_KEY = 'campaign-engine-gemini-key';
const LS_MODEL = 'campaign-engine-model';
const state = {
  brandA: '', brandB: '', vibe: '',
  refImage: null,   // { dataUrl, mimeType, base64 }
  refName: null,
  outputs: [null, null, null, null, null],   // each: { dataUrl, mimeType, base64 }
  status:  ['idle','idle','idle','idle','idle'],
  errors:  [null,null,null,null,null],
  showPrompt: [false,false,false,false,false],
  running: false,
  abort: null,
  apiKey: '',
  model: 'gemini-2.5-flash-image',
};

// ─── DOM ──────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const inA = $('in-brand-a'), inB = $('in-brand-b'), inV = $('in-vibe');
const inKey = $('in-api-key'), btnEye = $('btn-api-eye'), apiStatus = $('api-status');
const inModel = $('in-model');
const imgInput = $('img-input');
const refThumbWrap = $('ref-thumb-wrap'), refThumb = $('ref-thumb');
const refDropMini = $('ref-drop-mini'), btnClearImg = $('btn-clear-img');
const timeline = $('timeline');
const btnRunAll = $('btn-run-all'), btnRunNext = $('btn-run-next'), btnStop = $('btn-stop'), btnReset = $('btn-reset');
const btnCopyAll = $('btn-copy-all'), btnExportMd = $('btn-export-md'), btnExportImgs = $('btn-export-imgs');
const indicator = $('run-indicator'), indText = $('ind-text');
const toast = $('toast');

// ─── Helpers ──────────────────────────────────────────────────
function parseDataUrl(dataUrl) {
  const m = dataUrl.match(/^data:([^;]+);base64,(.+)$/);
  if (!m) return null;
  return { dataUrl, mimeType: m[1], base64: m[2] };
}
function showToast(msg, isErr) {
  toast.textContent = msg;
  toast.classList.toggle('err', !!isErr);
  toast.classList.add('on');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('on'), 1800);
}
function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('copied'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
      showToast('copied');
    });
}

// ─── Render ───────────────────────────────────────────────────
function statusLabel(st, i) {
  if (st === 'running') return 'generating';
  if (st === 'done')    return 'done';
  if (st === 'error')   return 'error';
  return 'idle';
}

function renderTimeline() {
  timeline.innerHTML = '';

  // REF card
  const refCard = document.createElement('div');
  refCard.className = 'tc tc-ref';
  refCard.innerHTML = `
    <div class="tc-head">
      <div class="tc-num">REF</div>
      <div class="tc-title">Reference image</div>
      <div class="tc-status">${state.refImage ? 'loaded' : 'empty'}</div>
    </div>
    <div class="tc-body" id="ref-body">
      ${state.refImage
        ? `<img src="${state.refImage.dataUrl}" alt="reference">`
        : `<div class="tc-placeholder"><div class="lg">drop reference image</div><div class="sm">or click, or paste with ⌘V</div></div>`}
    </div>
  `;
  if (!state.refImage) {
    refCard.querySelector('.tc-body').style.cursor = 'pointer';
    refCard.querySelector('.tc-body').addEventListener('click', () => imgInput.click());
  }
  timeline.appendChild(refCard);

  // Step cards
  STEPS.forEach((step, i) => {
    const out = state.outputs[i];
    const st = state.status[i];
    const err = state.errors[i];
    const card = document.createElement('div');
    card.className = `tc ${st === 'running' ? 'running' : ''} ${st === 'error' ? 'error' : ''} ${state.showPrompt[i] ? 'show-prompt' : ''}`;
    const tokenPrompt = escapeHtml(step.build(state));

    card.innerHTML = `
      <div class="tc-head">
        <div class="tc-num">${String(i+1).padStart(2,'0')}</div>
        <div class="tc-title">${step.title}</div>
        <div class="tc-status ${st}">${statusLabel(st, i)}</div>
      </div>
      <div class="tc-body">
        ${out
          ? `<img src="${out.dataUrl}" alt="${step.title}">`
          : st === 'running'
            ? `<div class="tc-spinner"></div>`
            : `<div class="tc-placeholder"><div class="lg">${step.placeholder}</div><div class="sm">press generate to run</div></div>`}
      </div>
      ${err ? `<div class="tc-err">${escapeHtml(err)}</div>` : ''}
      <div class="tc-foot">
        <button class="tc-btn accent" data-act="gen" data-i="${i}">${out ? '↺ regenerate' : '▶ generate'}</button>
        <button class="tc-btn" data-act="prompt" data-i="${i}">${state.showPrompt[i] ? 'hide prompt' : 'view prompt'}</button>
        ${out ? `<button class="tc-btn" data-act="download" data-i="${i}">↓ download</button>` : ''}
      </div>
      <div class="tc-prompt">${tokenPrompt}</div>
    `;
    timeline.appendChild(card);
  });

  // Wire up card buttons
  timeline.querySelectorAll('button[data-act]').forEach(btn => {
    const act = btn.dataset.act, i = parseInt(btn.dataset.i, 10);
    btn.addEventListener('click', () => {
      if (act === 'gen')      generateStep(i);
      if (act === 'prompt')   { state.showPrompt[i] = !state.showPrompt[i]; renderTimeline(); }
      if (act === 'download') downloadImage(i);
    });
  });
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderIndicator() {
  const doneCount = state.status.filter(s => s === 'done').length;
  indicator.classList.remove('running','done','error');
  if (state.running) {
    indicator.classList.add('running');
    const cur = state.status.findIndex(s => s === 'running');
    indText.textContent = `running step ${String(cur+1).padStart(2,'0')} / 05`;
  } else if (state.status.some(s => s === 'error')) {
    indicator.classList.add('error');
    indText.textContent = `error · ${doneCount}/5 done`;
  } else if (doneCount === 5) {
    indicator.classList.add('done');
    indText.textContent = 'all 5 done';
  } else if (doneCount > 0) {
    indText.textContent = `${doneCount}/5 done`;
  } else {
    indText.textContent = 'idle';
  }
}

function renderRunButtons() {
  const hasKey = !!state.apiKey;
  const hasRef = !!state.refImage;
  btnRunAll.disabled  = state.running || !hasKey || !hasRef;
  btnRunNext.disabled = state.running || !hasKey || !hasRef;
  btnStop.disabled    = !state.running;
  btnReset.disabled   = state.running;
}

function renderRef() {
  if (state.refImage) {
    refThumb.src = state.refImage.dataUrl;
    refThumbWrap.style.display = 'block';
    refDropMini.style.display = 'none';
    btnClearImg.style.display = 'block';
  } else {
    refThumbWrap.style.display = 'none';
    refDropMini.style.display = 'flex';
    btnClearImg.style.display = 'none';
  }
}

function renderApiStatus() {
  if (state.apiKey) {
    apiStatus.classList.remove('no'); apiStatus.classList.add('ok');
    apiStatus.textContent = 'key loaded';
  } else {
    apiStatus.classList.remove('ok'); apiStatus.classList.add('no');
    apiStatus.textContent = 'no key';
  }
}

function renderAll() {
  renderTimeline();
  renderIndicator();
  renderRunButtons();
  renderRef();
  renderApiStatus();
}

// ─── Input handlers ───────────────────────────────────────────
inA.addEventListener('input', e => { state.brandA = e.target.value; renderTimeline(); });
inB.addEventListener('input', e => { state.brandB = e.target.value; renderTimeline(); });
inV.addEventListener('input', e => { state.vibe   = e.target.value; renderTimeline(); });
inKey.addEventListener('input', e => {
  state.apiKey = e.target.value.trim();
  localStorage.setItem(LS_KEY, state.apiKey);
  renderApiStatus(); renderRunButtons();
});
btnEye.addEventListener('click', () => {
  inKey.type = inKey.type === 'password' ? 'text' : 'password';
});
inModel.addEventListener('change', e => {
  state.model = e.target.value;
  localStorage.setItem(LS_MODEL, state.model);
});

// ─── Image upload ─────────────────────────────────────────────
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const parsed = parseDataUrl(ev.target.result);
    if (!parsed) return;
    state.refImage = parsed;
    state.refName = file.name || 'reference';
    renderAll();
  };
  reader.readAsDataURL(file);
}
imgInput.addEventListener('change', (e) => loadFile(e.target.files[0]));
refDropMini.addEventListener('click', () => imgInput.click());
btnClearImg.addEventListener('click', () => {
  state.refImage = null; state.refName = null;
  imgInput.value = '';
  renderAll();
});

['dragenter','dragover'].forEach(evt => {
  refDropMini.addEventListener(evt, (e) => { e.preventDefault(); refDropMini.classList.add('dragging'); });
});
['dragleave','drop'].forEach(evt => {
  refDropMini.addEventListener(evt, (e) => { e.preventDefault(); refDropMini.classList.remove('dragging'); });
});
refDropMini.addEventListener('drop', (e) => {
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  loadFile(file);
});

window.addEventListener('paste', (e) => {
  if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type && item.type.startsWith('image/')) {
      loadFile(item.getAsFile());
      e.preventDefault();
      return;
    }
  }
});

// ─── Gemini call ──────────────────────────────────────────────
async function callGemini(prompt, inputImages, signal) {
  if (!state.apiKey) throw new Error('no API key');
  const parts = [{ text: prompt }];
  for (const img of inputImages) {
    parts.push({ inline_data: { mime_type: img.mimeType, data: img.base64 } });
  }
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(state.model)}:generateContent`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': state.apiKey },
    body: JSON.stringify({
      contents: [{ parts }],
      generationConfig: { responseModalities: ['IMAGE'] }
    }),
    signal,
  });
  if (!res.ok) {
    let detail = '';
    try { const j = await res.json(); detail = (j.error && j.error.message) || JSON.stringify(j); }
    catch { detail = await res.text(); }
    throw new Error(`${res.status}: ${detail.slice(0, 240)}`);
  }
  const data = await res.json();
  const cand = data.candidates && data.candidates[0];
  const parts2 = cand && cand.content && cand.content.parts;
  if (!parts2) {
    const reason = cand && cand.finishReason ? `finishReason=${cand.finishReason}` : 'no candidate parts';
    throw new Error(`no image returned (${reason})`);
  }
  const imgPart = parts2.find(p => p.inlineData || p.inline_data);
  if (!imgPart) {
    const txt = parts2.find(p => p.text);
    throw new Error(`no image returned${txt ? ' — model said: ' + txt.text.slice(0,160) : ''}`);
  }
  const inl = imgPart.inlineData || imgPart.inline_data;
  const mime = inl.mimeType || inl.mime_type || 'image/png';
  const dataUrl = `data:${mime};base64,${inl.data}`;
  return parseDataUrl(dataUrl);
}

// ─── Step runner ──────────────────────────────────────────────
async function generateStep(i) {
  if (!state.apiKey)   { showToast('add Gemini API key first', true); return; }
  if (!state.refImage) { showToast('upload a reference image first', true); return; }
  if (state.running)   return;

  // For steps > 0 that depend on previous output, generate dependencies first if missing
  if (i > 0 && !state.outputs[i - 1]) {
    // Only step 1 strictly depends on step 0 output (others fall back to ref if missing)
    if (i === 1) {
      // generate step 0 first, then this one
      await runFrom(0, i);
      return;
    }
  }

  await runFrom(i, i);
}

async function runAll() {
  await runFrom(0, STEPS.length - 1);
}

async function runNext() {
  // Find the first non-done step
  const idx = state.status.findIndex(s => s !== 'done');
  if (idx === -1) { showToast('all 5 done'); return; }
  await runFrom(idx, idx);
}

async function runFrom(start, end) {
  if (state.running) return;
  if (!state.apiKey)   { showToast('add Gemini API key first', true); return; }
  if (!state.refImage) { showToast('upload a reference image first', true); return; }

  state.running = true;
  state.abort = new AbortController();
  renderRunButtons(); renderIndicator();

  try {
    for (let i = start; i <= end; i++) {
      if (state.abort.signal.aborted) break;
      const step = STEPS[i];
      state.status[i] = 'running';
      state.errors[i] = null;
      renderTimeline(); renderIndicator();

      try {
        const prompt = step.build(state);
        const inputs = step.inputs(state);
        const result = await callGemini(prompt, inputs, state.abort.signal);
        state.outputs[i] = result;
        state.status[i] = 'done';
        renderTimeline(); renderIndicator();
      } catch (e) {
        if (e.name === 'AbortError') {
          state.status[i] = 'idle';
        } else {
          state.status[i] = 'error';
          state.errors[i] = (e.message || String(e));
          renderTimeline(); renderIndicator();
          // stop the chain on error
          break;
        }
      }
    }
  } finally {
    state.running = false;
    state.abort = null;
    renderRunButtons(); renderIndicator();
  }
}

btnRunAll.addEventListener('click', runAll);
btnRunNext.addEventListener('click', runNext);
btnStop.addEventListener('click', () => {
  if (state.abort) state.abort.abort();
  showToast('stopping...');
});
btnReset.addEventListener('click', () => {
  if (state.running) return;
  state.outputs = [null,null,null,null,null];
  state.status = ['idle','idle','idle','idle','idle'];
  state.errors = [null,null,null,null,null];
  renderAll();
  showToast('outputs cleared');
});

// ─── Copy & export ────────────────────────────────────────────
btnCopyAll.addEventListener('click', () => {
  const all = STEPS.map((s, i) =>
    `─── PROMPT ${String(i+1).padStart(2,'0')} — ${s.title.toUpperCase()} ───\n\n${s.build(state)}`
  ).join('\n\n\n');
  copyText(all);
});

function downloadImage(i) {
  const out = state.outputs[i];
  if (!out) return;
  const step = STEPS[i];
  const a = state.brandA.trim() || 'campaign';
  const b = state.brandB.trim();
  const slug = (a + (b ? '-x-' + b : '')).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'campaign';
  const ext = (out.mimeType.split('/')[1] || 'png');
  const link = document.createElement('a');
  link.href = out.dataUrl;
  link.download = `${slug}-${String(i+1).padStart(2,'0')}-${step.key}.${ext}`;
  document.body.appendChild(link); link.click(); link.remove();
}

btnExportImgs.addEventListener('click', () => {
  const any = state.outputs.some(o => o);
  if (!any) { showToast('no images yet', true); return; }
  state.outputs.forEach((o, i) => { if (o) downloadImage(i); });
});

btnExportMd.addEventListener('click', () => {
  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const a = state.brandA.trim() || '(brand A)';
  const b = state.brandB.trim();
  const vibe = state.vibe.trim() || '—';
  const refLine = state.refName ? `\`${state.refName}\`` : '_none uploaded_';

  let md = `# Campaign Brief\n\n`;
  md += `> Generated with **Campaign Engine** — tropicOS · ${stamp}\n> Model: \`${state.model}\`\n\n`;
  md += `## Inputs\n\n`;
  md += `- **Brand A**: ${a}\n`;
  md += `- **Brand B**: ${b || '_(none)_'}\n`;
  md += `- **Vibe**: ${vibe}\n`;
  md += `- **Reference image**: ${refLine}\n\n`;
  md += `---\n\n`;
  md += `## Workflow — 5 prompts (in order)\n\n`;
  STEPS.forEach((s, i) => {
    const st = state.status[i];
    md += `### ${String(i+1).padStart(2,'0')}. ${s.title} _(${st})_\n\n`;
    md += '```text\n' + s.build(state) + '\n```\n\n';
  });
  md += `---\n\n_Workflow based on the "image-to-engine" method by @AmirMushich._\n`;

  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const slug = (a + (b ? '-x-' + b : '')).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'campaign';
  link.href = url; link.download = `${slug}-brief.md`;
  document.body.appendChild(link); link.click(); link.remove();
  URL.revokeObjectURL(url);
  showToast('brief.md downloaded');
});

// ─── Init ─────────────────────────────────────────────────────
const savedKey = localStorage.getItem(LS_KEY);
if (savedKey) { state.apiKey = savedKey; inKey.value = savedKey; }
const savedModel = localStorage.getItem(LS_MODEL);
if (savedModel) { state.model = savedModel; inModel.value = savedModel; }
renderAll();
</script>
