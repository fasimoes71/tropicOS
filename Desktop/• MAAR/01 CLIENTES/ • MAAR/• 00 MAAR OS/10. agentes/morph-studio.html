<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morph Studio — tropicOS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --glass:        rgba(255,255,255,0.90);
  --glass-border: rgba(0,0,0,0.13);
  --text:         #1a1a1a;
  --muted:        #6a6a6a;
  --font:         'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

html, body { height: 100%; overflow: hidden; }

body {
  background: #f7f7f9;
  font-family: var(--font);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ─── Canvas ──────────────────────────────────────── */
#wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
#c    { display: block; }

/* ─── Logo ────────────────────────────────────────── */
#logo {
  position: absolute; top: 16px; left: 20px;
  pointer-events: none; z-index: 10;
}
#logo-text { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1; }
#logo-sub  { font-size: 10px; color: var(--muted); line-height: 1; margin-top: 1px; }

/* ─── Static / Motion pill — top right ───────────── */
#mode-toggle {
  position: absolute; top: 16px; right: 20px;
  display: flex; align-items: center; gap: 2px;
  background: var(--glass);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--glass-border);
  border-radius: 100px; padding: 3px; z-index: 10;
}
.mtbtn {
  font-family: var(--font); font-size: 9.5px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); padding: 5px 14px;
  border-radius: 100px; border: none; background: transparent;
  cursor: pointer; transition: all 0.18s; line-height: 1;
}
.mtbtn.on { background: var(--text); color: #fff; }

/* ─── Bottom buttons ──────────────────────────────── */
#bottom-btns {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px;
  background: var(--glass);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--glass-border);
  border-radius: 100px; padding: 4px; z-index: 10;
  transition: opacity .2s;
}
#bottom-btns.hidden { opacity: 0; pointer-events: none; }
.bb {
  font-family: var(--font); font-size: 9.5px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); padding: 6px 16px;
  border-radius: 100px; border: none; background: transparent;
  cursor: pointer; transition: all 0.18s; line-height: 1;
}
.bb.primary        { background: var(--text); color: #fff; }
.bb.primary-morph  { background: #32EE66; color: #1a1a1a; }
.morph-arrow {
  display: inline-block;
  animation: arrow-nudge 1.2s ease-in-out infinite;
}
@keyframes arrow-nudge {
  0%, 100% { transform: translateX(0); }
  50%       { transform: translateX(4px); }
}
.bb:hover:not(.primary):not(.primary-morph) { color: var(--text); background: rgba(0,0,0,0.05); }
.bb.primary:hover       { opacity: .8; }
.bb.primary-morph:hover { opacity: .8; }

/* ─── REC ─────────────────────────────────────────── */
#rec-bar {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px;
  font-size: 9px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: #ef4444; opacity: 0; transition: opacity .3s; z-index: 10; pointer-events: none;
}
#rec-bar.on { opacity: 1; }
.rec-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

/* ─── Floating boxes ──────────────────────────────── */
.fbox {
  position: absolute; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: stretch;
  width: 152px;
  background: var(--glass);
  backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border: 1px solid var(--glass-border);
  border-radius: 20px; padding: 18px 14px; z-index: 10;
  box-shadow: 0 16px 56px rgba(0,0,0,0.13), 0 1px 0 rgba(255,255,255,0.70) inset;
}
#bar-left  { left: 20px; }
#bar-right { right: 20px; }

/* Section */
.bs { display: flex; flex-direction: column; gap: 5px; padding: 12px 0; }
.bs:first-child { padding-top: 0; }
.bs:last-child  { padding-bottom: 0; }

.bl { font-size: 9.5px; font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text); line-height: 1; }
.bd { width: 100%; height: 1px; background: rgba(0,0,0,0.14); flex-shrink: 0; }
.pr { display: flex; flex-direction: column; gap: 3px; }

/* Pills */
.pbtn {
  width: 100%; height: 28px; padding: 0 10px;
  border-radius: 8px; border: 1px solid rgba(0,0,0,0.07);
  background: transparent; font-family: var(--font);
  font-size: 11px; font-weight: 500; color: var(--muted);
  cursor: pointer; transition: all 0.18s; text-align: left; line-height: 1;
}
.pbtn:hover { background: rgba(0,0,0,0.04); color: var(--text); }
.pbtn.on    { background: var(--text); color: #fff; border-color: var(--text); }

/* Intensity */
.int-wrap { display: flex; flex-direction: column; gap: 6px; }
.int-labels { display: flex; justify-content: space-between; font-size: 8.5px; color: var(--muted); }
.sl-track-wrap { position: relative; padding-top: 12px; }
.sl-thumb-label {
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  color: var(--text);
  font-size: 9.5px; font-weight: 600; letter-spacing: 0.02em;
  pointer-events: none; white-space: nowrap;
  opacity: 1;
}
.sl-thumb-label.visible { opacity: 1; }

input[type=range].sl {
  -webkit-appearance: none; width: 100%; height: 3px;
  border-radius: 2px; background: #32EE66;
  outline: none; cursor: pointer; margin: 0;
}
input[type=range].sl::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px;
  border-radius: 50%; background: var(--text); cursor: pointer;
  border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.22);
  transition: transform .1s;
}
input[type=range].sl::-webkit-slider-thumb:hover { transform: scale(1.25); }

/* Swatches */
.sw-row { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
.sw {
  width: 20px; height: 20px; border-radius: 50%;
  cursor: pointer; border: 2px solid transparent;
  transition: all 0.18s; flex-shrink: 0;
}
.sw:hover { transform: scale(1.12); }
.sw.on { border-color: #888 !important; box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 0 3.5px #888 !important; }

/* Gradient angle row */
.grad-angle-row { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.grad-preview {
  width: 100%; height: 6px; border-radius: 3px;
  background: #1a1a1a; margin-bottom: 2px;
  transition: background .2s;
}

/* Image fill preview */
#fill-preview { margin-top: 6px; }
#fill-thumb {
  width: 100%; height: 52px; object-fit: cover;
  border-radius: 8px; display: block;
  border: 1px solid var(--glass-border);
}
.fill-clear {
  width: 100%; height: 28px; margin-top: 4px; padding: 0 10px;
  background: transparent; color: var(--muted);
  border: 1px solid rgba(0,0,0,0.12); border-radius: 8px;
  font-family: var(--font); font-size: 10px; font-weight: 500;
  letter-spacing: 0.04em; cursor: pointer;
  transition: all 0.18s; text-align: left; line-height: 1;
}
.fill-clear:hover { border-color: #ef4444; color: #ef4444; }

/* Export buttons */
.ex-btn {
  width: 100%; height: 30px; padding: 0 10px;
  background: var(--text); color: #fff; border: none;
  border-radius: 8px; font-family: var(--font);
  font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
  cursor: pointer; transition: opacity 0.18s; text-align: left; line-height: 1;
}
.ex-btn:hover { opacity: .75; }
.ex-ghost {
  width: 100%; height: 30px; padding: 0 10px;
  background: transparent; color: var(--muted);
  border: 1px solid rgba(0,0,0,0.12); border-radius: 8px;
  font-family: var(--font); font-size: 10px; font-weight: 500;
  letter-spacing: 0.04em; cursor: pointer;
  transition: all 0.18s; text-align: left; line-height: 1;
}
.ex-ghost:hover { border-color: var(--text); color: var(--text); }

/* PNG dropdown */
.png-wrap { position: relative; width: 100%; }
.png-main { width: 100%; }
.png-sizes {
  position: absolute; top: 100%; left: -6px; right: -6px;
  display: flex; gap: 4px;
  padding-top: 6px; padding-bottom: 2px; /* invisible bridge above + below */
  opacity: 0; pointer-events: none;
  transform: translateY(-4px);
  transition: opacity .15s, transform .15s;
}
.png-wrap:hover .png-sizes { opacity: 1; pointer-events: all; transform: translateY(0); }
.png-size-btn {
  flex: 1; height: 36px;
  background: var(--text); color: #fff; border: none;
  border-radius: 8px; font-family: var(--font);
  font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
  cursor: pointer; transition: opacity 0.18s;
}
.png-size-btn:hover { opacity: .75; }

/* Collapsible */
.bs-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
.bs-toggle { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: transform 0.25s; flex-shrink: 0; }
.bs-toggle::before { content: ''; display: block; width: 7px; height: 7px; border-right: 1.8px solid currentColor; border-bottom: 1.8px solid currentColor; transform: rotate(45deg) translate(-1px, -2px); }
.bs.collapsed .bs-toggle { transform: rotate(-90deg); }
.bs.collapsed .pr        { display: none; }

#hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 500; color: rgba(0,0,0,0.42); letter-spacing: 0.04em; pointer-events: none; z-index: 5; white-space: nowrap; }

/* Hints rotator */
#hints-box {
  position: absolute; top: 16px; right: 20px;
  text-align: right; pointer-events: none; z-index: 20;
  height: 16px; overflow: visible;
}
.hint-line {
  font-size: 10px; font-weight: 500; letter-spacing: 0.05em;
  color: rgba(0,0,0,0.55); line-height: 16px; white-space: nowrap;
  position: absolute; right: 0;
  opacity: 0; transform: translateY(5px);
  transition: opacity .4s, transform .4s;
}
.hint-line.active { opacity: 1; transform: translateY(0); }
.hint-dot {
  display: inline-block;
  width: 0; height: 0;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  border-left: 7px solid #32EE66;
  margin-right: 6px; vertical-align: middle;
  position: relative; top: -1px; flex-shrink: 0;
}

/* Motion param rows */
.ms-row { display: flex; flex-direction: column; gap: 4px; }
.ms-hdr { display: flex; justify-content: space-between; align-items: center; }
.ms-lbl { font-size: 9px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.ms-val {
  font-size: 10px; font-weight: 600; color: var(--text);
  width: 34px; text-align: right; border: none; background: transparent;
  outline: none; font-family: var(--font); padding: 0; cursor: default;
  border-radius: 4px; -moz-appearance: textfield;
}
.ms-val::-webkit-inner-spin-button, .ms-val::-webkit-outer-spin-button { -webkit-appearance: none; }
.ms-val:focus { background: rgba(0,0,0,0.06); cursor: text; }
.ms-row input[type=range].sl { margin: 0; }
</style>
</head>
<body>

<div id="logo">
  <div id="logo-text">MorphStudio</div>
  <div id="logo-sub">by tropicOS</div>
</div>


<div id="hints-box"></div>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="bottom-btns">
  <button class="bb" id="btn-original" onclick="resetToOriginal()">↺ Original</button>
  <button class="bb primary-morph" id="btn-morph" onclick="morphNew()"><span class="morph-arrow">→</span> Morph</button>
</div>

<div id="rec-bar"><div class="rec-dot"></div> REC</div>

<!-- LEFT: Curves + Intensity + ... -->
<div class="fbox" id="bar-left">

  <div class="bs">
    <div class="bl">Curves</div>
    <div class="pr">
      <button class="pbtn"    id="curve-organic"   onclick="setCurve('organic',this)">Organic</button>
      <button class="pbtn on" id="curve-mix"        onclick="setCurve('mix',this)">Mix</button>
      <button class="pbtn"    id="curve-geometric"  onclick="setCurve('geometric',this)">Geometric</button>
    </div>
  </div>

  <div class="bd"></div>

  <div class="bs">
    <div class="bl">Intensity</div>
    <div class="int-wrap">
      <div class="sl-track-wrap">
        <div class="sl-thumb-label" id="int-thumb-label">50%</div>
        <input type="range" class="sl" id="sl-int" min="0" max="100" value="50" oninput="onIntensity(this.value)">
      </div>
      <div class="int-labels"><span>original</span><span>max</span></div>
    </div>
  </div>

  <div class="bd"></div>

  <!-- Mode toggle inside panel -->
  <div class="bs">
    <div class="bl">Mode</div>
    <div class="pr" style="flex-direction:row;gap:4px">
      <button class="pbtn on" id="btn-static" style="flex:1;text-align:center" onclick="setMode('static')">Static</button>
      <button class="pbtn"    id="btn-motion" style="flex:1;text-align:center" onclick="setMode('motion')">Motion</button>
    </div>
  </div>

  <div class="bd"></div>

  <!-- Bounce section -->
  <div class="bs collapsible" id="sec-bounce">
    <div class="bs-header"><div class="bl">Bounce</div><span class="bs-toggle"></span></div>
    <div class="pr">
      <button class="pbtn on" onclick="setBounce('elastic',this)">Elastic</button>
      <button class="pbtn"    onclick="setBounce('overshoot',this)">Overshoot</button>
      <button class="pbtn"    onclick="setBounce('wobble',this)">Wobble</button>
    </div>
  </div>

  <div class="bd" id="bd-motion" style="display:none"></div>

  <!-- Motion params -->
  <div class="bs" id="sec-motion" style="display:none">
    <div class="bl">Motion</div>
    <div class="pr" style="gap:8px">
      <div class="ms-row">
        <div class="ms-hdr"><span class="ms-lbl">Speed</span><input type="number" class="ms-val" id="val-speed" value="40" min="1" max="100"></div>
        <input type="range" class="sl" id="sl-speed" min="1" max="100" value="40">
      </div>
      <div class="ms-row">
        <div class="ms-hdr"><span class="ms-lbl">Frequency</span><input type="number" class="ms-val" id="val-freq" value="25" min="5" max="80"></div>
        <input type="range" class="sl" id="sl-freq" min="5" max="80" value="25">
      </div>
      <div class="ms-row">
        <div class="ms-hdr"><span class="ms-lbl">Chaos</span><input type="number" class="ms-val" id="val-chaos" value="20" min="0" max="100"></div>
        <input type="range" class="sl" id="sl-chaos" min="0" max="100" value="20">
      </div>
      <div class="ms-row">
        <div class="ms-hdr"><span class="ms-lbl">Smooth</span><input type="number" class="ms-val" id="val-smooth" value="12" min="1" max="40"></div>
        <input type="range" class="sl" id="sl-smooth" min="1" max="40" value="12">
      </div>
    </div>
  </div>

</div>

<!-- RIGHT: Colors + Export -->
<div class="fbox" id="bar-right">

  <div class="bs">
    <div class="bl">Shape</div>
    <div class="pr">
      <input type="file" id="svg-input" accept=".svg,image/svg+xml" style="display:none" onchange="loadSVGFile(this)">
      <button class="ex-ghost" id="btn-upload-svg" onclick="document.getElementById('svg-input').click()">↑ Upload SVG</button>
      <div id="svg-info" style="display:none;margin-top:4px">
        <div id="svg-name" style="font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px"></div>
        <button class="fill-clear" onclick="resetDefaultShape()">↺ Default shape</button>
      </div>
    </div>
  </div>

  <div class="bd"></div>

  <div class="bs">
    <div class="bl">Logo</div>
    <div class="sw-row" id="logo-swatches">
      <div class="sw on" data-c="#1a1a1a" style="background:#1a1a1a"                                          onclick="setLogoColor(this)"></div>
      <div class="sw"    data-c="#ffffff" style="background:#fff;border:1px solid rgba(0,0,0,.15)"            onclick="setLogoColor(this)"></div>
      <div class="sw"    data-c="#3d3d3d" style="background:#3d3d3d"                                          onclick="setLogoColor(this)"></div>
      <div class="sw"    data-c="#b0b0b0" style="background:#b0b0b0"                                          onclick="setLogoColor(this)"></div>
      <div class="sw"    data-c="#32EE66" style="background:#32EE66"                                          onclick="setLogoColor(this)"></div>
    </div>
    <div class="grad-angle-row" id="grad-angle-row" style="display:none">
      <div class="grad-preview" id="grad-preview"></div>
      <div class="ms-hdr"><span class="ms-lbl">Angle</span><input type="number" class="ms-val" id="val-grad-angle" value="0" min="0" max="360"></div>
      <input type="range" class="sl" id="sl-grad-angle" min="0" max="360" value="0">
    </div>
  </div>

  <div class="bd"></div>

  <div class="bs">
    <div class="bl">Background</div>
    <div class="sw-row" id="bg-swatches">
      <div class="sw on" data-c="#f7f7f9" style="background:#f7f7f9;border:1px solid rgba(0,0,0,.12)"          onclick="setBgColor(this)"></div>
      <div class="sw"    data-c="#1a1a1a" style="background:#1a1a1a"                                             onclick="setBgColor(this)"></div>
      <div class="sw"    data-c="#3d3d3d" style="background:#3d3d3d"                                             onclick="setBgColor(this)"></div>
      <div class="sw"    data-c="#b0b0b0" style="background:#b0b0b0"                                             onclick="setBgColor(this)"></div>
      <div class="sw"    data-c="#32EE66" style="background:#32EE66"                                             onclick="setBgColor(this)"></div>
    </div>
  </div>

  <div class="bd"></div>

  <div class="bs" id="sec-fill">
    <div class="bl">Fill</div>
    <div class="pr">
      <input type="file" id="fill-input" accept="image/*" style="display:none" onchange="loadFillImage(this)">
      <button class="ex-ghost" id="btn-fill-img" onclick="document.getElementById('fill-input').click()">↑ Image</button>
      <div id="fill-preview" style="display:none">
        <img id="fill-thumb" src="">
        <button class="fill-clear" onclick="clearFillImage()">✕ Remove image</button>
      </div>
    </div>
  </div>

  <div class="bd"></div>

  <div class="bs">
    <div class="bl">Export</div>
    <div class="pr">
      <div class="png-wrap">
        <button class="ex-btn png-main">↓ PNG</button>
        <div class="png-sizes">
          <button class="png-size-btn" onclick="exportPNG(1080)">1080</button>
          <button class="png-size-btn" onclick="exportPNG(1920)">1920</button>
        </div>
      </div>
      <button class="ex-ghost" id="rec-btn" onclick="toggleRec()"><span style="color:#32EE66">⏺</span> Record WebM</button>
    </div>
  </div>

</div>

<script>
let ORIGINAL_D = "M652.67 0.0621738C691.228 1.63904 722 33.2446 722 72.0032C722 111.769 689.607 144.006 649.648 144.006C622.667 144.006 599.14 129.307 586.701 107.519L580.544 91.8618C569.757 57.5082 533.027 38.3615 498.506 49.0966C463.987 59.8318 444.747 96.3834 455.534 130.737L593.99 567.722C597 578.056 598.62 588.979 598.62 600.279C598.62 664.742 546.109 717 481.333 717C461.156 717 442.169 711.928 425.588 702.998C324.964 662.535 258.529 582.244 111.133 625.735C102.352 628.88 92.8848 630.596 83.0148 630.596C37.167 630.596 0 593.609 0 547.982C0 525.334 9.15776 504.815 23.989 489.891L384.855 27.1433C320.552 96.3947 215.033 193.826 174.177 226.131C123.846 265.926 79.4821 317.372 88.163 182.698C95.1078 74.9583 102.564 35.1472 104.172 27.1433C89.7036 68.9023 58.6458 155.761 50.1572 169.126C39.5472 185.83 27.0073 232.809 13.5036 182.698C7.15256e-05 132.586 0 11.4838 0 0H652.694L652.67 0.0621738Z";
let svgW = 722, svgH = 717;

// ─── PATH PARSER ─────────────────────────────────────────────────
function parsePath(d) {
  const cmds=[], re=/([MLHVCSQTAZmlhvcsqtaz])([^MLHVCSQTAZmlhvcsqtaz]*)/g; let m;
  while((m=re.exec(d))!==null) cmds.push({cmd:m[1], nums:m[2].trim().split(/[\s,]+/).filter(Boolean).map(Number)});
  return cmds;
}

function flattenPoints(cmds) {
  const pts=[];
  for(const{cmd,nums}of cmds){
    if('ML'.includes(cmd)) for(let i=0;i<nums.length;i+=2) pts.push({x:nums[i],y:nums[i+1]});
    else if(cmd==='C') for(let i=0;i<nums.length;i+=6){
      pts.push({x:nums[i],y:nums[i+1]});
      pts.push({x:nums[i+2],y:nums[i+3]});
      pts.push({x:nums[i+4],y:nums[i+5]});
    }
    else if(cmd==='H') pts.push({x:nums[0],y:0});
    else if(cmd==='V') pts.push({x:0,y:nums[0]});
  }
  return pts;
}

// Build path with curve style applied
// 'mix'      = displaced bezier handles (original)
// 'organic'  = smooth catmull-rom-like curves through anchors only
// 'geometric'= straight lines between anchors (no curves)
function buildPath(cmds, pts) {
  const mode = (typeof st !== 'undefined') ? st.curve : 'mix';
  let i=0, r='';

  // For organic mode: extract anchor points only (skip control points)
  // so we can compute proper Catmull-Rom tangents across the whole shape
  let anchors = [];
  if(mode === 'organic') {
    let ai=0;
    for(const{cmd,nums}of cmds){
      if('ML'.includes(cmd)) for(let j=0;j<nums.length;j+=2) anchors.push({x:pts[ai].x,y:pts[ai].y,pi:ai++});
      else if(cmd==='C') { ai+=2; anchors.push({x:pts[ai].x,y:pts[ai].y,pi:ai}); ai++; }
      else if(cmd==='H'||cmd==='V') ai++;
    }
  }

  let anchorIdx = 0;
  let prevAnchorX=0, prevAnchorY=0;
  i=0;

  for(const{cmd,nums}of cmds){
    if('ML'.includes(cmd)){
      r+=cmd;
      for(let j=0;j<nums.length;j+=2){
        r+=`${pts[i].x} ${pts[i].y} `;
        prevAnchorX=pts[i].x; prevAnchorY=pts[i].y;
        anchorIdx++;
        i++;
      }
    } else if(cmd==='C'){
      for(let j=0;j<nums.length;j+=6){
        const ax=pts[i+2].x, ay=pts[i+2].y;

        if(mode==='geometric'){
          r+=`L${ax} ${ay} `;
        } else if(mode==='organic'){
          // Catmull-Rom: tangent at each point = (next - prev) * tension
          const tension = 0.45;
          const prev = anchors[Math.max(0, anchorIdx-1)];
          const curr = anchors[anchorIdx] || {x:ax, y:ay};
          const next = anchors[Math.min(anchors.length-1, anchorIdx+1)];
          const nextnext = anchors[Math.min(anchors.length-1, anchorIdx+2)];

          // handle leaving prevAnchor
          const t1x = (curr.x - (anchors[Math.max(0,anchorIdx-2)] || prev).x) * tension;
          const t1y = (curr.y - (anchors[Math.max(0,anchorIdx-2)] || prev).y) * tension;
          // handle entering curr anchor
          const t2x = (next.x - prev.x) * tension;
          const t2y = (next.y - prev.y) * tension;

          const h1x = prevAnchorX + t1x, h1y = prevAnchorY + t1y;
          const h2x = ax - t2x,          h2y = ay - t2y;
          r+=`C${h1x} ${h1y} ${h2x} ${h2y} ${ax} ${ay} `;
          anchorIdx++;
        } else {
          r+=`C${pts[i].x} ${pts[i].y} ${pts[i+1].x} ${pts[i+1].y} ${ax} ${ay} `;
        }

        prevAnchorX=ax; prevAnchorY=ay;
        i+=3;
      }
    } else if(cmd==='H'){ r+=`H${nums[0]}`; i++; }
    else if(cmd==='V'){   r+=`V${nums[0]}`; i++; }
    else { r+=cmd; }
  }
  return r;
}


function hash(n){const x=Math.sin(n)*43758.5453;return x-Math.floor(x);}
function noise2(x,y){
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=hash(ix+iy*57),b=hash(ix+1+iy*57),c=hash(ix+(iy+1)*57),d=hash(ix+1+(iy+1)*57);
  return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy;
}

// ─── EASINGS ─────────────────────────────────────────────────────
const easings={
  elastic:   t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(2*Math.PI)/3)+1,
  overshoot: t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
  spring:    t=>t>=1?1:1-Math.exp(-6*t)*Math.cos(8*t),
  wobble:    t=>t>=1?1:1-Math.exp(-8*t)*Math.cos(12*t),
  snap:      t=>t<.7?t/.7*1.05:t<.85?1.05-(t-.7)/.15*.08:.97+(t-.85)/.15*.03,
  jelly:     t=>t>=1?1:1-Math.exp(-7*t)*(Math.cos(14*t)+.3*Math.sin(14*t)),
};

// ─── STATE ───────────────────────────────────────────────────────
let cmds=parsePath(ORIGINAL_D), basePts=flattenPoints(cmds);

let st = {
  logoColors:    ['#1a1a1a'],
  gradientAngle: 0,
  bgColor:       '#f7f7f9',
  intensity: 50,
  curve:     'mix',       // 'organic' | 'mix' | 'geometric'
  bounce:    'elastic',
  mode:      'static',    // 'static' | 'motion'
  speed:40, freq:25, chaos:20, smooth:12,
  fillImage: null,
};

// always start showing the original logo
let currentPts = basePts.map(p=>({...p}));
let fromPts    = basePts.map(p=>({...p}));
let targetPts  = basePts.map(p=>({...p}));

let animating=false, animStart=null;
const ANIM_DUR=900;
let noiseT=0, smoothPts=null;
let isRec=false, mediaRec=null, recChunks=[];

// ─── CANVAS ──────────────────────────────────────────────────────
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d'), wrap=document.getElementById('wrap');
function resize(){canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;}
resize(); window.addEventListener('resize',resize);

// ─── GENERATE DISPLACED POINTS ───────────────────────────────────
function generateTarget(intensity){
  const amp=intensity*2.8, seed=Math.random()*1000, freq=2+Math.random()*4;
  return basePts.map(pt=>{
    const nx=pt.x/svgW, ny=pt.y/svgH;
    const dx=(noise2(nx*freq+seed,    ny*freq)      -.5)*amp*2
            +(noise2(nx*freq*2+seed*2,ny*freq*2)    -.5)*amp*.5;
    const dy=(noise2(nx*freq+seed*1.3,ny*freq+seed) -.5)*amp*2
            +(noise2(nx*freq*2,       ny*freq*2+seed*1.7)-.5)*amp*.5;
    return{x:pt.x+dx, y:pt.y+dy};
  });
}

// ─── MORPH CONTROLS ──────────────────────────────────────────────
function morphNew(){
  fromPts=currentPts.map(p=>({...p}));
  targetPts=generateTarget(st.intensity);
  animStart=null; animating=true;
  document.getElementById('btn-morph').classList.add('primary-morph');
  document.getElementById('btn-original').classList.remove('primary');
}

function resetToOriginal(){
  fromPts=currentPts.map(p=>({...p}));
  targetPts=basePts.map(p=>({...p}));
  animStart=null; animating=true;
  document.getElementById('btn-original').classList.add('primary');
  document.getElementById('btn-morph').classList.remove('primary-morph');
}

function lerpPts(a,b,t){
  return a.map((p,i)=>({x:p.x+(b[i].x-p.x)*t, y:p.y+(b[i].y-p.y)*t}));
}

// ─── RENDER LOOP ─────────────────────────────────────────────────
function render(ts){
  // motion mode: continuous noise
  if(st.mode==='motion' && !animating){
    noiseT += st.speed * 0.00044;
    const amp=st.intensity*2.0, freq=st.freq*0.1, chaos=st.chaos*0.01, seed=42;
    const lf=1/Math.max(st.smooth,1);
    const raw=basePts.map(pt=>{
      const nx=pt.x/svgW, ny=pt.y/svgH;
      let dx=(noise2(nx*freq+noiseT+seed,ny*freq)-.5)*amp*2
            +(noise2(nx*freq*2+seed*2,ny*freq*2+noiseT)-.5)*amp*.6;
      let dy=(noise2(nx*freq+seed*1.3,ny*freq+noiseT+seed)-.5)*amp*2
            +(noise2(nx*freq*2+noiseT*.7,ny*freq*2)-.5)*amp*.6;
      if(chaos>0){
        dx+=(noise2(nx*freq*3+noiseT*1.3+seed*2,ny*freq*3)-.5)*amp*chaos*2;
        dy+=(noise2(nx*freq*3+seed*3,ny*freq*3+noiseT*1.3)-.5)*amp*chaos*2;
      }
      return{x:pt.x+dx,y:pt.y+dy};
    });
    if(!smoothPts) smoothPts=raw.map(p=>({...p}));
    smoothPts=smoothPts.map((p,i)=>({x:p.x+(raw[i].x-p.x)*lf, y:p.y+(raw[i].y-p.y)*lf}));
    currentPts=smoothPts;
  }

  // snap animation (static mode morph/reset)
  if(animating){
    if(!animStart) animStart=ts;
    const rawT=Math.min((ts-animStart)/ANIM_DUR,1);
    const eased=easings[st.bounce](rawT);
    currentPts=lerpPts(fromPts,targetPts,Math.max(0,Math.min(eased,1)));
    if(rawT>=1){ animating=false; currentPts=targetPts.map(p=>({...p})); }
  }

  draw(ctx,canvas.width,canvas.height);
  requestAnimationFrame(render);
}

function buildLogoFill(context,svgW,svgH){
  const colors=st.logoColors;
  if(!colors.length) return 'transparent';
  if(colors.length===1) return colors[0];
  const cx=svgW/2, cy=svgH/2;
  const r=Math.sqrt(svgW*svgW+svgH*svgH)/2;
  const a=st.gradientAngle*Math.PI/180;
  const grad=context.createLinearGradient(
    cx-Math.cos(a)*r, cy-Math.sin(a)*r,
    cx+Math.cos(a)*r, cy+Math.sin(a)*r
  );
  colors.forEach((c,i)=>grad.addColorStop(i/(colors.length-1),c));
  return grad;
}

function draw(context,W,H){
  const pad=.12;
  const sc=Math.min(W,H)*(1-pad*2)/Math.max(svgW,svgH);
  const ox=W/2-svgW/2*sc, oy=H/2-svgH/2*sc;
  context.fillStyle=st.bgColor; context.fillRect(0,0,W,H);
  context.save(); context.translate(ox,oy); context.scale(sc,sc);
  const path=new Path2D(buildPath(cmds,currentPts));
  if(st.fillImage){
    context.save();
    context.clip(path);
    // compute actual bounding box of current (possibly morphed) points
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    currentPts.forEach(p=>{
      if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
      if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
    });
    const bw=maxX-minX, bh=maxY-minY;
    const iw=st.fillImage.naturalWidth||st.fillImage.width;
    const ih=st.fillImage.naturalHeight||st.fillImage.height;
    const s=Math.max(bw/iw, bh/ih);
    const dw=iw*s, dh=ih*s;
    context.drawImage(st.fillImage, minX+(bw-dw)/2, minY+(bh-dh)/2, dw, dh);
    context.restore();
  } else {
    context.fillStyle=buildLogoFill(context,svgW,svgH);
    context.fill(path);
  }
  context.restore();
}

// ─── CONTROLS ────────────────────────────────────────────────────
function onIntensity(v){
  st.intensity=parseFloat(v);
  const sl=document.getElementById('sl-int');
  const lbl=document.getElementById('int-thumb-label');
  lbl.textContent=`${Math.round(v)}%`;
  const thumbW=13, pct=(v-sl.min)/(sl.max-sl.min);
  const x=thumbW/2+pct*(sl.clientWidth-thumbW);
  lbl.style.left=x+'px';
}


function setCurve(mode, btn){
  st.curve=mode;
  document.querySelectorAll('[id^="curve-"]').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  // always snap back to original when switching curve mode
  fromPts=currentPts.map(p=>({...p}));
  targetPts=basePts.map(p=>({...p}));
  animStart=null; animating=true;
}

function setBounce(style,btn){
  st.bounce=style;
  document.querySelectorAll('#sec-bounce .pbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

function setLogoColor(el){
  const c=el.dataset.c;
  const idx=st.logoColors.indexOf(c);
  if(idx>=0){ st.logoColors.splice(idx,1); el.classList.remove('on'); }
  else       { st.logoColors.push(c);       el.classList.add('on');    }
  updateGradientUI();
}

function updateGradientUI(){
  const row=document.getElementById('grad-angle-row');
  const prev=document.getElementById('grad-preview');
  const multi=st.logoColors.length>1;
  row.style.display=multi?'':'none';
  if(multi){
    const angle=st.gradientAngle;
    prev.style.background=`linear-gradient(${angle}deg,${st.logoColors.join(',')})`;
  }
}

function setGradientAngle(v){
  st.gradientAngle=parseFloat(v);
  document.getElementById('val-grad-angle').value=v;
  document.getElementById('sl-grad-angle').value=v;
  updateGradientUI();
}

function setBgColor(el){
  st.bgColor=el.dataset.c;
  document.querySelectorAll('#bg-swatches .sw').forEach(s=>s.classList.remove('on'));
  el.classList.add('on');
  document.body.style.background=el.dataset.c;
}

function setMode(mode){
  st.mode=mode;
  document.getElementById('btn-static').classList.toggle('on',mode==='static');
  document.getElementById('btn-motion').classList.toggle('on',mode==='motion');
  const bb=document.getElementById('bottom-btns');
  const secBounce=document.getElementById('sec-bounce');
  const secMotion=document.getElementById('sec-motion');
  const bdMotion=document.getElementById('bd-motion');
  if(mode==='motion'){
    bb.classList.add('hidden');
    secBounce.style.display='none';
    secMotion.style.display='';
    bdMotion.style.display='';
    smoothPts=null;
    // reset to original when entering motion
    currentPts=basePts.map(p=>({...p}));
  } else {
    bb.classList.remove('hidden');
    secBounce.style.display='';
    secMotion.style.display='none';
    fromPts=currentPts.map(p=>({...p}));
    targetPts=basePts.map(p=>({...p}));
    // snap back to original
    animStart=null; animating=true;
  }
}

// ─── IMAGE FILL ──────────────────────────────────────────────────
function loadFillImage(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      st.fillImage=img;
      document.getElementById('fill-thumb').src=e.target.result;
      document.getElementById('fill-preview').style.display='';
      document.getElementById('btn-fill-img').textContent='↑ Replace';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function clearFillImage(){
  st.fillImage=null;
  document.getElementById('fill-preview').style.display='none';
  document.getElementById('btn-fill-img').textContent='↑ Image';
  document.getElementById('fill-input').value='';
}

// ─── EXPORT ──────────────────────────────────────────────────────
function exportPNG(size=1080){
  const off=document.createElement('canvas'); off.width=off.height=size;
  draw(off.getContext('2d'),size,size);
  const a=document.createElement('a');
  a.download=`tropicos-morph-${Date.now()}.png`;
  a.href=off.toDataURL('image/png'); a.click();
}
function toggleRec(){ isRec?stopRec():startRec(); }
function startRec(){
  isRec=true; recChunks=[];
  document.getElementById('rec-bar').classList.add('on');
  document.getElementById('rec-btn').textContent='⏹ Stop';
  const stream=canvas.captureStream(60);
  mediaRec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'});
  mediaRec.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};
  mediaRec.onstop=()=>{
    const blob=new Blob(recChunks,{type:'video/webm'});
    const a=document.createElement('a');
    a.download=`tropicos-morph-${Date.now()}.webm`;
    a.href=URL.createObjectURL(blob); a.click();
  };
  mediaRec.start();
}
function stopRec(){
  isRec=false;
  document.getElementById('rec-bar').classList.remove('on');
  document.getElementById('rec-btn').textContent='⏺ Record WebM';
  if(mediaRec&&mediaRec.state!=='inactive') mediaRec.stop();
}

// ─── MOTION SLIDERS ──────────────────────────────────────────────
function syncMotion(key,sliderId,valId){
  const sl=document.getElementById(sliderId), val=document.getElementById(valId);
  if(!sl||!val) return;
  sl.addEventListener('input',e=>{st[key]=parseFloat(e.target.value);val.value=e.target.value;if(key==='smooth')smoothPts=null;});
  val.addEventListener('change',e=>{
    const v=Math.min(parseFloat(sl.max),Math.max(parseFloat(sl.min),parseFloat(e.target.value)||st[key]));
    st[key]=v; sl.value=v; val.value=v; if(key==='smooth')smoothPts=null;
  });
}
syncMotion('speed','sl-speed','val-speed');
syncMotion('freq','sl-freq','val-freq');
syncMotion('chaos','sl-chaos','val-chaos');
syncMotion('smooth','sl-smooth','val-smooth');

// ─── GRADIENT ANGLE SLIDER ───────────────────────────────────────
const slGrad=document.getElementById('sl-grad-angle');
const valGrad=document.getElementById('val-grad-angle');
if(slGrad){
  slGrad.addEventListener('input',e=>setGradientAngle(e.target.value));
  valGrad.addEventListener('change',e=>{
    const v=Math.min(360,Math.max(0,parseFloat(e.target.value)||0));
    setGradientAngle(v);
  });
}

// ─── COLLAPSIBLE ─────────────────────────────────────────────────
document.querySelectorAll('.bs.collapsible .bs-header').forEach(h=>{
  h.addEventListener('click',()=>h.closest('.bs').classList.toggle('collapsed'));
});

// ─── HINTS ───────────────────────────────────────────────────────
const HINTS = [
  'Click → morph into a new shape',
  'Click colors to build a gradient',
  'Select multiple colors for gradients',
  'Drag angle to rotate the gradient',
  'Intensity controls distortion amount',
  'Organic, mix or geometric curves',
  'Elastic, overshoot or wobble easing',
  'Motion mode for live animation',
  'Export PNG at 1080 or 1920 px',
  'Record animations as WebM',
  'Original resets to the base shape',
];
(function initHints(){
  const box=document.getElementById('hints-box');
  HINTS.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='hint-line';
    el.innerHTML=`<span class="hint-dot"></span>${t}`;
    box.appendChild(el);
  });
  let cur=0;
  const els=box.querySelectorAll('.hint-line');
  els[0].classList.add('active');
  setInterval(()=>{
    els[cur].classList.remove('active');
    cur=(cur+1)%HINTS.length;
    els[cur].classList.add('active');
  },3000);
})();

// ─── SVG UPLOAD ──────────────────────────────────────────────────
const DEFAULT_D = ORIGINAL_D;
const DEFAULT_W = 722, DEFAULT_H = 717;

function loadSVGFile(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const parser=new DOMParser();
    const doc=parser.parseFromString(e.target.result,'image/svg+xml');
    const svgEl=doc.querySelector('svg');
    if(!svgEl){ alert('SVG inválido.'); return; }

    // viewBox or width/height
    const vb=svgEl.getAttribute('viewBox');
    if(vb){
      const parts=vb.trim().split(/[\s,]+/).map(Number);
      if(parts.length>=4){ svgW=parts[2]; svgH=parts[3]; }
    } else {
      svgW=parseFloat(svgEl.getAttribute('width'))||100;
      svgH=parseFloat(svgEl.getAttribute('height'))||100;
    }

    // collect all <path> d attributes
    const paths=doc.querySelectorAll('path');
    if(!paths.length){ alert('Nenhum <path> encontrado no SVG.'); return; }
    const dParts=[];
    paths.forEach(p=>{ const d=p.getAttribute('d'); if(d) dParts.push(d); });
    ORIGINAL_D=dParts.join(' ');

    reinitShape();
    document.getElementById('svg-name').textContent=file.name;
    document.getElementById('svg-info').style.display='';
    document.getElementById('btn-upload-svg').textContent='↑ Replace SVG';
    input.value='';
  };
  reader.readAsText(file);
}

function resetDefaultShape(){
  ORIGINAL_D=DEFAULT_D; svgW=DEFAULT_W; svgH=DEFAULT_H;
  reinitShape();
  document.getElementById('svg-info').style.display='none';
  document.getElementById('btn-upload-svg').textContent='↑ Upload SVG';
  document.getElementById('svg-input').value='';
}

function reinitShape(){
  const newCmds=parsePath(ORIGINAL_D);
  const newBasePts=flattenPoints(newCmds);
  cmds.length=0; newCmds.forEach(c=>cmds.push(c));
  basePts.length=0; newBasePts.forEach(p=>basePts.push({...p}));
  currentPts=basePts.map(p=>({...p}));
  fromPts=basePts.map(p=>({...p}));
  targetPts=basePts.map(p=>({...p}));
  animating=false; smoothPts=null; noiseT=0;
  // snap reset buttons
  document.getElementById('btn-original').classList.remove('primary');
  document.getElementById('btn-morph').classList.remove('primary-morph');
}

// ─── INIT ────────────────────────────────────────────────────────
// start with motion section hidden, bounce visible
document.getElementById('sec-motion').style.display='none';

// set Mix as default selected curve
document.getElementById('curve-mix').classList.add('on');
document.getElementById('curve-organic').classList.remove('on');

requestAnimationFrame(render);
</script>
